<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13275e">
<title>Phase 10</title>
<style>
:root{--tk-bg:#13275e;--tk-panel:#f7f8ff;--tk-ink:#141a33;--tk-mute:#6b7396;--tk-line:#dfe3f3;--tk-accent:#ffb020;--tk-accent-ink:#141a33;
  --R:#e23b2e;--B:#2e6fd8;--G:#2fa35a;--Y:#e9a810;--cw:50px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#fff;background:radial-gradient(ellipse at 50% 20%,#2a4bb0,#0f1f4d 75%) fixed}
#setup{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.tk-logo{color:#ffd23a;text-shadow:0 4px 0 #0b1636,0 10px 20px rgba(0,0,0,.4)}
.tk-tag{color:#c9d4ff!important}
/* the table is locked to the screen (dvh = the visible height on phones, address bar included); only the board scrolls (the page never does) */
#game{max-width:680px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top)) 8px 0;height:100vh;height:100dvh;overflow-x:hidden;overflow-y:auto;display:flex;flex-direction:column}
#game[hidden],#setup[hidden]{display:none}
#game>*{flex:none}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.top .r{color:#c9d4ff;font-size:13px}.top button{font-size:24px;padding:0 10px;font-weight:900}
.myphase{background:#ffd23a;color:#141a33;border-radius:12px;padding:6px 10px;margin:6px 0;font-weight:900;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.myphase small{font-weight:700;opacity:.75}
.opps{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:4px 0}
.opp{min-width:84px;flex:0 1 104px;background:rgba(0,0,0,.25);border-radius:12px;padding:5px 8px;text-align:center;border:2px solid transparent}
.opp.on{border-color:#ffd23a}
.opp .nm{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opp .ph{font-size:12px;color:#ffd23a;font-weight:800}.opp .ct{font-size:11px;color:#c9d4ff}
.opp .sk{font-size:10px;background:#e23b2e;border-radius:999px;padding:1px 6px;font-weight:800}
#game>.board{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:6px;margin:6px 0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.board>*{flex:none}
.lrow{background:rgba(255,255,255,.07);border-radius:12px;padding:6px}
.lrow .who{font-size:12px;font-weight:800;color:#c9d4ff;margin-bottom:4px}
.groups{display:flex;gap:8px;flex-wrap:wrap}
.grp{display:flex;align-items:center;gap:0;padding:4px 6px 4px 4px;border-radius:10px;background:rgba(0,0,0,.22);border:2px dashed transparent;--cw:26px}
.grp.can{border-color:#ffd23a;cursor:pointer;background:rgba(255,210,58,.15)}
.grp .card{margin-left:-14px}.grp .card:first-child{margin-left:0}
.grp .gl{font-size:11px;font-weight:800;margin-left:6px;color:#c9d4ff;white-space:nowrap}
.mid{display:flex;justify-content:center;align-items:center;gap:20px;margin:4px 0}
.pile{position:relative;cursor:pointer}.pile .lbl{position:absolute;left:0;right:0;bottom:-18px;text-align:center;font-size:11px;font-weight:800;color:#c9d4ff}
.pile.glow .card{box-shadow:0 0 0 3px #ffd23a,0 6px 12px rgba(0,0,0,.4)}
.status{min-height:20px;text-align:center;font-weight:800;color:#e6ebff;margin:18px 6px 4px}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:44px;margin:4px 0}
.btn{padding:10px 16px;border-radius:12px;font-weight:900;font-size:15px;background:#fff;color:#13275e;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.btn.go{background:#ffd23a}.btn:disabled{opacity:.4}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.handwrap{padding:10px 4px calc(12px + env(safe-area-inset-bottom));background:rgba(0,0,0,.25);border-radius:18px 18px 0 0;margin:0 -8px}
.handlbl{text-align:center;font-size:12px;font-weight:800;color:#c9d4ff}
.hand{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;padding:12px 6px 0;--cw:min(50px,calc((100vw - 40px) / 7))}
.hand .card{transition:transform .12s}
.hand .card.sel{transform:translateY(-12px);box-shadow:0 0 0 3px #ffd23a,0 6px 12px rgba(0,0,0,.45)}
/* cards */
.card{position:relative;width:var(--cw);height:calc(var(--cw) * 1.45);border-radius:calc(var(--cw) * .14);background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);flex:none;user-select:none;cursor:pointer}
.card .f{position:absolute;inset:calc(var(--cw) * .06);border-radius:calc(var(--cw) * .1);background:var(--cc);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:calc(var(--cw) * .5);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.card .k{position:absolute;left:calc(var(--cw) * .12);top:calc(var(--cw) * .08);font-size:calc(var(--cw) * .22);font-weight:900;color:#fff}
.card.W .f{background:conic-gradient(var(--R) 0 25%,var(--B) 0 50%,var(--G) 0 75%,var(--Y) 0);font-size:calc(var(--cw) * .4)}
.card.S .f{background:#141a33;font-size:calc(var(--cw) * .22);letter-spacing:.04em}
.card.back{background:#141a33;border:2px solid #fff}.card.back .f{background:repeating-linear-gradient(45deg,#203a8a 0 6px,#13275e 6px 12px);font-size:calc(var(--cw) * .2);color:#ffd23a}
.card.big{--cw:66px}
@media (max-height:700px){.card.big{--cw:54px}.myphase{margin:4px 0}.acts{margin:2px 0}.status{margin-top:16px}}
.pick{display:block;width:100%;text-align:left;padding:12px;border-radius:12px;background:rgba(0,0,0,.06);margin-bottom:6px;font-weight:800}
.scores{width:100%;border-collapse:collapse;font-size:15px}.scores td,.scores th{padding:6px 4px;border-bottom:1px solid var(--tk-line);text-align:left}.scores td:last-child,.scores th:last-child{text-align:right}
.phases li{margin:2px 0}
html.gn-desktop{--cw:62px}html.gn-desktop .hand{--cw:62px}html.gn-desktop #game{max-width:1000px}html.gn-desktop .grp{--cw:38px}html.gn-desktop .card.big{--cw:84px}
</style>
</head>
<body>
<div id="setup"></div>
<div id="game" hidden></div>
<script>
/*TABLEKIT*/
</script>
<script>
/*ENGINE*/
</script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const { esc, sleep, store } = TK;
const SAVE = 'phase10.save.v1', PREFS = 'phase10.prefs.v1';
let G = null, busy = false, viewer = 0, lastShown = -1, sel = [], speed = 1;

function cardHtml(c, cls) {
  if (!c) return `<div class="card back ${cls || ''}"><div class="f">P10</div></div>`;
  if (P10.isW(c)) return `<div class="card W ${cls || ''}" data-id="${c.id}"><div class="f">W</div></div>`;
  if (P10.isS(c)) return `<div class="card S ${cls || ''}" data-id="${c.id}"><div class="f">SKIP</div></div>`;
  return `<div class="card ${cls || ''}" data-id="${c.id}" style="--cc:var(--${c.c})"><span class="k">${c.v}</span><div class="f">${c.v}</div></div>`;
}

// ---------- setup ----------
function setup() {
  G = null; $('#game').hidden = true; $('#setup').hidden = false;
  const saved = store.get(SAVE, null);
  TK.setup({
    el: $('#setup'), title: 'Phase 10', tagline: 'Ten phases of sets, runs and colors. First through Phase 10 wins.',
    prefsKey: PREFS, minP: 2, maxP: 6, defaults: { speed: 'normal' },
    options: [{ key: 'speed', label: 'Bot speed', type: 'seg', choices: [['slow', 'Slow'], ['normal', 'Normal'], ['fast', 'Fast']] }],
    resume: saved && !saved.over ? { text: `Round ${saved.round} · ` + saved.players.map(p => `${p.name} phase ${p.phase}`).join(' · '), onResume: () => { G = saved; start(); } } : null,
    onStart: (ps, prefs) => { G = P10.newGame(ps, {}); G.speed = prefs.speed; start(); },
    rules,
  });
}
const humans = () => G.players.map((p, i) => p.bot ? -1 : i).filter(i => i >= 0);
const pnp = () => humans().length > 1;
function save() { if (G && !G.over) store.set(SAVE, G); else store.del(SAVE); }
function start() {
  $('#setup').hidden = true; $('#game').hidden = false;
  speed = { slow: 1.6, normal: 1, fast: 0.5 }[G.speed || 'normal'];
  viewer = humans()[0]; lastShown = pnp() ? -1 : viewer; sel = [];
  render(); step();
}

// ---------- render ----------
const nameOf = i => G.players[i].bot || pnp() ? G.players[i].name : 'You';
function render(msg) {
  const g = G, me = viewer, p = g.players[me];
  const myTurn = g.turn === me && !p.bot && g.step !== 'roundover';
  const hand = p.hand.slice().sort((a, b) => key(a) - key(b));
  const selCards = sel.map(id => p.hand.find(c => c.id === id)).filter(Boolean);
  const canHitSel = myTurn && g.step === 'play' && p.laid && selCards.length === 1;
  const showHand = !pnp() || lastShown === me;
  const t = P10.top(g);
  const solve = !p.laid && showHand ? P10.solve(p.hand, p.phase) : null;
  const acts = [];
  if (myTurn && g.step === 'draw') acts.push('<button class="btn go" id="drawDeck">Draw from deck</button>', `<button class="btn" id="drawDisc" ${P10.canTakeDiscard(g) ? '' : 'disabled'}>Take ${t ? (P10.isS(t) ? 'skip' : P10.isW(t) ? 'wild' : t.v) : '—'}</button>`);
  if (myTurn && g.step === 'play') {
    if (!p.laid) {
      const ok = selCards.length && P10.splitPhase(selCards, p.phase);
      acts.push(`<button class="btn go" id="lay" ${ok ? '' : 'disabled'}>Lay down phase ${p.phase}</button>`);
      if (solve && solve.need === 0) acts.push('<button class="btn" id="suggest">Pick it for me</button>');
    }
    acts.push(`<button class="btn" id="disc" ${selCards.length === 1 ? '' : 'disabled'}>Discard${selCards.length === 1 ? (P10.isS(selCards[0]) ? ' skip' : '') : ''}</button>`);
  }
  const groupsHtml = g.players.map((q, owner) => q.laid ? `<div class="lrow"><div class="who">${esc(nameOf(owner))} · phase ${q.phase} ✓</div><div class="groups">${q.laid.map((gr, gi) =>
    `<div class="grp ${canHitSel && P10.canHit(gr, selCards[0]) ? 'can' : ''}" data-owner="${owner}" data-gi="${gi}">${gr.cards.slice().sort((a, b) => key(a) - key(b)).map(c => cardHtml(c)).join('')}<span class="gl">${gr.t === 'run' ? `${gr.lo}–${gr.hi}` : gr.t === 'set' ? `${gr.cards.length}× ${gr.v}` : `${gr.cards.length} ${({ R: 'red', B: 'blue', G: 'green', Y: 'yellow' })[gr.c]}`}</span></div>`).join('')}</div></div>` : '').join('');
  $('#game').innerHTML = `
    <div class="top"><span>Phase 10</span><span class="r">Round ${g.round}</span><button id="menu" aria-label="Menu">⋯</button></div>
    <div class="myphase"><span>${pnp() ? esc(p.name) + ': ' : ''}Phase ${Math.min(p.phase, 10)} — ${P10.phaseName(Math.min(p.phase, 10))}</span><small>${p.laid ? 'laid ✓' : solve && showHand ? (solve.need === 0 ? 'ready to lay!' : `${solve.need} card${solve.need > 1 ? 's' : ''} away`) : ''}</small></div>
    <div class="opps">${g.players.map((q, i) => i === me ? '' : `<div class="opp ${g.turn === i && g.step !== 'roundover' ? 'on' : ''}" data-seat="${i}"><div class="nm">${esc(q.name)}</div><div class="ph">Phase ${Math.min(q.phase, 10)}${q.laid ? ' ✓' : ''}</div><div class="ct">${q.hand.length} cards · ${q.score} pts</div>${q.skipped ? '<span class="sk">SKIPPED</span>' : ''}</div>`).join('')}</div>
    <div class="board">${groupsHtml || '<div style="text-align:center;color:#c9d4ff;font-size:13px;margin-top:8px">No phases laid down yet this round</div>'}</div>
    <div class="mid"><div class="pile ${myTurn && g.step === 'draw' ? 'glow' : ''}" id="deck">${cardHtml(null, 'big')}<span class="lbl">${g.deck.length} left</span></div><div class="pile ${myTurn && g.step === 'draw' && P10.canTakeDiscard(g) ? 'glow' : ''}" id="dpile">${t ? cardHtml(t, 'big') : '<div class="card big" style="opacity:.2"></div>'}<span class="lbl">discard</span></div></div>
    <div class="status">${msg || statusText()}</div>
    <div class="acts">${acts.join('')}</div>
    <div class="handwrap"><div class="handlbl">${esc(nameOf(me))} · ${p.hand.length} cards · ${p.score} pts</div><div class="hand" id="hand">${showHand ? hand.map(c => cardHtml(c, sel.indexOf(c.id) >= 0 ? 'sel' : '')).join('') : hand.map(() => cardHtml(null)).join('')}</div></div>`;
  $('#menu').onclick = menu;
  document.querySelectorAll('#hand .card[data-id]').forEach(el => el.onclick = () => { if (busy || !myTurn || g.step !== 'play') return; const id = +el.dataset.id; const k = sel.indexOf(id); if (k >= 0) sel.splice(k, 1); else sel.push(id); render(); });
  document.querySelectorAll('.grp').forEach(el => el.onclick = () => { if (!canHitSel) { if (myTurn && p.laid && g.step === 'play') render('Select one card, then tap the group it fits'); return; } const owner = +el.dataset.owner, gi = +el.dataset.gi; if (!P10.canHit(g.players[owner].laid[gi], selCards[0])) { TK.toast("That card doesn't fit there"); return; } P10.hit(g, me, owner, gi, selCards[0].id); sel = []; after(); });
  if ($('#drawDeck')) { $('#drawDeck').onclick = () => humanDraw('deck'); $('#deck').onclick = () => humanDraw('deck'); }
  if ($('#drawDisc')) { $('#drawDisc').onclick = () => humanDraw('disc'); $('#dpile').onclick = () => { if (P10.canTakeDiscard(g)) humanDraw('disc'); }; }
  if ($('#lay')) $('#lay').onclick = () => { try { P10.lay(g, me, sel.slice()); sel = []; TK.banner(`PHASE ${p.phase}!`); after(); } catch (e) { TK.toast(e.message); } };
  if ($('#suggest')) $('#suggest').onclick = () => { sel = solve.lay.flat().map(c => c.id); render(); };
  if ($('#disc')) $('#disc').onclick = () => humanDiscard();
}
const key = c => P10.isS(c) ? 200 : P10.isW(c) ? 100 : c.v * 4 + 'RBGY'.indexOf(c.c);
function statusText() {
  const g = G, p = g.players[g.turn];
  if (g.step === 'roundover') return `${g.players[g.roundWinner].name} went out!`;
  if (p.bot) return `${p.name} is playing…`;
  const who = pnp() ? `${p.name}: ` : '';
  if (g.step === 'draw') return who + 'draw from the deck or take the discard';
  if (!p.laid) return who + 'select cards for your phase and lay it down — or discard one card to end your turn';
  return who + 'hit: select a card and tap a group it fits. Discard one card to end your turn';
}

// ---------- human ----------
async function humanDraw(from) {
  if (busy || G.turn !== viewer || G.step !== 'draw') return;
  busy = true;
  if (from === 'deck') { await TK.fly($('#deck .card'), $('#hand'), cardHtml(null), 300 * speed); P10.drawDeck(G, viewer); }
  else { await TK.fly($('#dpile .card'), $('#hand'), cardHtml(P10.top(G)), 300 * speed); P10.drawDiscard(G, viewer); }
  busy = false; save(); render();
}
async function humanDiscard() {
  const p = G.players[viewer], card = p.hand.find(c => c.id === sel[0]);
  if (!card || busy) return;
  let target = null;
  if (P10.isS(card)) {
    target = await new Promise(res => TK.sheet(`<h2>Skip who?</h2>${G.players.map((q, i) => i === viewer ? '' : `<button class="pick" data-t="${i}">${esc(q.name)} · phase ${Math.min(q.phase, 10)}${q.skipped ? ' (already skipped)' : ''}</button>`).join('')}`, s => {
      s.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { s.remove(); res(+b.dataset.t); });
      new MutationObserver((m, o) => { if (!document.body.contains(s)) { o.disconnect(); res(null); } }).observe(document.body, { childList: true });
    }));
    if (target == null) return;
  }
  busy = true;
  await TK.fly(document.querySelector(`#hand .card[data-id="${card.id}"]`), $('#dpile .card') || $('#dpile'), cardHtml(card, 'big'), 300 * speed);
  P10.discard(G, viewer, card.id, target); sel = [];
  busy = false;
  after();
}
function after() { save(); render(); setTimeout(step, 150); }

// ---------- loop ----------
let stepping = false, again = false;
async function step() { if (stepping) { again = true; return; } stepping = true; try { await stepOnce(); } finally { stepping = false; if (again) { again = false; setTimeout(step, 60); } } }
async function stepOnce() {
  if (busy || !G) return;
  const g = G;
  if (g.step === 'roundover') return roundOver();
  const pi = g.turn, p = g.players[pi];
  if (!p.bot) {
    if (pnp() && lastShown !== pi) { viewer = pi; sel = []; render(); await TK.handoff(p.name); lastShown = pi; }
    viewer = pi; render(); return;
  }
  if (pnp()) lastShown = -1;
  busy = true; render();
  await sleep(600 * speed);
  const d = P10.botDraw(g, pi);
  const chip = document.querySelector(`.opp[data-seat="${pi}"]`);
  if (d.a === 'deck') { await TK.fly($('#deck .card'), chip, cardHtml(null), 300 * speed); P10.drawDeck(g, pi); }
  else { await TK.fly($('#dpile .card'), chip, cardHtml(P10.top(g)), 300 * speed); P10.drawDiscard(g, pi); }
  render(`${p.name} ${d.a === 'deck' ? 'draws from the deck' : 'takes the discard'}`);
  await sleep(500 * speed);
  for (const a of P10.botPlays(g, pi)) { P10.lay(g, pi, a.groups); render(`${p.name} lays down phase ${p.phase}!`); await sleep(900 * speed); }
  for (let k = 0; k < 12 && g.step === 'play'; k++) { const h = P10.botHits(g, pi); if (!h.length) break; P10.hit(g, pi, h[0].owner, h[0].gi, h[0].id); render(`${p.name} hits on ${nameOf(h[0].owner)}'s group`); await sleep(500 * speed); }
  if (g.step === 'play') {
    const x = P10.botDiscard(g, pi); const card = p.hand.find(c => c.id === x.id);
    await TK.fly(chip, $('#dpile .card') || $('#dpile'), cardHtml(card, 'big'), 300 * speed);
    P10.discard(g, pi, x.id, x.target);
    if (P10.isS(card)) TK.toast(`${p.name} skips ${nameOf(x.target)}!`);
  }
  busy = false;
  after();
}
function roundOver() {
  const g = G, w = g.roundWinner;
  save(); render();
  TK.banner(g.over ? (g.players[g.winner].bot || pnp() ? `${g.players[g.winner].name} WINS` : 'YOU WIN!') : `${g.players[w].name.toUpperCase()} IS OUT`);
  const rows = g.players.map(p => `<tr><td>${esc(p.name)}</td><td>${p.madePhase ? `✓ phase ${p.phase - 1}` : `phase ${p.phase}`}</td><td>+${p.roundPts}</td><td>${p.score}</td></tr>`).join('');
  setTimeout(() => TK.sheet(`<h2>${g.over ? `${esc(g.players[g.winner].name)} wins!` : `Round ${g.round}: ${esc(g.players[w].name)} went out`}</h2>
    <table class="scores"><tr><th></th><th>${g.over ? 'Phase' : 'This round'}</th><th>Pts</th><th>Total</th></tr>${rows}</table>
    <p style="color:var(--tk-mute);font-size:14px">Players who laid down their phase move up one. Lowest total wins once someone finishes Phase 10.</p>
    <button class="tk-big" id="nx">${g.over ? 'Play again' : 'Next round'}</button>${g.over ? '<button class="tk-ghost" id="home">Main menu</button>' : ''}`, s => {
    s.querySelector('.tk-x').remove(); s.onclick = null;
    s.querySelector('#nx').onclick = () => {
      s.remove();
      if (g.over) { const ps = g.players.map(p => ({ name: p.name, bot: p.bot, level: p.level })); /* same table, same bot names */ G = P10.newGame(ps, {}); G.speed = g.speed; return start(); }
      P10.nextRound(g); sel = []; lastShown = pnp() ? -1 : viewer; after();
    };
    if (s.querySelector('#home')) s.querySelector('#home').onclick = () => { s.remove(); store.del(SAVE); setup(); };
  }), 1300);
}
function menu() {
  TK.sheet(`<h2>Menu</h2><table class="scores"><tr><th>Player</th><th>Phase</th><th>Pts</th></tr>${G.players.map(p => `<tr><td>${esc(p.name)}</td><td>${Math.min(p.phase, 10)}</td><td>${p.score}</td></tr>`).join('')}</table>
    <button class="tk-ghost" id="mRules">How to play &amp; the 10 phases</button>${window.GNReport ? '<button class="tk-ghost" id="mBug">⚑ Report a bug</button>' : ''}<button class="tk-ghost" id="mQuit">Save &amp; quit to menu</button>`, s => {
    s.querySelector('#mRules').onclick = () => { s.remove(); rules(); };
    if (s.querySelector('#mBug')) s.querySelector('#mBug').onclick = () => { s.remove(); GNReport.open(); };
    s.querySelector('#mQuit').onclick = () => { s.remove(); if (busy) return TK.toast('One moment…'); save(); setup(); };
  });
}
function rules() {
  TK.sheet(`<h2>How to play</h2>
    <p>Each round you try to complete your current <b>phase</b>. Draw a card (deck or discard), lay your phase down if you can, then <b>discard</b> one card to end your turn.</p>
    <ol class="phases">${Array.from({ length: 10 }, (_, i) => `<li>${P10.phaseName(i + 1)}</li>`).join('')}</ol>
    <ul><li><b>Set</b>: same number. <b>Run</b>: numbers in a row, any colors. <b>Color</b>: all one color.</li>
    <li><b>Wilds</b> stand in for anything. <b>Skips</b> make someone lose their next turn (and can't be picked up).</li>
    <li>After laying down your phase, <b>hit</b>: add cards to any laid-down group on the table.</li>
    <li>The round ends when someone runs out of cards. If you laid your phase, you move on to the next one. Cards left in your hand count against you: 1–9 = 5, 10–12 = 10, skip = 15, wild = 25.</li>
    <li>The first player to finish Phase 10 ends the game; lowest score among finishers wins.</li></ul>`);
}
addEventListener('beforeunload', () => { if (!busy) save(); });
setup();
</script>

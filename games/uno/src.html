<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a1010">
<title>Uno</title>
<style>
:root{--tk-bg:#7a1010;--tk-panel:#fff8ef;--tk-ink:#241a14;--tk-mute:#8a7563;--tk-line:#eadfcb;--tk-accent:#e23b2e;--tk-accent-ink:#fff;
  --R:#e23b2e;--Y:#f5c021;--G:#2fa35a;--B:#2e6fd8;--cw:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#fff;
  background:radial-gradient(ellipse at 50% 30%,#b31d1d,#5c0b0b 75%) fixed}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.tk-logo{color:#fff;text-shadow:0 4px 0 #2b0505,0 10px 20px rgba(0,0,0,.4);font-style:italic}
.tk-tag{color:#ffd6cf!important}

/* ---------- table ---------- */
#game{max-width:640px;margin:0 auto;padding:8px 8px 0;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.top .r{color:#ffd6cf;font-size:13px}
.top button{font-size:24px;padding:0 10px;font-weight:900}
.opps{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.opp{position:relative;min-width:78px;flex:0 1 110px;background:rgba(0,0,0,.25);border-radius:14px;padding:6px 8px;text-align:center;border:2px solid transparent;transition:border-color .2s,transform .2s}
.opp.on{border-color:#ffd23a;transform:translateY(-2px)}
.opp .nm{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opp .ct{font-size:12px;color:#ffd6cf}
.opp .mini{display:flex;justify-content:center;height:30px;margin:3px 0 1px}
.opp .mini i{width:20px;height:30px;border-radius:4px;margin-left:-12px;background:#1b1b1b;border:1.5px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.opp .mini i:first-child{margin-left:0}
.opp .uno{position:absolute;right:-6px;top:-8px;background:#ffd23a;color:#7a1010;font-weight:900;font-size:11px;border-radius:999px;padding:2px 7px;transform:rotate(8deg)}
.opp .sc{font-size:11px;color:#ffb3a8}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:190px}
.piles{display:flex;gap:22px;align-items:center;position:relative}
.ring{position:absolute;inset:-12px -14px;border-radius:22px;border:4px solid var(--ringc,#fff);opacity:.85;pointer-events:none;transition:border-color .3s}
.dir{font-size:26px;opacity:.6;transition:transform .4s}
.pend{position:absolute;right:-26px;top:-18px;background:#111;color:#ffd23a;font-weight:900;border-radius:999px;padding:4px 9px;font-size:18px;border:2px solid #ffd23a}
.status{min-height:22px;text-align:center;font-weight:800;color:#ffe9e4;padding:0 8px}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:46px;margin:6px 0}
.btn{padding:11px 18px;border-radius:12px;font-weight:900;font-size:16px;background:#fff;color:#7a1010;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.unob{background:#ffd23a;font-size:20px;padding:10px 22px;animation:pulse 1s infinite}
.btn.catch{background:#111;color:#ffd23a}
@keyframes pulse{50%{transform:scale(1.07)}}
.handwrap{position:relative;padding:14px 4px calc(14px + env(safe-area-inset-bottom));background:rgba(0,0,0,.22);border-radius:18px 18px 0 0;margin:0 -8px}
.handlbl{text-align:center;font-size:12px;font-weight:800;color:#ffd6cf;margin-bottom:6px}
.hand{display:flex;justify-content:center;padding:14px 10px 0;overflow-x:auto;scrollbar-width:none}
.hand .card{margin-left:calc(var(--overlap) * -1);flex:none;transition:transform .15s}
.hand .card:first-child{margin-left:0}
.hand .card.ok{transform:translateY(-14px);box-shadow:0 0 0 3px #ffd23a,0 6px 12px rgba(0,0,0,.45)}
.hand .card.jump{transform:translateY(-14px);box-shadow:0 0 0 3px #fff,0 0 18px #fff}
.hand .card.dim{filter:brightness(.72)}

/* ---------- cards ---------- */
.card{position:relative;width:var(--cw);height:calc(var(--cw) * 1.5);border-radius:calc(var(--cw) * .14);background:#fff;padding:calc(var(--cw) * .07);box-shadow:0 3px 8px rgba(0,0,0,.45);user-select:none}
.card .f{position:absolute;inset:calc(var(--cw) * .07);border-radius:calc(var(--cw) * .1);background:var(--cc);overflow:hidden}
.card .disc{position:absolute;left:50%;top:50%;width:76%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
  color:var(--cc);font-weight:900;font-size:calc(var(--cw) * .5);letter-spacing:-.04em;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.card .k{position:absolute;color:#fff;font-weight:900;font-size:calc(var(--cw) * .2);line-height:1;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.card .k.a{left:calc(var(--cw) * .07);top:calc(var(--cw) * .06)}.card .k.b{right:calc(var(--cw) * .07);bottom:calc(var(--cw) * .06);transform:rotate(180deg)}
.card .disc svg{width:58%;height:58%}
.card.W .f{background:conic-gradient(var(--R) 0 25%,var(--Y) 0 50%,var(--G) 0 75%,var(--B) 0)}
.card.W .disc{background:#111;color:#fff}
.card.back{background:#1b1b1b;border:2px solid #fff}
.card.back .f{background:repeating-linear-gradient(45deg,#2a2a2a 0 8px,#1b1b1b 8px 16px);display:flex;align-items:center;justify-content:center}
.card.back .f b{transform:rotate(-20deg);font-style:italic;font-weight:900;color:#e23b2e;font-size:calc(var(--cw) * .32);text-shadow:0 2px 0 #000}
.card.big{--cw:88px}
.pile{cursor:pointer}

/* color picker */
.colors{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.colors button{height:76px;border-radius:14px;font-weight:900;font-size:18px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.4);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.pick{display:block;width:100%;text-align:left;padding:12px;border-radius:12px;background:rgba(0,0,0,.06);margin-bottom:6px;font-weight:800}
.scores td{padding:6px 4px;border-bottom:1px solid var(--tk-line)}.scores td:last-child{text-align:right;font-weight:800}
.scores{width:100%;border-collapse:collapse;font-size:16px}
html.gn-desktop{--cw:84px}
html.gn-desktop .card.big{--cw:110px}
html.gn-desktop #game{max-width:980px}
</style>
</head>
<body>
<div id="setup"></div>
<div id="game" hidden></div>
<script>
/*TABLEKIT*/
</script>
<script>
/*ENGINE*/
</script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const { esc, sleep, store } = TK;
const SAVE = 'uno.save.v1', PREFS = 'uno.prefs.v1';
let G = null, busy = false, viewer = 0, lastShown = -1, speed = 1;

// ---------- cards ----------
const ICON = {
  S: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="3.2"/><line x1="5.6" y1="18.4" x2="18.4" y2="5.6" stroke="currentColor" stroke-width="3.2"/></svg>',
  R: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h13l-3.5-3.5M20 15H7l3.5 3.5"/></svg>',
};
function cardHtml(c, cls) {
  if (!c) return `<div class="card back ${cls || ''}"><div class="f"><b>UNO</b></div></div>`;
  const mark = c.v === 'D2' ? '+2' : c.v === 'W4' ? '+4' : c.v === 'W' ? 'W' : c.v === 'S' ? '⊘' : c.v === 'R' ? '⇄' : c.v;
  const mid = c.v === 'S' || c.v === 'R' ? ICON[c.v] : c.v === 'W' ? '<span style="font-size:.7em">★</span>' : mark;
  return `<div class="card ${c.c === 'W' ? 'W' : ''} ${cls || ''}" data-id="${c.id}" style="--cc:var(--${c.c === 'W' ? 'R' : c.c})" aria-label="${esc(UNO.label(c))}">
    <div class="f"><div class="disc">${mid}</div><span class="k a">${mark}</span><span class="k b">${mark}</span></div></div>`;
}

// ---------- setup ----------
function setup() {
  G = null; $('#game').hidden = true; $('#setup').hidden = false;
  const saved = store.get(SAVE, null);
  TK.setup({
    el: $('#setup'), title: 'UNO!', tagline: 'Match the color or number. Shout UNO with one card left.',
    prefsKey: PREFS, minP: 2, maxP: 6, defaults: { target: 500, stack: false, drawUntil: false, sevenO: false, jumpIn: false, speed: 'normal' },
    options: [
      { key: 'target', label: 'Play to', type: 'seg', choices: [[500, '500 points'], [0, 'One round']] },
      { key: 'speed', label: 'Bot speed', type: 'seg', choices: [['slow', 'Slow'], ['normal', 'Normal'], ['fast', 'Fast']] },
      { group: 'House rules', key: 'stack', label: 'Stack draw cards', desc: '+2 on +2 and +4 on +4 pass the penalty along', type: 'toggle' },
      { group: 'House rules', key: 'drawUntil', label: 'Draw until you can play', desc: 'Instead of drawing just one card', type: 'toggle' },
      { group: 'House rules', key: 'sevenO', label: '7-0', desc: 'A 7 swaps hands with someone; a 0 passes every hand along', type: 'toggle' },
      { group: 'House rules', key: 'jumpIn', label: 'Jump-in', desc: 'Play an identical card out of turn', type: 'toggle' },
    ],
    resume: saved && !saved.over ? { text: `Round ${saved.round} · ` + saved.players.map(p => `${p.name} ${p.score}`).join(' · '), onResume: () => { G = saved; start(); } } : null,
    onStart: (ps, prefs) => {
      G = UNO.newGame(ps, { target: prefs.target, stack: prefs.stack, drawUntil: prefs.drawUntil, sevenO: prefs.sevenO, jumpIn: prefs.jumpIn });
      G.speed = prefs.speed; start();
    },
    rules,
  });
}
const humans = () => G.players.map((p, i) => p.bot ? -1 : i).filter(i => i >= 0);
const pnp = () => humans().length > 1;
function save() { if (G && !G.over) store.set(SAVE, G); else store.del(SAVE); }
function start() {
  $('#setup').hidden = true; $('#game').hidden = false;
  speed = { slow: 1.6, normal: 1, fast: 0.5 }[G.speed || 'normal'];
  viewer = humans()[0]; lastShown = pnp() ? -1 : viewer;
  render(); step();
}

// ---------- render ----------
function seatName(i) { return G.players[i].bot || pnp() ? G.players[i].name : 'You'; }
function render(msg) {
  const g = G, me = viewer, t = UNO.top(g);
  const order = g.players.map((_, i) => (me + i) % g.players.length).slice(1);
  const showHand = !pnp() || lastShown === me;
  const myTurn = g.turn === me && g.phase !== 'roundover' && !g.players[me].bot;
  const legal = myTurn && g.phase === 'play' ? UNO.legal(g, me).map(c => c.id) : [];
  const jumps = g.opts.jumpIn && !myTurn ? g.players[me].hand.filter(c => UNO.canJump(g, me, c)).map(c => c.id) : [];
  const hand = g.players[me].hand.slice().sort((a, b) => 'RYGBW'.indexOf(a.c) - 'RYGBW'.indexOf(b.c) || a.v.localeCompare(b.v, undefined, { numeric: true }));
  const vw = Math.min(innerWidth, 980), cw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cw')) || 64;
  const overlap = Math.max(cw * 0.18, Math.min(cw * 0.62, cw - (vw - 40 - cw) / Math.max(1, hand.length - 1)));
  const acts = [];
  if (myTurn && g.phase === 'play') {
    if (g.drawn != null) acts.push('<button class="btn" id="pass">Keep it &amp; pass</button>');
    else acts.push(`<button class="btn" id="draw">${g.pending ? `Take +${g.pending.n}` : 'Draw'}</button>`);
    if (g.players[me].hand.length === 2 && g.unoArmed !== me) acts.push('<button class="btn unob" id="uno">UNO!</button>');
    if (g.unoArmed === me) acts.push('<span class="btn" style="background:#ffd23a">UNO ready ✓</span>');
  }
  if (g.uno && g.uno.p === me && !g.uno.called && !g.players[me].bot) acts.push('<button class="btn unob" id="uno">UNO!</button>');
  for (const h of (pnp() ? humans() : [me])) if (UNO.canCatch(g, h)) { acts.push(`<button class="btn catch" id="catch" data-by="${h}">Catch ${esc(g.players[g.uno.p].name)}!</button>`); break; }
  $('#game').innerHTML = `
    <div class="top"><span>UNO!</span><span class="r">${g.opts.target ? `Round ${g.round} · to ${g.opts.target}` : 'One round'}</span><button id="menu" aria-label="Menu">⋯</button></div>
    <div class="opps">${order.map(i => { const p = g.players[i]; const n = p.hand.length; return `<div class="opp ${g.turn === i && g.phase !== 'roundover' ? 'on' : ''}" data-seat="${i}">
      ${g.uno && g.uno.p === i ? `<span class="uno">${g.uno.called ? 'UNO!' : '1 card!'}</span>` : ''}
      <div class="nm">${esc(p.name)}</div><div class="mini">${Array.from({ length: Math.min(n, 7) }, () => '<i></i>').join('')}</div><div class="ct">${n} card${n === 1 ? '' : 's'}</div>${g.opts.target ? `<div class="sc">${p.score} pts</div>` : ''}</div>`; }).join('')}</div>
    <div class="center">
      <div class="piles">
        <div class="pile" id="deck">${cardHtml(null, 'big')}</div>
        <div style="position:relative" id="disc"><span class="ring" style="--ringc:var(--${g.color || 'W'},#fff)"></span>${cardHtml(t, 'big')}${g.pending ? `<span class="pend">+${g.pending.n}</span>` : ''}</div>
        <div class="dir" style="transform:scaleX(${g.dir})">↻</div>
      </div>
      <div class="status" id="status">${msg || statusText()}</div>
    </div>
    <div class="acts">${acts.join('')}</div>
    <div class="handwrap"><div class="handlbl">${esc(seatName(me))}${pnp() ? '' : ''} · ${g.players[me].hand.length} cards${g.opts.target ? ` · ${g.players[me].score} pts` : ''}</div>
      <div class="hand" id="hand" style="--overlap:${overlap}px">${showHand ? hand.map(c => cardHtml(c, legal.indexOf(c.id) >= 0 ? 'ok' : jumps.indexOf(c.id) >= 0 ? 'jump' : (myTurn ? 'dim' : ''))).join('') : hand.map(() => cardHtml(null)).join('')}</div></div>`;
  $('#menu').onclick = menu;
  document.querySelectorAll('#hand .card[data-id]').forEach(el => el.onclick = () => tapCard(+el.dataset.id));
  $('#deck').onclick = () => { if ($('#draw')) humanDraw(); };
  if ($('#draw')) $('#draw').onclick = humanDraw;
  if ($('#pass')) $('#pass').onclick = () => { if (busy) return; UNO.pass(G, me); after(); };
  if ($('#uno')) $('#uno').onclick = () => { UNO.callUno(G, me); TK.banner('UNO!'); render(); };
  if ($('#catch')) $('#catch').onclick = e => { const by = +e.target.dataset.by; const v = G.uno.p; if (UNO.catchUno(G, by)) { TK.toast(`Caught! ${G.players[v].name} draws 2`); save(); render(); } };
}
function statusText() {
  const g = G, p = g.players[g.turn];
  if (g.phase === 'roundover') return `${g.players[g.roundWinner].name} went out!`;
  if (g.phase === 'color') return `${p.bot ? p.name + ' is' : seatName(g.turn) + ', pick'} picking the starting color`;
  if (g.phase === 'seven') return `${seatName(g.sevenBy)} played a 7 — swap hands with someone`;
  const who = p.bot ? `${p.name}'s turn` : pnp() ? `${p.name}'s turn` : 'Your turn';
  if (g.pending) return `${who} — stack a ${g.pending.v === 'D2' ? '+2' : '+4'} or take +${g.pending.n}`;
  if (g.drawn != null && !p.bot) return 'You drew a card you can play — play it or keep it';
  return who + (!p.bot && g.color ? ` · color is ${UNO.CNAME[g.color]}` : '');
}

// ---------- human input ----------
async function tapCard(id) {
  if (busy) return;
  const g = G, me = viewer, card = g.players[me].hand.find(c => c.id === id);
  if (!card) return;
  const jump = g.turn !== me && UNO.canJump(g, me, card);
  if (!jump && !UNO.canPlay(g, me, card)) { if (g.turn === me) TK.toast(card.v === 'W4' ? 'Wild Draw Four only when you have no ' + UNO.CNAME[g.color] : "That card doesn't match"); return; }
  let color = null;
  if (card.c === 'W') { busy = true; color = await pickColor(); busy = false; if (!color) return; }
  await doPlay(me, id, color, jump);
}
function pickColor() {
  return new Promise(res => {
    const s = TK.sheet(`<h2>Pick a color</h2><div class="colors">${UNO.COLORS.map(k => `<button data-c="${k}" style="background:var(--${k})">${UNO.CNAME[k]}</button>`).join('')}</div>`, s => {
      s.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { s.remove(); res(b.dataset.c); });
    });
    const obs = new MutationObserver(() => { if (!document.body.contains(s)) { obs.disconnect(); res(null); } }); obs.observe(document.body, { childList: true });
  });
}
async function humanDraw() {
  if (busy || G.turn !== viewer) return;
  busy = true;
  const r = UNO.draw(G, viewer);
  await animDraw(viewer, r.cards.length);
  busy = false;
  if (r.penalty) TK.toast(`You take ${r.cards.length}`);
  after();
}

// ---------- animation ----------
function seatEl(i) { return i === viewer ? $('#hand') : document.querySelector(`.opp[data-seat="${i}"]`); }
async function animPlay(pi, card) {
  const from = pi === viewer ? (document.querySelector(`#hand .card[data-id="${card.id}"]`) || $('#hand')) : seatEl(pi);
  await TK.fly(from, document.querySelector('#disc .card'), cardHtml(card, 'big'), 360 * speed);
}
async function animDraw(pi, n) {
  for (let k = 0; k < Math.min(n, 4); k++) { TK.fly($('#deck .card'), seatEl(pi) && (pi === viewer ? $('#hand') : seatEl(pi).querySelector('.mini') || seatEl(pi)), cardHtml(null), 260 * speed); await sleep(110 * speed); }
  await sleep(160 * speed);
}
async function doPlay(pi, id, color, jump) {
  busy = true;
  const card = G.players[pi].hand.find(c => c.id === id);
  await animPlay(pi, card);
  let ev;
  try { ev = UNO.play(G, pi, id, color, null, jump); }
  catch (e) { busy = false; return after(); }   // someone else moved first (e.g. a jump-in) — just carry on
  busy = false;
  if (jump) TK.banner('JUMP IN!');
  if (ev.victim != null) { render(); await animDraw(ev.victim, ev.drew); }
  if (ev.rotate) TK.toast('Hands pass along!');
  if (G.uno && G.uno.p === pi && G.uno.called && G.players[pi].bot) TK.banner('UNO!');
  after();
}
function after() { save(); render(); setTimeout(step, 120); }

// ---------- game loop ----------
// Only one copy of the loop runs at a time; a request made while it's running re-runs it once it finishes.
let stepping = false, again = false;
async function step() {
  if (stepping) { again = true; return; }
  stepping = true;
  try { await stepOnce(); } finally { stepping = false; if (again) { again = false; setTimeout(step, 60); } }
}
async function stepOnce() {
  if (busy || !G) return;
  const g = G;
  if (g.phase === 'roundover') return roundOver();
  // bots may catch a missed UNO, and may jump in
  for (let i = 0; i < g.players.length; i++) if (g.players[i].bot && UNO.canCatch(g, i) && UNO.botCatches(g.players[i])) {
    await sleep(900 * speed); if (!UNO.canCatch(g, i)) break;
    const v = g.uno.p; UNO.catchUno(g, i); TK.toast(`${g.players[i].name} caught ${seatName(v)}! +2 cards`); save(); render(); await sleep(500 * speed); break;
  }
  if (g.opts.jumpIn) for (let i = 0; i < g.players.length; i++) if (g.players[i].bot && i !== g.turn) { const c = UNO.botJump(g, i); if (c) { busy = true; await sleep(350 * speed); busy = false; if (UNO.canJump(g, i, c)) return doPlay(i, c.id, null, true); } }
  const actor = g.phase === 'seven' ? g.sevenBy : g.turn, p = g.players[actor];
  if (!p.bot) {
    if (pnp() && lastShown !== actor) { viewer = actor; render(); await TK.handoff(p.name); lastShown = actor; }
    viewer = actor; render();
    if (g.phase === 'color') { const c = await pickColorForced(); UNO.chooseStartColor(g, c); return after(); }
    if (g.phase === 'seven') return pickSwap(actor);
    return;   // wait for a tap
  }
  if (pnp()) lastShown = -1;
  // give a person holding an identical card a moment to jump in
  if (g.opts.jumpIn && !pnp() && g.players[viewer].hand.some(c => UNO.canJump(g, viewer, c))) {
    const mark = g.log.length; render(); await sleep(1600 * speed); if (G !== g || g.log.length !== mark || busy) return;
  }
  busy = true; render();
  await sleep(700 * speed);
  const a = UNO.botAct(g, actor);
  busy = false;
  if (a.a === 'color') { UNO.chooseStartColor(g, a.color); TK.toast(`${p.name} picks ${UNO.CNAME[a.color]}`); return after(); }
  if (a.a === 'swap') { UNO.swap(g, actor, a.with); TK.toast(`${p.name} swaps hands with ${seatName(a.with)}`); return after(); }
  if (a.a === 'pass') { UNO.pass(g, actor); return after(); }
  if (a.a === 'draw') {
    busy = true; const r = UNO.draw(g, actor); await animDraw(actor, r.cards.length); busy = false;
    if (r.playable) { render(); await sleep(450 * speed); const b = UNO.botAct(g, actor); if (b.a === 'play') return doPlay(actor, b.id, b.color); UNO.pass(g, actor); }
    return after();
  }
  if (g.players[actor].hand.length === 2 && UNO.botCallsUno(p)) UNO.callUno(g, actor);
  return doPlay(actor, a.id, a.color);
}
function pickColorForced() {
  return new Promise(res => { const s = TK.sheet(`<h2>Pick the starting color</h2><div class="colors">${UNO.COLORS.map(k => `<button data-c="${k}" style="background:var(--${k})">${UNO.CNAME[k]}</button>`).join('')}</div>`, s => {
    s.querySelector('.tk-x').remove(); s.onclick = null;
    s.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { s.remove(); res(b.dataset.c); }); }); });
}
function pickSwap(me) {
  TK.sheet(`<h2>Swap hands with…</h2>${G.players.map((p, i) => i === me ? '' : `<button class="pick" data-w="${i}">${esc(p.name)} · ${p.hand.length} cards</button>`).join('')}`, s => {
    s.querySelector('.tk-x').remove(); s.onclick = null;
    s.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { s.remove(); UNO.swap(G, me, +b.dataset.w); after(); });
  });
}
function roundOver() {
  const g = G, w = g.roundWinner;
  save(); render();
  TK.banner(g.over ? (g.players[w].bot || pnp() ? `${g.players[w].name} WINS` : 'YOU WIN!') : `${g.players[w].name.toUpperCase()} IS OUT`);
  const rows = g.players.map(p => p).sort((a, b) => b.score - a.score).map(p => `<tr><td>${esc(p.name)}${p === g.players[w] ? ` <b style="color:#2f9a5a">+${g.roundPoints}</b>` : ''}</td><td>${p.score}</td></tr>`).join('');
  setTimeout(() => TK.sheet(`<h2>${g.over ? `${esc(g.players[w].name)} wins the game!` : `Round ${g.round}: ${esc(g.players[w].name)} went out`}</h2>
    ${g.opts.target ? `<p>${g.over ? 'Final scores' : `Scores — first to ${g.opts.target}`}</p><table class="scores">${rows}</table>` : `<p>Cards left in other hands were worth ${g.roundPoints} points.</p>`}
    <button class="tk-big" id="nx">${g.over ? 'Play again' : 'Next round'}</button>${g.over ? '<button class="tk-ghost" id="home">Main menu</button>' : ''}`, s => {
    s.querySelector('.tk-x').remove(); s.onclick = null;
    s.querySelector('#nx').onclick = () => {
      s.remove();
      if (g.over) { const ps = TK.nameBots(g.players.map(p => ({ name: p.name, bot: p.bot, level: p.level }))); G = UNO.newGame(ps, g.opts); G.speed = g.speed; return start(); }
      UNO.nextRound(g); lastShown = pnp() ? -1 : viewer; after();
    };
    if (s.querySelector('#home')) s.querySelector('#home').onclick = () => { s.remove(); store.del(SAVE); setup(); };
  }), 1300);
}

// ---------- menus ----------
function menu() {
  TK.sheet(`<h2>Menu</h2>
    ${G.opts.target ? `<table class="scores">${G.players.map(p => `<tr><td>${esc(p.name)}</td><td>${p.score}</td></tr>`).join('')}</table>` : ''}
    <button class="tk-ghost" id="mRules">How to play</button>
    ${window.GNReport ? '<button class="tk-ghost" id="mBug">⚑ Report a bug</button>' : ''}
    <button class="tk-ghost" id="mQuit">Save &amp; quit to menu</button>`, s => {
    s.querySelector('#mRules').onclick = () => { s.remove(); rules(); };
    if (s.querySelector('#mBug')) s.querySelector('#mBug').onclick = () => { s.remove(); GNReport.open(); };
    s.querySelector('#mQuit').onclick = () => { s.remove(); if (busy) { TK.toast('One moment…'); return; } save(); setup(); };
  });
}
function rules() {
  TK.sheet(`<h2>How to play</h2>
    <p>Play a card that matches the top card's <b>color</b>, <b>number</b> or <b>symbol</b>. Can't play? Draw one — if it fits you may play it right away.</p>
    <ul><li><b>Skip</b> — the next player misses a turn. <b>Reverse</b> — play changes direction (with two players it acts like a Skip).</li>
    <li><b>Draw Two</b> — the next player draws 2 and misses their turn.</li>
    <li><b>Wild</b> — pick the new color. <b>Wild Draw Four</b> — pick the color and the next player draws 4 and misses a turn. You can only play it when you have no card of the current color.</li>
    <li>When you're down to one card, hit <b>UNO!</b> before someone catches you — or draw 2.</li></ul>
    <p>Going out scores the cards left in everyone else's hand: numbers face value, action cards 20, wilds 50. First to 500 wins.</p>
    <p><b>House rules</b> (set before you deal): stacking draw cards, draw until you can play, 7-0 swaps, and jump-in.</p>`);
}
addEventListener('resize', () => { if (G && !$('#game').hidden) render(); });
addEventListener('beforeunload', () => { if (!busy) save(); });
setup();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b110b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Flip 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#15122a; --bg2:#1d1838; --surface:#241e45; --line:rgba(255,255,255,.08);
  --text:#f6f0e6; --dim:#a79fc4; --coral:#ff5d5d; --mint:#3ddc97; --ice:#7fd3ff; --gold:#ffc94d; --pink:#ff7ac6;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Bricolage Grotesque",system-ui,sans-serif;overscroll-behavior:none}
body{background:radial-gradient(120% 60% at 50% -10%,#3a2a78 0%,var(--bg) 60%) fixed;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
.hidden{display:none!important}
.screen{height:100dvh;display:flex;flex-direction:column;padding-top:var(--safe-t)}

/* ---------- setup ---------- */
#setup{overflow-y:auto;padding:calc(var(--safe-t) + 28px) 18px calc(var(--safe-b) + 28px);gap:18px;max-width:520px;margin:0 auto;width:100%}
.logo{font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:.9;display:flex;align-items:center;gap:10px}
.logo .seven{display:inline-grid;place-items:center;width:62px;height:84px;border-radius:12px;font-size:58px;
  background:linear-gradient(160deg,#ff8a6b,#ff3d6e);box-shadow:0 8px 24px rgba(255,61,110,.35),inset 0 0 0 2px rgba(255,255,255,.35);transform:rotate(8deg)}
.sub{color:var(--dim);font-size:16px;line-height:1.35;margin-top:-4px}
.h{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.seats{display:flex;flex-direction:column;gap:8px}
.seat{display:grid;grid-template-columns:1fr auto 36px;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
.seat input{background:transparent;border:0;outline:0;font-size:18px;font-weight:600;padding:6px 6px;min-width:0}
.seat .x{width:36px;height:36px;border-radius:10px;color:var(--dim);font-size:20px}
.seat .lvl{grid-column:1 / -1}
.seg{display:flex;background:rgba(0,0,0,.25);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--dim);white-space:nowrap}
.seg button.on{background:#fff;color:#1a1533}
.addseat{border:1.5px dashed rgba(255,255,255,.18);border-radius:14px;padding:12px;color:var(--dim);font-weight:600}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt label{font-weight:600}
.opt small{display:block;color:var(--dim);font-weight:500;font-size:13px}
.toggle{width:52px;height:32px;border-radius:16px;background:rgba(255,255,255,.15);position:relative;transition:.2s;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on{background:var(--mint)}.toggle.on::after{left:23px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 14px}
.big{width:100%;padding:18px;border-radius:16px;font-size:20px;font-weight:800;background:linear-gradient(180deg,#ff6b6b,#f0435a);box-shadow:0 10px 30px rgba(240,67,90,.35)}
.big:active{transform:scale(.98)}
.ghost{width:100%;padding:14px;border-radius:14px;font-weight:700;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.resume{background:linear-gradient(180deg,#3ddc97,#20b57a);box-shadow:0 10px 30px rgba(61,220,151,.25);color:#06261a}
.note{color:var(--dim);font-size:13px;text-align:center}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;background:rgba(8,6,20,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20;backdrop-filter:blur(3px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet-card{width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;background:var(--bg2);border-radius:24px 24px 0 0;padding:20px 18px calc(var(--safe-b) + 20px);border-top:1px solid var(--line);animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40%)}}
.sheet h2{font-size:26px;font-weight:800;letter-spacing:-.02em}
.sheet p.lead{color:var(--dim);margin:4px 0 14px;line-height:1.35}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px}
.pick:active{background:#2f2758}
.pick .pn{font-weight:700;font-size:17px}
.pick .meta{color:var(--dim);font-size:13px;font-weight:600}
.pick .r{margin-left:auto;font-weight:800;font-size:20px}
.pick.self{border-color:rgba(255,201,77,.4)}
.rows{display:flex;flex-direction:column;gap:6px;margin:6px 0 16px}
.row{display:grid;grid-template-columns:1fr auto 54px;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface)}
.row .pn{font-weight:700}
.row .bar{grid-column:1 / -1;height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.row .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--coral))}
.row .res{font-weight:700;font-size:14px}
.res.bust{color:var(--coral)}.res.f7{color:var(--gold)}.res.ok{color:var(--mint)}
.row .tot{font-weight:800;font-size:20px;text-align:right}
.row.lead{outline:2px solid var(--gold)}
.rules h3{font-size:16px;margin:14px 0 4px}
.rules p,.rules li{color:#d9d2ec;line-height:1.45;font-size:15px}
.rules ul{padding-left:18px}
.rules .ex{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.btnrow{display:flex;gap:8px;margin-top:6px}

/* ---------- toasts & fx ---------- */
#toasts{position:fixed;left:0;right:0;bottom:calc(var(--safe-b) + 196px);display:flex;flex-direction:column-reverse;align-items:center;gap:6px;pointer-events:none;z-index:30}
.toast{background:#2c2557;border:1px solid rgba(255,255,255,.12);padding:10px 16px;border-radius:14px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:tin .25s ease-out;max-width:90%;text-align:center}
.toast.good{background:#14432f;border-color:#2c8a5f}
.toast.bad{background:#4a1a24;border-color:#a33a4c}
.toast.big{font-size:26px;background:linear-gradient(160deg,#ffe08a,#e7a22e);color:#2a1d00;border:0;padding:14px 24px}
.toast.out{opacity:0;transform:translateY(-8px);transition:.3s}
@keyframes tin{from{opacity:0;transform:translateY(10px) scale(.95)}}
.spark{position:fixed;width:10px;height:14px;border-radius:2px;z-index:40;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r));opacity:.8}}
@media (min-width:700px){#lanes{max-width:640px;width:100%;margin:0 auto}#dock .in{max-width:640px;margin:0 auto}}

/* ---------- table ---------- */
#table{background:radial-gradient(140% 80% at 50% 0%,#3b2618,#1b110b 70%);padding-left:8px;padding-right:8px}
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 6px 6px}
.top .rd{font-weight:800;font-size:18px;color:#f3e3c8}
.top .rd small{font-weight:600;color:#b89a77;font-size:14px;margin-left:6px}
.iconbtn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.08);display:grid;place-items:center;color:#f3e3c8}

.felt{position:relative;flex:1;min-height:0;border-radius:30px;overflow:hidden;
  background:
    radial-gradient(ellipse 70% 55% at 50% 45%,rgba(255,255,255,.07),transparent 70%),
    repeating-radial-gradient(circle at 30% 30%,rgba(0,0,0,.025) 0 1px,transparent 1px 3px),
    radial-gradient(ellipse at 50% 45%,#2b8a58 0%,#1c6c43 55%,#114a2d 100%);
  box-shadow:inset 0 0 0 5px #5e3519,inset 0 0 0 8px #8b5a2b,inset 0 0 0 9px rgba(0,0,0,.4),inset 0 0 50px rgba(0,0,0,.55),0 10px 30px rgba(0,0,0,.5)}
.ring{position:absolute;left:0;right:0;top:0;bottom:var(--tray-h,132px)}

.pod{position:absolute;width:118px;transform:translate(-50%,-50%);padding:6px 7px 6px;border-radius:14px;
  background:rgba(0,0,0,.24);border:1.5px solid rgba(255,255,255,.08);transition:border-color .25s,box-shadow .25s,opacity .3s}
.pod .ph,.tray .ph{display:flex;align-items:center;gap:5px}
.pod .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.pod .tot{font-weight:800;font-size:14px;color:#ffe6a6}
.dl{font-size:9px;font-weight:800;background:var(--gold);color:#2a1d00;border-radius:5px;padding:1px 4px;flex:none}
.pod .nums{display:flex;height:34px;margin:4px 0 3px;align-items:center}
.pod .ex{display:flex;gap:3px;flex-wrap:wrap;min-height:16px}
.pod .pf{display:flex;align-items:center;gap:4px;margin-top:3px;font-size:11px;font-weight:700;color:rgba(255,255,255,.75);min-height:16px}
.pod .pf .rs{margin-left:auto}
.cur{border-color:var(--gold)!important;box-shadow:0 0 0 3px rgba(255,201,77,.25),0 0 22px rgba(255,201,77,.35)}
.pod.busted,.tray.busted .cardsrow{opacity:.5}
.badge{font-size:10px;font-weight:800;padding:2px 5px;border-radius:5px;text-transform:uppercase;letter-spacing:.04em}
.badge:empty{display:none}
.badge.stayed{background:rgba(61,220,151,.22);color:#7ff0bd}
.badge.frozen{background:rgba(127,211,255,.25);color:#bfe9ff}
.badge.busted{background:rgba(255,93,93,.3);color:#ffb1b1}
.badge.flip7{background:var(--gold);color:#2a1d00}
.uniq{font-size:11px;font-weight:700;color:rgba(255,255,255,.6)}
.uniq b{color:#fff}

.center{position:absolute;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:150px;pointer-events:none}
.piles{display:flex;gap:12px}
.pile{position:relative;width:52px;height:72px}
.pile .card{position:absolute;inset:0;width:52px;height:72px;border-radius:8px}
.pile .card:nth-child(1){transform:translate(3px,3px) rotate(3deg)}
.pile .card:nth-child(2){transform:translate(1.5px,1.5px) rotate(1.5deg)}
.pile .cnt{position:absolute;left:0;right:0;bottom:-18px;text-align:center;font-size:11px;font-weight:700;color:rgba(255,255,255,.7)}
.pile.discard .slot{position:absolute;inset:0;border-radius:8px;border:1.5px dashed rgba(255,255,255,.25)}
.pile.discard .card{transform:rotate(-6deg)}
.caption{margin-top:14px;text-align:center;font-weight:700;font-size:14px;line-height:1.25;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);min-height:36px;width:190px}
.caption small{display:block;font-size:12px;color:rgba(255,255,255,.7)}

.tray{position:absolute;left:10px;right:10px;bottom:10px;border-radius:18px;padding:8px 10px 10px;background:rgba(0,0,0,.28);border:1.5px solid rgba(255,255,255,.1);transition:border-color .25s,box-shadow .25s}
.tray .nm{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tray .tot{margin-left:auto;font-weight:800;font-size:16px;color:#ffe6a6}
.tray .tot small{font-size:11px;color:rgba(255,255,255,.6);margin-left:2px}
.tray .rs{font-weight:800;font-size:13px;color:rgba(255,255,255,.85);background:rgba(255,255,255,.1);border-radius:6px;padding:2px 6px}
.tray .rs:empty{display:none}
.cardsrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;min-height:62px;align-items:center}
.cardsrow .nums,.cardsrow .ex{display:flex;flex-wrap:wrap;gap:4px}
.cardsrow .ex:not(:empty){padding-left:6px;margin-left:2px;border-left:1px solid rgba(255,255,255,.18)}

/* ---------- cards (white card stock, framed face, corner indices) ---------- */
.card{position:relative;flex:none;border-radius:7px;display:grid;place-items:center;--ink:hsl(var(--h) 72% 40%);--tint:hsl(var(--h) 85% 55%);color:var(--ink);
  background:
    radial-gradient(ellipse 62% 48% at 50% 50%,hsl(var(--h) 90% 60% / .16),transparent 70%),
    linear-gradient(165deg,#fffef9 0%,#f7f1e3 60%,#ede4cf 100%);
  box-shadow:0 0 0 .5px rgba(0,0,0,.25),0 1px 0 rgba(0,0,0,.12),0 3px 7px rgba(0,0,0,.38)}
.card::before{content:"";position:absolute;inset:var(--fr,3px);border-radius:calc(var(--rad,7px) - 2px);border:var(--frw,1.5px) solid hsl(var(--h) 65% 50% / .55);pointer-events:none}
.card b{font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.8)}
.card .ix{position:absolute;font-weight:800;line-height:1;color:var(--ink);letter-spacing:-.03em}
.card .ix.tl{top:var(--ixo,4px);left:var(--ixo,4px)}
.card .ix.br{bottom:var(--ixo,4px);right:var(--ixo,4px);transform:rotate(180deg)}
.card.xs{width:24px;height:34px;--rad:4px;border-radius:4px;--fr:2px;--frw:1px}.card.xs b{font-size:15px}.card.xs .ix{display:none}
.card.sm{width:34px;height:48px;--rad:5px;border-radius:5px;--fr:2.5px;--frw:1px;--ixo:3px}.card.sm b{font-size:19px}.card.sm .ix{font-size:7px}
.card.tr{width:44px;height:62px;--rad:6px;border-radius:6px;--fr:3px;--frw:1.2px;--ixo:4px}.card.tr b{font-size:25px}.card.tr .ix{font-size:9px}.card.mod.tr b{font-size:16px}.card.act.tr i{font-size:5.5px}
.card.fl{width:60px;height:84px;--rad:8px;border-radius:8px;--ixo:5px}.card.fl b{font-size:34px}.card.fl .ix{font-size:11px}
.card.md{width:70px;height:98px;--rad:10px;border-radius:10px;--fr:4px;--frw:2px;--ixo:6px}.card.md b{font-size:42px}.card.md .ix{font-size:13px}
.card.num.z{--h:250;--ink:#6b6580}
.card.mod{--h:40;--ink:#b4780b}
.card.mod b{font-size:.78em}
.card.mod.sm b{font-size:13px}.card.mod.fl b{font-size:24px}.card.mod.md b{font-size:28px}.card.mod.xs b{font-size:10px}
.card.act{--ink:hsl(var(--h) 70% 40%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.card.act svg{width:56%;height:auto;color:var(--ink);filter:drop-shadow(0 1px 0 rgba(255,255,255,.7))}
.card.act i{font-style:normal;font-weight:800;font-size:5px;text-transform:uppercase;line-height:1.05;text-align:center;color:var(--ink);padding:0 3px}
.card.act.xs i{display:none}.card.act.fl i{font-size:7.5px}.card.act.md i{font-size:9px}
.card.act.freeze{--h:203}.card.act.flip3{--h:322}.card.act.second{--h:150}
.card.dupe{box-shadow:0 0 0 2.5px var(--coral),0 3px 8px rgba(0,0,0,.45)}
.card.back{background:#f6efe0;box-shadow:0 0 0 .5px rgba(0,0,0,.3),0 3px 7px rgba(0,0,0,.45)}
.card.back::before{inset:3px;border:0;border-radius:5px;background:
  repeating-linear-gradient(45deg,transparent 0 3px,rgba(255,255,255,.14) 3px 4px),
  repeating-linear-gradient(-45deg,transparent 0 3px,rgba(255,255,255,.14) 3px 4px),
  radial-gradient(circle at 50% 50%,#b23345,#7b1a28)}
.card.back::after{content:"FLIP\A SEVEN";white-space:pre;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-12deg);
  width:78%;padding:5px 0 4px;border-radius:50%;text-align:center;font-weight:800;font-size:8.5px;line-height:1.05;letter-spacing:.12em;
  color:#7b1a28;background:radial-gradient(ellipse at 50% 40%,#fff8ea,#efdcbc);box-shadow:0 0 0 1.5px #f6efe0,0 0 0 2.5px #7b1a28,0 2px 4px rgba(0,0,0,.35)}
.fresh{animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.pill{height:16px;min-width:20px;padding:0 4px;border-radius:5px;display:inline-grid;place-items:center;font-size:10px;font-weight:800;line-height:1}
.pill.mod{background:linear-gradient(160deg,#ffe08a,#e7a22e);color:#3a2500}
.pill.act{color:#fff;padding:0 3px}.pill.act svg{width:11px;height:11px}
.pill.freeze{background:#4aa8e6}.pill.flip3{background:#c2389b}.pill.second{background:#21a86c}
.floater{position:fixed;z-index:15;pointer-events:none;transform-origin:50% 50%;will-change:transform}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:translate(calc(-50% - 7px),-50%)}40%{transform:translate(calc(-50% + 6px),-50%)}60%{transform:translate(calc(-50% - 4px),-50%)}80%{transform:translate(calc(-50% + 2px),-50%)}}
.tray.shake{animation:shake2 .5s}
@keyframes shake2{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}

/* ---------- controls ---------- */
#controls{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;padding:10px 2px calc(var(--safe-b) + 10px);min-height:84px}
#controls .wait{grid-column:1 / -1;display:grid;place-items:center;color:#c7ad8c;font-weight:600;border-radius:16px;background:rgba(255,255,255,.04);min-height:62px}
.cbtn{border-radius:16px;font-size:22px;font-weight:800;letter-spacing:.02em;min-height:62px}
.cbtn:active{transform:scale(.97)}
.cbtn.stay{background:rgba(61,220,151,.15);color:var(--mint);border:1.5px solid rgba(61,220,151,.45)}
.cbtn.stay small,.cbtn.hit small{display:block;font-size:12px;font-weight:700;opacity:.85}
.cbtn.hit{background:linear-gradient(180deg,#ff6b6b,#f0435a);box-shadow:0 8px 24px rgba(240,67,90,.35)}
.odds{grid-column:1 / -1;font-size:13px;color:#c7ad8c;font-weight:600;text-align:center;margin-top:-4px}
.odds b{color:#fff}
#toasts{top:34%;bottom:auto}
</style>
</head>
<body>
<section id="setup" class="screen"></section>

<section id="table" class="screen hidden">
  <header class="top">
    <div class="rd" id="rd">Round 1</div>
    <button class="iconbtn" id="menuBtn" aria-label="Menu">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><circle cx="4" cy="10" r="2"/><circle cx="10" cy="10" r="2"/><circle cx="16" cy="10" r="2"/></svg>
    </button>
  </header>
  <div class="felt" id="felt"></div>
  <div id="controls"></div>
</section>

<div id="sheet" class="sheet hidden"><div class="sheet-card" id="sheetCard"></div></div>
<div id="toasts"></div>

<script>/*ENGINE*/</script>
<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const PREFS_KEY = 'flip7.prefs.v1', SAVE_KEY = 'flip7.save.v1';
const BOT_NAMES = ['Rosie', 'Gus', 'Mabel', 'Otto', 'Juno', 'Pip', 'Hank', 'Lou'];
const defaults = {
  seats: [{ name: 'You', kind: 'human' }, { name: 'Rosie', kind: 'bot', level: 'normal' }, { name: 'Gus', kind: 'bot', level: 'normal' }, { name: 'Mabel', kind: 'bot', level: 'hard' }],
  target: 200, speed: 'normal', odds: false, modRedraw: true,
};
let prefs = Object.assign({}, defaults, store.get(PREFS_KEY, {}));
const savePrefs = () => store.set(PREFS_KEY, prefs);
const SPEED = { slow: 1.6, normal: 1, fast: 0.45 };
// Once every human is out of the round, race through the bots' turns.
function fastForward() {
  if (!G || between) return false;
  const hs = G.players.filter(p => p.kind === 'human');
  return hs.length > 0 && hs.every(p => p.status !== 'active') && G.players.some(p => p.status === 'active');
}
const T = ms => ms * (fastForward() ? 0.1 : SPEED[prefs.speed]);
const sleep = ms => new Promise(r => setTimeout(r, T(ms)));
const ABORT = { abort: true };
let G = null, cur = null, runId = 0, pending = null, between = false, floater = null, bottomId = 0;
const humans = () => G ? G.players.filter(p => p.kind === 'human') : [];

const ICON = {

const HUES = [250, 200, 222, 262, 290, 322, 350, 12, 30, 44, 140, 168, 186];

function cardName(c) { return c.t === 'num' ? `a ${c.v}` : c.t === 'mod' ? (c.mult ? '×2' : c.v) : ACT_NAME[c.v]; }
function cardHTML(c, size = 'sm', extra = '') {

const tmpl = document.createElement('template');

function pickBotName() { const used = new Set(prefs.seats.map(s => s.name)); return BOT_NAMES.find(n => !used.has(n)) || 'Bot ' + (prefs.seats.length + 1); }

/* ================= GAME FLOW ================= */
function seatsForGame() {
  return prefs.seats.map((s, i) => ({ name: (s.name || '').trim() || (s.kind === 'bot' ? 'Bot ' + (i + 1) : 'Player ' + (i + 1)), kind: s.kind, level: s.level || 'normal' }));
}
function makeEmit(myRun) {
  return async (type, e) => {
    if (myRun !== runId) throw ABORT;
    await onEvent(type, e);
    if (myRun !== runId) throw ABORT;
  };
}
function launch(g, resume) {
  const myRun = ++runId;
  G = g; G.emit = makeEmit(myRun); G.agents = agents;
  cur = null; between = !!(resume && resume.between);
  dropFloater();
  $('#setup').classList.add('hidden'); $('#table').classList.remove('hidden');
  buildTable(); update(); caption(''); controlsWait('');
  G.run(resume && resume.phase === 'turn' ? resume : null).catch(err => { if (err !== ABORT) { console.error(err); toast('Something went wrong — game saved', 'bad'); } });
}
function startGame(seats) {
  store.del(SAVE_KEY);
  launch(new Flip7.Game(seats || seatsForGame(), { target: prefs.target, modRedraw: prefs.modRedraw }));
}
function resumeGame(snap) {
  const g = Flip7.Game.restore(snap, {});
  launch(g, snap.phase === 'turn' ? { phase: 'turn', turnIdx: snap.turnIdx } : { between: true });
}
function quitToSetup() {
  runId++;
  if (pending) { const p = pending; pending = null; p.rej(ABORT); }
  closeSheet(); dropFloater(); G = null;
  $('#table').classList.add('hidden'); $('#setup').classList.remove('hidden');
  renderSetup();
}
function save(phase) { if (G) store.set(SAVE_KEY, G.snapshot(phase)); }

const agents = {
  async decide(g, p) {
    if (p.kind === 'human') { const r = await humanDecide(p); controlsWait(''); return r; }
    controlsWait(fastForward() ? '⏩ Fast-forwarding to the end of the round…' : `${esc(p.name)} is thinking…`);
    await sleep(600);
    return Flip7.Bot.decide(g, p);
  },
  async choose(g, p, type, cands) {
    if (p.kind === 'human') return humanChoose(p, type, cands);
    controlsWait(fastForward() ? '⏩ Fast-forwarding to the end of the round…' : `${esc(p.name)} is choosing a target…`);
    await sleep(650);
    return Flip7.Bot.choose(g, p, type, cands);
  },
};

function waitUI(setup) {
  return new Promise((res, rej) => {
    pending = { rej };
    setup(v => { pending = null; res(v); });
  });
}

function humanDecide(p) {
  return waitUI(done => {
    const pb = Flip7.bustOdds(G, p), score = Flip7.roundScore(p);
    const many = humans().length > 1;
    caption(`${many ? esc(p.name) + ', your' : 'Your'} turn<small>${p.sc ? 'Second Chance ready · ' : ''}${score} on the line</small>`);
    $('#controls').innerHTML = `
      <button class="cbtn stay" id="stayB">STAY<small>bank ${score}</small></button>
      <button class="cbtn hit" id="hitB">HIT${many ? `<small>${esc(p.name)}</small>` : ''}</button>
      ${prefs.odds ? `<div class="odds">Bust risk <b>${Math.round(pb * 100)}%</b> · ${G.deck.length} cards in deck</div>` : ''}`;
    $('#stayB').onclick = () => done(false);
    $('#hitB').onclick = () => done(true);
  });
}

function humanChoose(p, type, cands) {
  return waitUI(done => {
    const title = { freeze: 'Freeze who?', flip3: 'Who flips three?', second: 'Pass the Second Chance' }[type];
    const lead = {

      flip3: 'They must take the next three cards, one at a time.',

    openSheet(`
      <div style="display:flex;gap:14px;align-items:center;margin-bottom:6px">${cardHTML({ t: 'act', v: type }, 'md')}<div><h2>${title}</h2><p class="lead" style="margin:4px 0 0">${lead}</p></div></div>
      <div style="margin-top:14px">
      ${cands.map(q => `<button class="pick ${q === p ? 'self' : ''}" data-id="${q.id}">
          <div><div class="pn">${esc(q.name)}${q === p ? ' (you)' : ''}</div>
          <div class="meta">${q.nums.length} number${q.nums.length === 1 ? '' : 's'} · ${Math.round(Flip7.bustOdds(G, q) * 100)}% bust risk · total ${q.total}</div></div>
          <div class="r">${Flip7.roundScore(q)}</div></button>`).join('')}
      </div>`, false);
    $('#sheetCard').querySelectorAll('[data-id]').forEach(b => b.onclick = () => { closeSheet(); done(G.players[+b.dataset.id]); });

function roundSummary(e) {

        <div class="row ${p.total === top ? 'lead' : ''}"><div class="pn">${esc(p.name)}</div>${res(p)}<div class="tot">${p.total}</div>

      <button class="big" id="nextB">${e.over ? 'See results' : 'Next round'}</button>`, false);

function gameOver(w) {

    const sorted = [...G.players].sort((a, b) => b.total - a.total);

    openSheet(`
      <div style="text-align:center;margin-bottom:10px"><div style="font-size:54px">🏆</div><h2>${esc(w.name)} wins!</h2><p class="lead">${w.total} points in ${G.round} rounds</p></div>
      <div class="rows">${sorted.map((p, i) => `<div class="row ${i === 0 ? 'lead' : ''}"><div class="pn">${i + 1}. ${esc(p.name)}</div><span></span><div class="tot">${p.total}</div></div>`).join('')}</div>
      <button class="big" id="againB">Rematch</button>

// Opponent seat positions [x%, y%], clockwise from your left.
const SLOTS = {
  1: [[50, 14]],
  2: [[27, 15], [73, 15]],
  3: [[18.5, 42], [50, 13], [81.5, 42]],
  4: [[18.5, 46], [31, 13], [69, 13], [81.5, 46]],
  5: [[18.5, 64], [18.5, 33], [50, 12], [81.5, 33], [81.5, 64]],

const CENTER_Y = { 1: 56, 2: 58, 3: 60, 4: 58, 5: 58, 6: 60, 7: 54 };

function seatEl(p) { return document.querySelector(`[data-seat="${p.id}"]`); }

function buildTable() {
  const n = G.players.length;
  let b = G.players.findIndex(p => p.kind === 'human'); if (b < 0) b = 0;
  bottomId = b;
  const others = []; for (let k = 1; k < n; k++) others.push(G.players[(b + k) % n]);

        </div>`).join('')}
      <div class="center" style="top:${CENTER_Y[others.length] || 56}%">
        <div class="piles">
          <div class="pile deck" id="deck"><div class="card back"></div><div class="card back"></div><div class="card back"></div><span class="cnt" id="deckN"></span></div>
          <div class="pile discard" id="discard"><div class="slot"></div><span class="cnt" id="discN"></span></div>

        <span class="tot">0<small>pts</small></span></div>

  requestAnimationFrame(() => {
    const tray = $('.tray'); if (tray) $('#felt').style.setProperty('--tray-h', (tray.offsetHeight + 16) + 'px');
  });

// Keyed reconcile: only new cards are created (and animate); existing ones are left alone.
function syncCards(box, cards, make) {
  const want = new Set(cards.map(c => c.id));
  const have = new Map();
  for (const child of [...box.children]) {
    const id = +child.dataset.cid;
    if (!want.has(id)) child.remove(); else have.set(id, child);
  }
  let prev = null;
  for (const c of cards) {
    let node = have.get(c.id);
    if (!node) {
      node = el(make(c)); node.dataset.cid = c.id; node.classList.add('fresh');
      node.addEventListener('animationend', () => node.classList.remove('fresh'), { once: true });
    }
    const next = prev ? prev.nextSibling : box.firstChild;
    if (node !== next) box.insertBefore(node, next);
    prev = node;
  }
}

function update() {
  if (!G) return;
  $('#rd').innerHTML = `Round ${Math.max(1, G.round + (between ? 1 : 0))}<small>to ${G.target}</small>`;
  $('#deckN').textContent = G.deck.length;
  const disc = $('#discard');
  const nd = G.discard.length;
  $('#discN').textContent = nd ? nd : '';
  const hasBack = disc.querySelector('.card');
  if (nd && !hasBack) disc.insertBefore(el('<div class="card back"></div>'), disc.querySelector('.cnt'));
  if (!nd && hasBack) hasBack.remove();
  $('#deck').style.visibility = G.deck.length ? 'visible' : 'hidden';

  for (const p of G.players) {
    const s = seatEl(p); if (!s) continue;
    const isTray = s.classList.contains('tray');
    const st = between ? 'active' : p.status;
    s.classList.toggle('cur', p === cur);
    ['stayed', 'frozen', 'busted', 'flip7'].forEach(k => s.classList.toggle(k, st === k));
    s.querySelector('.tot').innerHTML = isTray ? `${p.total}<small>pts</small>` : p.total;
    s.querySelector('.dl').classList.toggle('hidden', p.id !== G.dealer);
    const badge = s.querySelector('.badge');
    badge.className = 'badge ' + st;
    badge.textContent = { stayed: 'Stayed', frozen: 'Frozen', busted: 'Bust', flip7: 'Flip 7' }[st] || '';
    const uniq = new Set(p.nums.map(c => c.v)).size;
    s.querySelector('.uniq').innerHTML = !between && p.nums.length ? `<b>${uniq}</b>/7` : '';
    const rs = Flip7.roundScore(p);
    s.querySelector('.rs').textContent = between || (!p.nums.length && !p.mods.length) ? '' : p.status === 'busted' ? '0' : `+${rs}`;
    syncCards(s.querySelector('.nums'), p.nums, c => cardHTML(c, isTray ? 'tr' : 'xs'));
    syncCards(s.querySelector('.ex'), [...p.mods, ...p.acts], c => isTray ? cardHTML(c, 'tr') : pillHTML(c));
    if (!isTray) {
      // Spread opponents' cards out, only overlapping once the row gets full
      const kids = s.querySelector('.nums').children, n = kids.length;
      const adv = n > 1 ? Math.min(27, (102 - 24) / (n - 1)) : 0;
      for (let i = 0; i < n; i++) kids[i].style.marginLeft = i ? (adv - 24) + 'px' : '0';
    }
    const dupeVal = p.status === 'busted' && p.nums.length ? p.nums[p.nums.length - 1].v : null;
    s.querySelectorAll('.nums .card').forEach(n => {
      const c = p.nums.find(x => x.id === +n.dataset.cid);
      n.classList.toggle('dupe', dupeVal != null && c && c.v === dupeVal);
    });
  }
  const tray = $('.tray'); if (tray) $('#felt').style.setProperty('--tray-h', (tray.offsetHeight + 16) + 'px');
}

/* ---------- flying cards ---------- */
function rectOf(node) { return node.getBoundingClientRect(); }
function dropFloater() { if (floater) { floater.remove(); floater = null; } }
async function revealFromDeck(card) {
  dropFloater();
  const d = rectOf($('#deck'));
  const f = el(`<div class="floater">${cardHTML(card, 'fl')}</div>`);
  f.style.left = (d.left + d.width / 2 - 30) + 'px';
  f.style.top = (d.top + d.height / 2 - 42) + 'px';
  document.body.appendChild(f);
  floater = f;
  await f.animate([
    { transform: 'scale(.85) rotateY(90deg)', filter: 'brightness(.6)' },
    { transform: 'scale(1.25) rotateY(0deg)', filter: 'brightness(1)' },
  ], { duration: T(260), easing: 'ease-out', fill: 'forwards' }).finished.catch(() => {});
}
// Fly the held card to a destination element and let the real card appear there.
async function flyTo(dest, scale = 0.45) {
  const f = floater; if (!f) return;
  floater = null;
  if (!dest) { f.remove(); return; }
  const a = rectOf(f), b = rectOf(dest);
  // Aim at the end of the destination row
  const last = dest.lastElementChild;
  let tx, ty;
  if (last && dest.children.length) { const r = rectOf(last); tx = r.right + 10; ty = r.top + r.height / 2; }
  else { tx = b.left + 14; ty = b.top + b.height / 2; }
  const dx = tx - (a.left + a.width / 2), dy = ty - (a.top + a.height / 2);
  await f.animate([
    { transform: 'translate(0,0) scale(1.25)' },
    { transform: `translate(${dx}px,${dy}px) scale(${scale})` },
  ], { duration: T(300), easing: 'cubic-bezier(.3,.7,.4,1)', fill: 'forwards' }).finished.catch(() => {});
  f.remove();
}
function rowFor(p, card) {
  const s = seatEl(p); if (!s) return null;
  return s.querySelector(card && card.t === 'num' ? '.nums' : '.ex');
}
function scaleFor(p) { const s = seatEl(p); return s && s.classList.contains('tray') ? 0.73 : 0.4; }

/* ================= EVENTS ================= */
async function onEvent(type, e) {
  switch (type) {
    case 'roundStart':
      between = false; cur = null; dropFloater(); update();
      caption(`Round ${e.round}<small>${esc(e.dealer.name)} deals</small>`); controlsWait('Dealing…');
      await sleep(700); break;
    case 'resume': update(); break;
    case 'deal': cur = e.p; update(); break;
    case 'turn':
      cur = e.p; save('turn'); update();
      if (!e.canStay) { caption(`${esc(e.p.name)} has no cards<small>Must hit</small>`); await sleep(500); }
      else if (e.p.kind !== 'human') caption(`${esc(e.p.name)}'s turn<small>${Flip7.roundScore(e.p)} on the line</small>`);
      break;
    case 'hit': break;
    case 'draw':
      cur = e.p; update();
      caption(`${esc(e.p.name)} flips ${cardName(e.card)}${e.inF3 ? '<small>Flip Three</small>' : ''}`);
      await revealFromDeck(e.card);
      await sleep(e.card.t === 'num' ? 380 : 650);
      break;
    case 'placed':
      await flyTo(rowFor(e.p, e.card), scaleFor(e.p)); update(); await sleep(120); break;
    case 'redraw':
      caption(`${esc(e.p.name)} flips again<small>Turn ends on a number</small>`); await sleep(400); break;
    case 'bust':
      await flyTo(rowFor(e.p, e.card), scaleFor(e.p)); update(); shake(e.p); buzz([60, 40, 120]);
      caption(`${esc(e.p.name)} busts!<small>Second ${e.card.v}</small>`);
      await sleep(1100); break;
    case 'saved':
      await flyTo($('#discard'), 0.85); update(); buzz(40);
      caption(`Second Chance saves ${esc(e.p.name)}<small>The extra ${e.card.v} is discarded</small>`);
      await sleep(1000); break;
    case 'flip7':
      update(); toast(`${esc(e.p.name)} flipped 7! +15`, 'big'); burst(); buzz([50, 50, 50, 50, 150]);
      await sleep(1700); break;
    case 'action': {
      const self = e.from === e.to;
      const txt = e.card.v === 'freeze'
        ? (self ? `${esc(e.from.name)} freezes themself` : `${esc(e.from.name)} freezes ${esc(e.to.name)}`)
        : (self ? `${esc(e.from.name)} takes Flip Three` : `${esc(e.from.name)} hits ${esc(e.to.name)} with Flip Three`);
      caption(txt);
      await flyTo(rowFor(e.to, e.card), scaleFor(e.to)); update();
      await sleep(700); break;
    }
    case 'frozen': update(); caption(`${esc(e.p.name)} is frozen<small>Banks ${e.score}</small>`); await sleep(600); break;
    case 'stay': update(); caption(`${esc(e.p.name)} stays<small>Banks ${e.score}</small>`); await sleep(600); break;
    case 'flip3Start': cur = e.p; update(); if (!fastForward()) controlsWait(`${esc(e.p.name)} flips three…`); await sleep(350); break;
    case 'flip3Count': break;
    case 'deferred':
      await flyTo(seatEl(e.p), 0.3);
      caption(`${ACT_NAME[e.card.v]} on hold<small>Resolves after Flip Three</small>`); await sleep(700); break;
    case 'deferredResolve':
      caption(`${esc(e.p.name)} plays the held ${ACT_NAME[e.card.v]}`); await sleep(600); break;
    case 'passSC':
      caption(`${esc(e.from.name)} gives a Second Chance to ${esc(e.to.name)}`);
      await flyTo(rowFor(e.to, e.card), scaleFor(e.to)); update(); await sleep(700); break;
    case 'discardSC':
      caption('Extra Second Chance discarded<small>Nobody can take it</small>');
      await flyTo($('#discard'), 0.85); update(); await sleep(600); break;
    case 'reshuffle': caption('Deck empty<small>Shuffling the discards</small>'); update(); await sleep(800); break;
    case 'roundEnd': cur = null; dropFloater(); update(); controlsWait(''); await sleep(800); await roundSummary(e); break;
    case 'tableCleared': between = true; save(G.over ? 'over' : 'between'); update(); caption(''); break;
    case 'gameEnd': store.del(SAVE_KEY); await gameOver(e.winner); break;
  }
}

function caption(h) { const c = $('#caption'); if (c) c.innerHTML = h; }
function controlsWait(t) { $('#controls').innerHTML = `<div class="wait">${t || '&nbsp;'}</div>`; }
function shake(p) { const s = seatEl(p); if (s) { s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake'); } }
function buzz(pat) { try { navigator.vibrate && navigator.vibrate(pat); } catch (e) {} }
function toast(h, kind = '') {
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.innerHTML = h;
  const box = $('#toasts'); box.appendChild(t);
  while (box.children.length > 2) box.firstChild.remove();
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, kind === 'big' ? 2200 : 1800);
}
function burst() {
  const colors = ['#ff5d5d', '#ffc94d', '#3ddc97', '#7fd3ff', '#ff7ac6', '#b18cff'];
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div'); s.className = 'spark';
    s.style.left = (Math.random() * 100) + 'vw'; s.style.top = '-20px';
    s.style.background = colors[i % colors.length];
    s.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
    s.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    s.style.animationDelay = (Math.random() * 0.4) + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 2200);
  }
}

/* ================= SHEETS ================= */
let sheetDismiss = false;
function openSheet(html, dismissable = true) { $('#toasts').innerHTML = ''; $('#sheetCard').innerHTML = html; $('#sheet').classList.remove('hidden'); sheetDismiss = dismissable; }
function closeSheet() { $('#sheet').classList.add('hidden'); $('#sheetCard').innerHTML = ''; }
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet' && sheetDismiss) closeSheet(); });

function showRules() {
  const n = v => cardHTML({ t: 'num', v }), m = (v, mult) => cardHTML({ t: 'mod', v, mult }), a = v => cardHTML({ t: 'act', v });
  const redraw = G ? G.modRedraw : prefs.modRedraw;
  openSheet(`<div class="rules">
    <h2>How to play</h2>
    <p class="lead">Flip cards one at a time. Every number you collect scores — but flip a number you already have and you bust for the round.</p>
    <h3>The deck</h3>
    <p>Each number appears as many times as its value: one 1, two 2s… twelve 12s, plus a single 0. High numbers score big but are the most likely to repeat.</p>
    <div class="ex">${n(0)}${n(3)}${n(7)}${n(12)}</div>
    <h3>Your turn</h3>
    <ul><li><b>Hit</b> to flip another card.</li><li><b>Stay</b> to bank this round's points and sit out until next round.</li><li>Flip a duplicate number and you <b>bust</b> — 0 points this round.</li></ul>
    <h3>Flip 7</h3>
    <p>Collect seven different numbers and you get a 15-point bonus — and the round ends instantly for everyone.</p>
    <h3>Modifiers</h3>
    <div class="ex">${m('+2')}${m('+4')}${m('+6')}${m('+8')}${m('+10')}${m('x2', true)}</div>
    <p>These never bust you. ×2 doubles your number total first; the + cards are added after.</p>
    <h3>Action cards</h3>
    <div class="ex">${a('freeze')}${a('flip3')}${a('second')}</div>
    <ul>
      <li><b>Freeze</b> — pick any active player (even you). They bank their points and are out for the round.</li>
      <li><b>Flip Three</b> — pick any active player. They must flip the next three cards. Freeze or Flip Three cards drawn during it wait until the three are done.</li>
      <li><b>Second Chance</b> — keep it. If you flip a duplicate, toss both and keep going. You can only hold one; extras go to another player.</li>
    </ul>
    ${redraw ? '<h3>House rule</h3><p>Your turn isn\'t over until you flip a number card. Modifiers, Second Chance, Freeze and Flip Three are resolved, then you keep flipping.</p>' : ''}
    <h3>Winning</h3>
    <p>Finish the round in which someone reaches ${G ? G.target : prefs.target}. Highest total wins.</p>
    <button class="big" style="margin-top:16px" id="closeR">Got it</button></div>`);
  $('#closeR').onclick = closeSheet;
}

function showMenu() {
  const seg = (key, opts, val) => `<div class="seg" data-seg="${key}">${opts.map(([v, l]) => `<button data-v="${v}" class="${v == val ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  openSheet(`<h2>Menu</h2><p class="lead">Your game saves automatically.</p>
    <div class="panel" style="margin-bottom:12px">
      <div class="opt"><label>Speed</label>${seg('speed', [['slow', 'Slow'], ['normal', 'Normal'], ['fast', 'Fast']], prefs.speed)}</div>
      <div class="opt"><label>Show bust odds</label><button class="toggle ${prefs.odds ? 'on' : ''}" id="oddsM"></button></div>
    </div>
    <button class="ghost" id="rulesM" style="margin-bottom:8px">How to play</button>
    ${window.GNReport ? '<button class="ghost" id="bugM" style="margin-bottom:8px">⚑ Report a bug</button>' : ''}
    <button class="ghost" id="quitM" style="margin-bottom:8px">Back to main menu</button>
    <button class="big" id="closeM">Back to game</button>`);
  const card = $('#sheetCard');
  card.querySelectorAll('[data-seg] button').forEach(b => b.onclick = () => { prefs[b.closest('[data-seg]').dataset.seg] = b.dataset.v; savePrefs(); showMenu(); });
  $('#oddsM').onclick = () => { prefs.odds = !prefs.odds; savePrefs(); showMenu(); };
  $('#rulesM').onclick = showRules;
  $('#quitM').onclick = () => quitToSetup();
  if ($('#bugM')) $('#bugM').onclick = () => { closeSheet(); GNReport.open(); };
  $('#closeM').onclick = closeSheet;
}
$('#menuBtn').onclick = () => {
  if (!$('#sheet').classList.contains('hidden') && !sheetDismiss) return;
  showMenu();
};
window.addEventListener('resize', () => { const tray = $('.tray'); if (tray) $('#felt').style.setProperty('--tray-h', (tray.offsetHeight + 16) + 'px'); });

renderSetup();
})();
</script>
</body>

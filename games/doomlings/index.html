<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#131219">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Doomlings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@1,6..72,400&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Doomlings — phone build.
   Portrait, touch, pass-and-play. Visual language carried over from the
   desktop table so the two read as one product: dark ground, the card art
   carries all the colour, each trait keyed to its printed colour.
   ========================================================================== */
:root{
  --ink:#131219; --felt:#191822; --panel:#1d1c25; --panel-2:#24222e; --panel-3:#2c2a38;
  --edge:#312f3e; --bone:#eae6dd; --dust:#938fa3; --dim:#625f74;

  --blue:#1191d0; --purple:#8f5fd0; --green:#4fae57; --red:#e2523f;
  --yellow:#efb034; --colorless:#8d8a9c; --unknown:#6c6980;

  --display:"Bricolage Grotesque",system-ui,-apple-system,sans-serif;
  --serif:"Newsreader",Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;

  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --r:12px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:var(--ink);color:var(--bone);font-family:var(--display);
  font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;
  overscroll-behavior:none;touch-action:manipulation;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.mono{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.scroll-x{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll-x::-webkit-scrollbar{display:none}
[hidden]{display:none!important}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}

/* ==========================================================================
   SIGNATURE — the doom meter.
   Three (or four) segments across the top that fill as catastrophes turn
   over. It is the whole arc of a game in one glyph, and the only loud thing
   on the screen.
   ========================================================================== */
.doom{display:flex;gap:3px;height:4px;flex:0 0 auto}
.doom i{flex:1;background:var(--panel-3);position:relative;overflow:hidden}
.doom i::after{
  content:"";position:absolute;inset:0;transform:scaleX(0);transform-origin:left;
  background:linear-gradient(90deg,var(--yellow),var(--red));
  transition:transform .7s cubic-bezier(.3,.8,.3,1);
}
.doom i.lit::after{transform:scaleX(1)}
.doom i.live::after{transform:scaleX(.42);background:var(--yellow);opacity:.55}

/* ---------- top bar ---------- */
.bar{
  display:flex;align-items:center;gap:10px;padding:8px 14px;
  padding-top:calc(8px + var(--safe-t));flex:0 0 auto;
  border-bottom:1px solid var(--edge);background:var(--ink);
}
.bar-era{color:var(--dim)}
.bar-turn{font-weight:700;font-size:15px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  color:var(--dust);background:var(--panel);border:1px solid var(--edge);flex:0 0 auto}
.icon-btn:active{background:var(--panel-2)}

/* ---------- opponent strip ---------- */
.opps{display:flex;gap:8px;padding:9px 14px;flex:0 0 auto;border-bottom:1px solid var(--edge)}
.opp{
  flex:0 0 auto;min-width:112px;padding:8px 10px;border-radius:10px;
  background:var(--panel);border:1px solid var(--edge);text-align:left;
}
.opp.first{border-color:color-mix(in srgb,var(--yellow) 45%,transparent)}
.opp-name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opp-row{display:flex;gap:9px;margin-top:4px;color:var(--dim)}
.opp-dots{display:flex;gap:2px;margin-top:6px;flex-wrap:wrap}
.opp-dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}

/* ---------- board ---------- */
.board{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:12px 14px 10px;
  display:flex;flex-direction:column;min-height:0}

.age{
  display:flex;gap:12px;padding:12px;border-radius:var(--r);
  background:var(--panel);border:1px solid var(--edge);margin-bottom:12px;
}
.age.cat{border-color:color-mix(in srgb,var(--red) 50%,transparent);
  background:color-mix(in srgb,var(--red) 8%,var(--panel))}
.age img{width:64px;border-radius:8px;flex:0 0 auto;align-self:flex-start}
.age-kind{color:var(--dim)}
.age-name{font-weight:800;font-size:17px;letter-spacing:-.01em;margin-top:2px}
.age-text{color:var(--dust);font-size:13px;line-height:1.5;margin-top:5px}

.decks{display:flex;gap:8px;margin-bottom:12px;flex:0 0 auto}
.deck{flex:1;display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:10px;
  background:var(--panel);border:1px solid var(--edge)}
.deck:disabled{opacity:.45}
.deck:not(:disabled):active{background:var(--panel-2)}
.deck-mini{width:24px;height:34px;border-radius:4px;flex:0 0 auto}
.deck-label{text-align:left;min-width:0}
.deck-name{font-size:12px;font-weight:700}
.deck-n{color:var(--dim)}

.pile-head{display:flex;align-items:center;gap:8px;margin:0 0 8px;flex:0 0 auto}
/* Gene Pool is adjusted by hand because catastrophes and age cards tell you to.
   It sits with your pile, not in a menu — you touch it several times a game. */
.gp{display:flex;align-items:center;gap:2px;margin-left:auto;background:var(--panel);
  border:1px solid var(--edge);border-radius:999px;padding:2px}
.gp b{font-family:var(--mono);font-size:13px;font-weight:700;min-width:46px;text-align:center}
.gp button{width:28px;height:28px;border-radius:50%;background:var(--panel-2);
  color:var(--dust);font-size:15px;line-height:1}
.gp button:disabled{opacity:.3}
.gp button:active:not(:disabled){background:var(--panel-3);color:var(--bone)}
.pile-head b{font-size:13px;font-weight:700}
.pile-head span{color:var(--dim)}

.cols{display:flex;gap:8px;padding-bottom:6px;flex:0 0 auto;align-items:flex-start}
.cols.is-empty{flex:1 1 auto;overflow:visible}
.col{flex:0 0 auto;width:62px}
.col-label{color:var(--dim);margin-bottom:5px;white-space:nowrap;font-size:9px}
.col.dom .col-label{color:var(--yellow)}
.stack{display:flex;flex-direction:column}
.chip{
  position:relative;width:62px;height:87px;border-radius:6px;overflow:hidden;
  border:1px solid var(--edge);background:var(--panel);flex:0 0 auto;display:block;
}
.chip+.chip{margin-top:-58px}
.chip.dom{border-color:color-mix(in srgb,var(--yellow) 55%,transparent)}
.chip img{width:100%;height:100%;object-fit:cover;display:block}
.chip-fb{width:100%;height:100%;display:grid;place-items:center;padding:4px;
  text-align:center;font-size:8px;color:var(--dust);line-height:1.2}
.chip-sp{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);z-index:2}
.chip-v{position:absolute;top:2px;left:5px;z-index:2;font-size:9px;font-weight:700;
  background:rgba(0,0,0,.72);border-radius:4px;padding:0 4px;font-family:var(--mono)}
.empty{color:var(--dim);font-size:12px;padding:6px 0}
/* An empty trait pile is a place things go, not a blank screen — mark it the
   way the printed playmat marks its zones. */
.matzone{flex:1 1 auto;min-height:104px;border:1px dashed var(--edge);border-radius:12px;
  display:grid;place-items:center;text-align:center;padding:16px;
  background:repeating-linear-gradient(135deg,transparent,transparent 9px,
    rgba(255,255,255,.012) 9px,rgba(255,255,255,.012) 18px)}
.matzone b{display:block;color:var(--dust);font-size:13px;font-weight:700}
.matzone span{display:block;color:var(--dim);font-size:12px;margin-top:3px}

/* ---------- hand: the hero of a phone screen ---------- */
.hand-wrap{flex:0 0 auto;border-top:1px solid var(--edge);background:var(--felt)}
.hand-head{display:flex;align-items:center;gap:8px;padding:8px 14px 0}
.hand-head b{font-size:13px;font-weight:700}
.stab{margin-left:auto;color:var(--dust)}
.stab.ok{color:#9fe0a5}
.hand{display:flex;gap:8px;padding:8px 14px 10px;scroll-snap-type:x proximity}
.hc{
  position:relative;flex:0 0 auto;width:92px;border-radius:9px;overflow:hidden;
  border:1px solid var(--edge);background:var(--panel);scroll-snap-align:center;
  transition:transform .14s ease;display:block;
}
.hc:active{transform:translateY(-4px)}
.hc.no{opacity:.42}
.hc img{width:100%;display:block}
.hc-fb{aspect-ratio:5/7;display:grid;place-items:center;padding:6px;text-align:center;
  font-size:10px;color:var(--dust);line-height:1.25}
.hc-sp{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);z-index:2}
.hand-empty{padding:18px 14px;color:var(--dim);font-size:13px}

/* ---------- primary action ---------- */
.act{padding:0 14px calc(12px + var(--safe-b));background:var(--felt);flex:0 0 auto}
.cta{
  width:100%;padding:16px;border-radius:14px;font-size:16px;font-weight:800;
  background:var(--green);color:#07160a;letter-spacing:-.01em;
}
.cta:active{filter:brightness(1.08)}
.cta:disabled{background:var(--panel-2);color:var(--dim)}
.cta.warn{background:var(--yellow);color:#1a1200}
.cta.flip{background:var(--bone);color:var(--ink)}
.cta-sub{display:block;font-size:11px;font-weight:500;opacity:.72;margin-top:2px;
  letter-spacing:0;text-transform:none}
.act-row{display:flex;gap:8px;margin-top:8px}
.minor{flex:1;padding:11px;border-radius:11px;background:var(--panel);
  border:1px solid var(--edge);color:var(--dust);font-size:13px}
.minor:active{background:var(--panel-2)}
.minor:disabled{opacity:.4}

/* ==========================================================================
   SHEETS — card detail, prompts, menus. One mechanism, slides from the bottom.
   ========================================================================== */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(6,6,9,.72);
  backdrop-filter:blur(3px);display:flex;align-items:flex-end}
.sheet-bg[hidden]{display:none}
.sheet{
  width:100%;max-height:92vh;background:var(--panel);border-radius:20px 20px 0 0;
  border-top:1px solid var(--edge);display:flex;flex-direction:column;
  padding-bottom:var(--safe-b);animation:up .2s cubic-bezier(.2,.8,.3,1);
}
@keyframes up{from{transform:translateY(14%);opacity:.6}to{transform:none;opacity:1}}
.grip{width:34px;height:4px;border-radius:2px;background:var(--panel-3);
  margin:9px auto 4px;flex:0 0 auto}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:10px 16px 16px}
.sheet-title{font-size:17px;font-weight:800;letter-spacing:-.01em}
.sheet-sub{color:var(--dust);font-size:13px;margin-top:3px;line-height:1.45}

/* card detail */
.cd-art{width:100%;max-width:250px;margin:4px auto 12px;display:block;border-radius:12px}
.cd-name{font-size:21px;font-weight:800;letter-spacing:-.02em}
.cd-flavor{font-family:var(--serif);font-style:italic;color:var(--dim);margin-top:3px}
.cd-eff{color:var(--dust);font-size:14px;line-height:1.55;margin-top:9px;
  border-left:2px solid var(--edge);padding-left:11px}
.cd-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--panel-2);
  border:1px solid var(--edge);color:var(--dust)}
.tag.hued{color:var(--c);border-color:color-mix(in srgb,var(--c) 50%,transparent)}
/* Swipe between cards without closing the sheet — arrows for precision,
   a horizontal drag for speed. */
.cd-nav{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.cd-nav button{width:40px;height:40px;border-radius:50%;background:var(--panel-2);
  border:1px solid var(--edge);color:var(--dust);font-size:17px;line-height:1;flex:0 0 auto}
.cd-nav button:disabled{opacity:.28}
.cd-nav button:active:not(:disabled){background:var(--panel-3);color:var(--bone)}
.cd-dots{display:flex;gap:5px;justify-content:center;flex:1;flex-wrap:wrap}
.cd-dots i{width:6px;height:6px;border-radius:50%;background:var(--panel-3)}
.cd-dots i.on{background:var(--bone);transform:scale(1.25)}
.cd-swipe{touch-action:pan-y}

/* the current age's standing rule, pinned where you read the board */
.age-rule{display:inline-block;margin-top:8px;font-family:var(--mono);font-size:10px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--yellow);
  border:1px solid color-mix(in srgb,var(--yellow) 42%,transparent);
  background:color-mix(in srgb,var(--yellow) 8%,transparent);
  border-radius:999px;padding:3px 9px}

.cd-acts{display:flex;gap:8px;margin-top:16px}
.cd-acts button{flex:1;padding:14px;border-radius:12px;font-weight:700;font-size:14px}
.b-play{background:var(--green);color:#07160a}
.b-play:disabled{background:var(--panel-2);color:var(--dim)}
.b-flat{background:var(--panel-2);border:1px solid var(--edge);color:var(--dust)}
.why{color:var(--yellow);font-size:12px;margin-top:9px}

/* prompt pickers */
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:9px;margin-top:14px}
.pick{
  position:relative;border-radius:9px;overflow:hidden;border:1px solid var(--edge);
  background:var(--panel-2);padding:0;text-align:left;
}
.pick.sel{border-color:var(--green);box-shadow:0 0 0 2px color-mix(in srgb,var(--green) 45%,transparent)}
/* A protected trait is shown, never hidden — you need to see what an opponent
   holds. It just can't be chosen. */
.pick.locked{opacity:.4;cursor:not-allowed}
.pick.locked img,.pick.locked .pick-fb{filter:grayscale(1)}
.pick-lock{position:absolute;top:5px;right:5px;z-index:3;width:19px;height:19px;
  border-radius:50%;background:var(--panel-3);color:var(--yellow);
  display:grid;place-items:center;font-size:10px}
.pick-why{color:var(--yellow);font-size:11px;line-height:1.4;margin-top:10px;
  padding-left:10px;border-left:2px solid color-mix(in srgb,var(--yellow) 45%,transparent)}
.pick img{width:100%;display:block}
.pick-fb{aspect-ratio:5/7;display:grid;place-items:center;padding:6px;text-align:center;
  font-size:10px;color:var(--dust)}
.pick-cap{padding:5px 7px;font-size:10px;color:var(--dust);line-height:1.25;
  border-top:1px solid var(--edge)}
.pick-own{display:block;color:var(--dim);font-size:9px}
.pick-tick{position:absolute;top:5px;right:5px;width:19px;height:19px;border-radius:50%;
  background:var(--green);color:#07160a;display:grid;place-items:center;font-size:12px;font-weight:800;z-index:3}

.swatches{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:9px;margin-top:14px}
.sw{display:flex;align-items:center;gap:9px;padding:13px 12px;border-radius:11px;
  background:var(--panel-2);border:1px solid var(--edge);font-weight:700;font-size:14px}
.sw i{width:15px;height:15px;border-radius:50%;background:var(--c);flex:0 0 auto}
.sw.sel{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 40%,transparent)}

.plist{display:grid;gap:8px;margin-top:14px}
.prow{display:flex;align-items:center;gap:11px;padding:13px;border-radius:11px;
  background:var(--panel-2);border:1px solid var(--edge);text-align:left}
.prow b{font-size:14px}
.prow span{color:var(--dim);margin-left:auto}

.sheet-foot{display:flex;gap:8px;padding:12px 16px calc(14px + var(--safe-b));
  border-top:1px solid var(--edge);flex:0 0 auto;background:var(--panel)}
.sheet-foot button{flex:1;padding:14px;border-radius:12px;font-weight:700;font-size:14px}
.b-go{background:var(--green);color:#07160a}
.b-go:disabled{background:var(--panel-2);color:var(--dim)}

/* reaction banner inside a prompt */
.react-ev{padding:11px 12px;border-radius:10px;background:var(--panel-2);
  border-left:2px solid var(--yellow);margin-top:12px;font-size:13px;color:var(--dust)}

/* ==========================================================================
   HAND-OFF — pass-and-play privacy gate
   ========================================================================== */
.pass{position:fixed;inset:0;z-index:60;background:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:28px}
.pass[hidden]{display:none}
.pass-eyebrow{color:var(--dim)}
.pass-name{font-size:clamp(30px,10vw,46px);font-weight:800;letter-spacing:-.03em;text-align:center;line-height:1.05}
.pass-why{color:var(--dust);text-align:center;max-width:30ch;line-height:1.5;font-size:14px}
.pass-card{width:150px;margin:6px 0 2px}
.pass-card img{width:100%;display:block;border-radius:10px;
  box-shadow:0 14px 34px rgba(0,0,0,.6)}
.pass-fb{aspect-ratio:5/7;display:grid;place-items:center;border-radius:10px;padding:8px;
  text-align:center;font-size:12px;color:var(--dust);background:var(--panel);
  border:1px solid var(--edge)}
.pass-go{margin-top:20px;padding:17px 44px;border-radius:999px;background:var(--bone);
  color:var(--ink);font-weight:800;font-size:16px}

/* ==========================================================================
   REVEAL — a flipped age or catastrophe stops the table.
   Everyone needs to read it and apply it together before play continues, so
   it takes the whole screen rather than scrolling past in the board.
   ========================================================================== */
.reveal{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;padding:26px 22px;
  padding-bottom:calc(26px + var(--safe-b));
  background:radial-gradient(90% 60% at 50% 38%,var(--felt),var(--ink) 78%);
  animation:revealIn .26s cubic-bezier(.2,.8,.3,1)}
.reveal[hidden]{display:none}
.reveal.cat{background:radial-gradient(90% 60% at 50% 38%,
  color-mix(in srgb,var(--red) 16%,var(--felt)),var(--ink) 78%)}
@keyframes revealIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.rv-eyebrow{color:var(--dim)}
.reveal.cat .rv-eyebrow{color:#f0907f}
.rv-card{width:min(188px,52vw);margin:4px 0}
.rv-card img{width:100%;display:block;border-radius:12px;
  box-shadow:0 20px 48px rgba(0,0,0,.66);animation:flipIn .5s cubic-bezier(.2,.8,.3,1) both}
@keyframes flipIn{from{transform:rotateY(70deg) scale(.9);opacity:0}
  to{transform:none;opacity:1}}
.rv-fb{aspect-ratio:5/7;display:grid;place-items:center;border-radius:12px;
  background:var(--panel);border:1px solid var(--edge);color:var(--dust);
  text-align:center;padding:12px;font-size:13px}
.rv-name{font-size:clamp(22px,6.5vw,30px);font-weight:800;letter-spacing:-.02em;
  text-align:center;line-height:1.05;margin:2px 0}
.rv-text{color:var(--dust);text-align:center;max-width:34ch;line-height:1.5;font-size:14px;margin:0}
.rv-do{color:var(--yellow);text-align:center;margin-top:8px}
.rv-go{margin-top:18px;padding:16px 42px;border-radius:999px;background:var(--bone);
  color:var(--ink);font-weight:800;font-size:16px}

/* ---------- setup ---------- */
.setup{flex:1;overflow-y:auto;padding:calc(26px + var(--safe-t)) 18px 26px}
.title{font-size:clamp(28px,8vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1}
.lede{font-family:var(--serif);font-style:italic;color:var(--dust);margin:8px 0 22px;font-size:16px}
.lab{display:block;margin:20px 0 9px}
.seat{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.seat input{flex:1;background:var(--panel);border:1px solid var(--edge);border-radius:10px;
  padding:13px;color:var(--bone);font-size:15px;min-width:0}
.seat input:focus{outline:2px solid var(--blue);outline-offset:-1px}
.seat .mono{width:18px;color:var(--dim);flex:0 0 auto}
.seat-x{width:38px;height:38px;border-radius:10px;background:var(--panel);
  border:1px solid var(--edge);color:var(--dust);flex:0 0 auto}
.add{width:100%;padding:13px;border-radius:11px;background:var(--panel);
  border:1px dashed var(--edge);color:var(--dust);font-size:14px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;padding:13px;border-radius:11px;
  background:var(--panel);border:1px solid var(--edge);text-align:left}
.opt.sel{border-color:color-mix(in srgb,var(--green) 55%,transparent);
  background:color-mix(in srgb,var(--green) 7%,var(--panel))}
.opt-t{font-weight:700;font-size:14px}
.opt-d{color:var(--dim);font-size:12px;margin-top:2px;line-height:1.4}
.note{padding:12px 14px;border-radius:10px;border-left:2px solid var(--yellow);
  background:color-mix(in srgb,var(--yellow) 7%,transparent);color:var(--dust);
  font-size:13px;line-height:1.5;margin-bottom:16px}
.note.bad{border-color:var(--red);background:color-mix(in srgb,var(--red) 8%,transparent)}
.loader{text-align:center;padding:56px 20px;color:var(--dust)}

/* ---------- scoring walkthrough ----------
   Plays itself. The cards stay pinned at the top so you can watch the one
   that's paying out, while the reasons scroll past underneath like a log. */
.sw-head{flex:0 0 auto;padding:calc(16px + var(--safe-t)) 18px 10px;
  border-bottom:1px solid var(--edge);background:var(--ink)}
.sw-row{display:flex;align-items:baseline;gap:12px}
.sw-who{font-size:clamp(22px,6vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw-run{font-family:var(--mono);font-size:30px;font-weight:700;margin-left:auto;
  letter-spacing:-.02em;transition:transform .2s ease}
.sw-run.bump{transform:scale(1.18)}
.sw-step{color:var(--dim);margin-top:3px}
.sw-log{flex:1 1 auto;overflow-y:auto;padding:12px 18px 8px;display:flex;
  flex-direction:column;gap:7px}
.sw-cards{display:flex;gap:5px;margin:12px 0 2px;padding-bottom:4px}
.sw-card{position:relative;width:52px;flex:0 0 auto;border-radius:6px;overflow:hidden;
  border:1px solid var(--edge);background:var(--panel);opacity:.3;
  transition:opacity .22s ease,transform .22s ease,box-shadow .22s ease}
.sw-card img{width:100%;display:block}
.sw-card .sw-fb{aspect-ratio:5/7;display:grid;place-items:center;font-size:8px;
  color:var(--dust);text-align:center;padding:3px;line-height:1.15}
.sw-card.lit{opacity:1}
.sw-card.now{opacity:1;transform:translateY(-5px) scale(1.07);z-index:2;
  box-shadow:0 10px 24px rgba(0,0,0,.6);outline:2px solid var(--yellow)}
.sw-line{display:flex;align-items:baseline;gap:10px;padding:9px 12px;border-radius:9px;
  background:var(--panel);border:1px solid var(--edge);animation:lineIn .26s ease both;
  flex:0 0 auto}
.sw-line.head{background:transparent;border:0;padding:4px 0 0;color:var(--dim)}
.sw-line.neg{border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.sw-line .nm{font-size:13px;font-weight:700;min-width:0;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw-line .why{color:var(--dim);font-size:11px}
.sw-line .amt{font-family:var(--mono);font-weight:700;font-size:15px;flex:0 0 auto}
.sw-line.neg .amt{color:#f0907f}
@keyframes lineIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ---------- scores ---------- */
.sc-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--edge)}
.sc-rank{font-family:var(--mono);color:var(--dim);width:18px;flex:0 0 auto}
.sc-name{font-weight:700;font-size:15px;min-width:0;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-row.win .sc-name{color:var(--yellow)}
.sc-parts{color:var(--dim);font-size:11px;font-family:var(--mono)}
.sc-total{font-family:var(--mono);font-size:22px;font-weight:700;flex:0 0 auto}

/* ---------- log ---------- */
.log-list{display:grid;gap:9px;margin-top:12px}
.log-list li{list-style:none;font-size:13px;color:var(--dust);line-height:1.45;
  border-left:2px solid var(--edge);padding-left:10px}
.log-list li.big{color:var(--bone);border-color:var(--yellow)}

/* ---------- card backs (drawn, not borrowed) ---------- */
.back{position:relative;border-radius:6px;overflow:hidden;width:100%;height:100%;
  display:grid;place-items:center;container-type:inline-size;
  border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)}
.back::after{content:"";position:absolute;inset:0;
  background:radial-gradient(60% 40% at 24% 14%,rgba(255,255,255,.2),transparent 60%)}
.back.trait{background:linear-gradient(165deg,#1a7fc6,#22a2a8 48%,#57b45f)}
.back.age{background:linear-gradient(165deg,#7d46cf,#d43f80 52%,#f0713f)}
.back.birth{background:linear-gradient(165deg,#f3ad3f,#f0698e 55%,#e8497f)}
.back b{position:relative;z-index:2;font-size:17cqw;font-weight:800;color:#fff;
  text-transform:uppercase;letter-spacing:.02em;text-align:center;line-height:1;padding:3px}

/* ---------- your hand, shown inside any prompt ---------- */
.ph{margin-top:16px;padding-top:12px;border-top:1px solid var(--edge)}
.ph-head{color:var(--dim);margin-bottom:7px}
.ph-row{display:flex;gap:6px;padding-bottom:4px}
.ph-card{position:relative;flex:0 0 auto;width:60px;border-radius:6px;overflow:hidden;
  border:1px solid var(--edge);background:var(--panel-2);padding:0}
.ph-card img{width:100%;display:block}
.ph-fb{aspect-ratio:5/7;display:grid;place-items:center;font-size:8px;color:var(--dust);
  text-align:center;padding:3px;line-height:1.15}

/* read a card without choosing it */
.pick-i{position:absolute;top:5px;left:5px;z-index:3;width:24px;height:24px;border-radius:50%;
  background:rgba(0,0,0,.74);color:var(--bone);display:grid;place-items:center;
  font:italic 700 13px/1 var(--serif);border:1px solid rgba(255,255,255,.25)}
.peek{position:fixed;inset:0;z-index:58;background:rgba(6,6,9,.92);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;padding:24px 22px;overflow-y:auto}
.peek[hidden]{display:none}
.peek-card{width:min(300px,78vw)}
.peek-card img{width:100%;display:block;border-radius:12px;box-shadow:0 18px 44px rgba(0,0,0,.6)}
.peek-name{font-size:20px;font-weight:800;letter-spacing:-.02em;text-align:center;margin-top:10px}
.peek-eff{color:var(--dust);font-size:14px;line-height:1.5;text-align:center;max-width:36ch;margin:6px auto 0}
.peek-hint{color:var(--dim)}

/* face-down "random" picks */
.blind-back{aspect-ratio:5/7;display:block}
.blind-back .back{border-radius:0}

/* read-then-confirm chooser (Prepper) */
.ch-list{display:grid;gap:9px;margin-top:14px}
.ch-row{display:flex;gap:11px;align-items:flex-start;padding:11px;border-radius:11px;text-align:left;
  background:var(--panel-2);border:1px solid var(--edge)}
.ch-row.sel{border-color:var(--green);box-shadow:0 0 0 2px color-mix(in srgb,var(--green) 45%,transparent)}
.ch-art{position:relative;width:64px;flex:0 0 auto;border-radius:7px;overflow:hidden}
.ch-art img{width:100%;display:block}
.ch-name{font-weight:800;font-size:15px}
.ch-eff{color:var(--dust);font-size:12.5px;line-height:1.45;margin-top:4px}
.piles{margin-top:18px;padding-top:12px;border-top:1px solid var(--edge);display:grid;gap:12px}
.piles-p b{font-size:13px}
.piles-p .mono{color:var(--dim);margin-left:6px}

/* discard pile tile */
.deck-top{width:24px;height:34px;border-radius:4px;overflow:hidden;flex:0 0 auto;background:var(--panel-2);
  border:1px dashed var(--edge)}
.deck-top img{width:100%;height:100%;object-fit:cover;display:block}

/* ==========================================================================
   COMPACT TABLE (#13). On a typical phone (~410x750) the age panel, deck row,
   hand and a tall action dock left the trait pile only a sliver of screen, so
   you had to scroll to see it. Tighten the chrome so the pile gets the room;
   the age panel stays tappable for its full card.
   ========================================================================== */
.board{padding:8px 12px 8px}
.age{gap:10px;padding:8px 10px;margin-bottom:8px}
.age img{width:42px;border-radius:6px}
.age-name{font-size:15px;margin-top:0}
.age-text{font-size:12px;line-height:1.4;margin-top:2px}
.age-rule{margin-top:5px;font-size:9px;padding:2px 7px}
.decks{margin-bottom:8px}
.deck{padding:5px 8px;gap:7px}
.deck-mini,.deck-top{width:18px;height:26px}
.pile-head{margin-bottom:6px}
/* "COLORLESS 1" ran into the next column's label */
.col-label{letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis}
.gp button{width:26px;height:26px}
.hand-head{padding:6px 14px 0}
.hand{padding:6px 14px 8px}
.hc{width:78px}
.hand-empty{padding:8px 14px 10px}
.act{padding-bottom:calc(8px + var(--safe-b))}
.cta{padding:10px 14px;font-size:15px;border-radius:12px}
.cta-sub{font-size:10.5px;margin-top:1px}
.act-row{margin-top:6px}
.minor{padding:7px;font-size:12px;border-radius:9px}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<!-- ===================== SETUP ===================== -->
<section class="screen on" id="scSetup">
  <div class="setup">
    <p class="mono" style="color:var(--dim)">Doomlings</p>
    <h1 class="title">Set the table</h1>
    <p class="lede">Base game. Pass the phone around.</p>

    <div id="setupLoading" class="loader">Loading cards…</div>

    <div id="setupBody" hidden>
      <div id="setupNotes"></div>

      <span class="lab mono" style="color:var(--dim)">Players</span>
      <div id="seats"></div>
      <button class="add" id="addSeat">Add player</button>

      <span class="lab mono" style="color:var(--dim)">Game length</span>
      <div class="opts" id="variants"></div>

      <span class="lab mono" style="color:var(--dim)">Hands</span>
      <div class="opts">
        <button class="opt sel" id="optPrivate">
          <span>
            <span class="opt-t">Private hands</span>
            <span class="opt-d">A hand-off screen covers the phone between turns, so nobody sees your cards.</span>
          </span>
        </button>
        <button class="opt" id="optOpen">
          <span>
            <span class="opt-t">Open hands</span>
            <span class="opt-d">No hand-off. Faster when you're playing solo or nobody minds.</span>
          </span>
        </button>
      </div>
    </div>
  </div>
  <div class="act" id="setupAct" hidden>
    <button class="cta" id="deal">Deal and start</button>
  </div>
</section>

<!-- ===================== TABLE ===================== -->
<section class="screen" id="scTable">
  <div class="doom" id="doom"></div>
  <div class="bar">
    <span class="mono bar-era" id="barEra"></span>
    <span class="bar-turn" id="barTurn"></span>
    <button class="icon-btn" id="btnLog" aria-label="Game log">≡</button>
    <button class="icon-btn" id="btnMenu" aria-label="Menu">⋯</button>
  </div>

  <div class="opps scroll-x" id="opps"></div>

  <div class="board" id="board">
    <div class="age" id="age" hidden></div>
    <div class="decks" id="decks"></div>
    <div class="pile-head"><b>Your traits</b><span class="mono" id="pileN"></span></div>
    <div class="cols scroll-x" id="pile"></div>
  </div>

  <div class="hand-wrap">
    <div class="hand-head">
      <b id="handTitle">Your hand</b>
      <span class="mono stab" id="stab"></span>
    </div>
    <div class="hand scroll-x" id="hand"></div>
  </div>

  <div class="act">
    <button class="cta" id="cta"></button>
    <div class="act-row">
      <button class="minor" id="btnCant">Can't play</button>
      <button class="minor" id="btnDraw">Draw</button>
    </div>
  </div>
</section>

<!-- ===================== SCORING WALKTHROUGH ===================== -->
<section class="screen" id="scWalk">
  <div class="sw-head">
    <p class="mono" style="color:var(--dim)">Scoring</p>
    <div class="sw-row">
      <h2 class="sw-who" id="swWho"></h2>
      <b class="sw-run" id="swTotal">0</b>
    </div>
    <p class="sw-step mono" id="swStep"></p>
    <div class="sw-cards scroll-x" id="swCards"></div>
  </div>
  <div class="sw-log" id="swLines"></div>
  <div class="act">
    <div class="act-row" style="margin-top:0">
      <button class="minor" id="swSkip">Skip to results</button>
      <button class="minor" id="swFF">Fast forward</button>
    </div>
  </div>
</section>

<!-- ===================== SCORES ===================== -->
<section class="screen" id="scScore">
  <div class="setup">
    <p class="mono" style="color:var(--dim)">The world ended</p>
    <h1 class="title">Final scores</h1>
    <p class="lede" id="scoreLede"></p>
    <div id="scoreRows"></div>
  </div>
  <div class="act">
    <button class="cta flip" id="again">New game</button>
  </div>
</section>

<!-- ===================== OVERLAYS ===================== -->
<div class="pass" id="pass" hidden>
  <p class="pass-eyebrow mono">Pass the phone to</p>
  <h2 class="pass-name" id="passName"></h2>
  <div class="pass-card" id="passCard" hidden></div>
  <p class="pass-why" id="passWhy"></p>
  <button class="pass-go" id="passGo">I'm ready</button>
</div>

<div class="reveal" id="reveal" hidden>
  <p class="rv-eyebrow mono" id="rvKind"></p>
  <div class="rv-card" id="rvCard"></div>
  <h2 class="rv-name" id="rvName"></h2>
  <p class="rv-text" id="rvText"></p>
  <p class="rv-do mono" id="rvDo"></p>
  <button class="rv-go" id="rvGo">Continue</button>
</div>

<div class="peek" id="peek" hidden>
  <div class="peek-card" id="peekBody"></div>
  <p class="peek-hint mono">Tap anywhere to close</p>
</div>

<div class="sheet-bg" id="sheetBg" hidden>
  <div class="sheet" id="sheet">
    <div class="grip"></div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot" id="sheetFoot" hidden></div>
  </div>
</div>

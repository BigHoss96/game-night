<script>
/* ---- engine/ages.js ---- */
/**
 * Doomlings — age and catastrophe effects (base game).
 *
 * Ages come in two shapes and the engine treats them differently:
 *
 *   *each(ctx)      fires once for a player, at the start of their turn. This
 *                   is "Draw 2 cards", "Discard 1 at random" and friends.
 *   restrict {...}  a standing rule for the whole round — colours that can't
 *                   be played, a different stabilize target, actions ignored.
 *   *onReveal(ctx)  fires once for the table when the card turns over.
 *
 * Catastrophes additionally carry:
 *
 *   gp              Gene Pool delta applied to every player on reveal.
 *   *worldsEnd(ctx) only when this is the THIRD catastrophe.
 *   *weScore(ctx)   World's End scoring, returns {playerId: delta}.
 *
 * The split matters: a catastrophe's white text happens the moment it turns
 * over, but its World's End text sits dormant unless it ends the game — and
 * Prepper can choose which catastrophe that is.
 */

/* ------------------------------------------------------------------ *
 * Shared helpers
 * ------------------------------------------------------------------ */

const pileColour = (p, c) => p.traitPile.filter((x) => hasColour(x, c)).length;

/** Ask a player to discard exactly n of their own cards. */
function* discardChosen(ctx, player, n, label) {
  const want = Math.min(n, player.hand.length);
  if (want <= 0) return [];
  const picked = yield ctx.ask.cards({
    playerId: player.id,
    prompt: label || `Discard ${want} card${want === 1 ? "" : "s"}`,
    from: "hand",
    count: want,
    max: want,
    options: player.hand.map((c) => ({ uid: c.uid, name: c.name })),
  });
  const uids = (picked || []).map((x) => (typeof x === "string" ? x : x.uid));
  const out = [];
  for (const uid of uids) {
    const c = discardFromHand(ctx.g, player, uid);
    if (c) out.push(c);
  }
  return out;
}

/** Discard n "at random": the picker taps face-down cards from the owner's hand. */
function* discardBlind(ctx, picker, owner, n, label) {
  const out = [];
  for (const c of yield* blindPick(ctx.g, picker, owner, n, label)) {
    const d = discardFromHand(ctx.g, owner, c.uid);
    if (d) out.push(d);
  }
  return out;
}

/** Ask a player to discard one trait of a given colour from their pile. */
function* discardTraitOfColour(ctx, player, colour, label) {
  const pool = player.traitPile.filter((c) => hasColour(c, colour) && !isProtected(c));
  if (!pool.length) return null;
  const choice = yield ctx.ask.trait({
    playerId: player.id,
    prompt: label || `Discard a ${colour.toLowerCase()} trait`,
    options: player.traitPile
      .filter((c) => hasColour(c, colour))
      .map((c) => ({
        playerId: player.id, uid: c.uid, name: c.name,
        disabled: isProtected(c) || undefined,
        reason: isProtected(c) ? "Dominant traits can't be discarded." : undefined,
      })),
  });
  const uid = choice && choice.uid;
  if (!uid) return null;
  return yield* ctx.discardTrait(player, uid);
}

/* ------------------------------------------------------------------ *
 * AGES
 * ------------------------------------------------------------------ */
const AGES = {

  // The opening card — its text is the base rules, nothing to execute.
  "the birth of life": {},

  /* ---- draw / discard on your turn ---- */
  "flourish": {
    *each(ctx) { ctx.draw(2); ctx.say(`${ctx.me.name} drew 2 from Flourish.`); },
  },

  "comet showers": {
    *each(ctx) {
      const gone = yield* discardBlind(ctx, ctx.me, ctx.me, 1, "Comet Showers — discard 1 card at random");
      if (gone.length) {
        yield ctx.ask.confirm({
          playerId: ctx.me.id, acknowledge: true,
          prompt: `Comet Showers: ${gone[0].name} was discarded at random.`,
        });
      }
    },
  },

  "northern winds": {
    *each(ctx) {
      ctx.draw(1);
      yield* discardChosen(ctx, ctx.me, 1, "Northern Winds — discard 1 card");
    },
  },

  "high tides": {
    *each(ctx) {
      const draw = yield ctx.ask.confirm({
        playerId: ctx.me.id,
        prompt: "High Tides — draw 1 card? (No discards 1 instead)",
      });
      if (draw) ctx.draw(1);
      else yield* discardChosen(ctx, ctx.me, 1, "High Tides — discard 1 card");
    },
  },

  "age of reason": {
    *each(ctx) {
      const drawn = ctx.draw(2);
      if (drawn.length < 2) return;
      const keep = yield ctx.ask.cards({
        playerId: ctx.me.id,
        prompt: "Age of Reason — keep 1, discard the other",
        from: "hand", count: 1, max: 1,
        options: drawn.map((c) => ({ uid: c.uid, name: c.name })),
      });
      const keptUid = (keep || []).map((x) => (typeof x === "string" ? x : x.uid))[0];
      for (const c of drawn) if (c.uid !== keptUid) discardFromHand(ctx.g, ctx.me, c.uid);
    },
  },

  "age of exploration": {
    *each(ctx) {
      if (!ctx.me.hand.length) return;
      const yes = yield ctx.ask.confirm({
        playerId: ctx.me.id,
        prompt: "Age of Exploration — discard 1 card to draw 2?",
      });
      if (!yes) return;
      const gone = yield* discardChosen(ctx, ctx.me, 1, "Discard 1 to draw 2");
      if (gone.length) ctx.draw(2);
    },
  },

  "age of nietzsche": {
    *each(ctx) {
      if (!ctx.me.hand.length) return;
      const yes = yield ctx.ask.confirm({
        playerId: ctx.me.id,
        prompt: `Age of Nietzsche — discard your hand (${ctx.me.hand.length}) and draw 3?`,
      });
      if (!yes) return;
      ctx.g.discard.unshift(...ctx.me.hand.splice(0));
      ctx.draw(3);
    },
  },

  "enlightenment": {
    *each(ctx) {
      if (!ctx.me.hand.length) return;
      const picked = yield ctx.ask.cards({
        playerId: ctx.me.id,
        prompt: "Enlightenment — discard up to 2 cards",
        from: "hand", count: 0, max: 2, optional: true,
        options: ctx.me.hand.map((c) => ({ uid: c.uid, name: c.name })),
      });
      for (const x of picked || []) discardFromHand(ctx.g, ctx.me, x.uid || x);
    },
  },

  "alien terraform": {
    *each(ctx) {
      const doms = ctx.me.hand.filter(isDominant);
      if (!doms.length) return;
      const yes = yield ctx.ask.confirm({
        playerId: ctx.me.id,
        prompt: `Alien Terraform — discard ${doms.length} dominant card(s) from hand and stabilize?`,
      });
      if (!yes) return;
      for (const c of doms) discardFromHand(ctx.g, ctx.me, c.uid);
      ctx.restabilize();
    },
  },

  "coastal formations": {
    restrict: { stabilizePlus: 1 },
    *each(ctx) {
      yield ctx.ask.confirm({
        playerId: ctx.me.id, acknowledge: true,
        prompt: "Coastal Formations: you may stabilize to 1 over your Gene Pool this round.",
      });
    },
  },

  "awakening": {
    *onReveal(ctx) {
      const next = ctx.g.ageDeck[0];
      if (!next) return;
      yield ctx.ask.confirm({
        acknowledge: true,
        prompt: "Awakening — the next age is revealed to everyone.",
        peek: { name: next.name, effect: next.effect },
      });
    },
  },

  "birth of a hero": {
    // Rulebook p.6: the one base-game exception to the 2-dominant limit.
    restrict: { heroicFree: true },
    *each(ctx) {
      const heroic = ctx.me.hand.find((c) => norm(c.name) === "heroic");
      if (!heroic) return;
      const yes = yield ctx.ask.confirm({
        playerId: ctx.me.id,
        prompt: "Birth of a Hero — play Heroic now, without restriction?",
      });
      if (yes) yield* ctx.playNow(heroic.uid, { ignoreRequirements: true });
    },
  },

  /* ---- standing restrictions ---- */
  "arid lands":      { restrict: { noColour: "Blue" } },
  "eclipse":         { restrict: { noColour: "Red" } },
  "tectonic shift":  { restrict: { noColour: "Green" } },
  "lunar retreat":   { restrict: { noColour: "Purple" } },
  "tropical lands":  { restrict: { noColour: "Colorless" } },
  "glacial drift":   { restrict: { noFaceAtLeast: 4 } },
  "migration shifts":{ restrict: { noFaceExactly: 2 } },
  "age of peace":    { restrict: { ignoreActions: true } },
  "lonely age":      { restrict: { maxPlays: 1 } },
  "age of wonder":   { restrict: { stabilizeTo: 4 } },
  "prosperity":      { restrict: { stabilizeOptional: true } },
  "reforestation":   { restrict: { noRemoval: true } },
  "galactic drift":  { restrict: { extraColourlessPlay: true } },
};

/* ------------------------------------------------------------------ *
 * CATASTROPHES
 * ------------------------------------------------------------------ */

/** "-1 Gene Pool. Discard 1 card from your hand for each <colour> trait." */
const perColourDiscard = (gp, colour, we) => ({
  gp,
  *each(ctx) {
    const n = pileColour(ctx.me, colour);
    if (!n) return;
    yield* discardChosen(ctx, ctx.me, n,
      `Discard ${n} card${n === 1 ? "" : "s"} — 1 for each ${colour.toLowerCase()} trait`);
  },
  ...we,
});

/** World's End: "-1 for each <colour> trait in your trait pile." */
const weMinusPerColour = (colour, per = 1) => ({
  *weScore(ctx) {
    const out = {};
    for (const p of ctx.g.players) {
      const n = pileColour(p, colour);
      if (n) out[p.id] = -per * n;
    }
    return out;
  },
});

/** World's End: "Discard 1 <colour> trait from your trait pile." */
const weDiscardColour = (colour) => ({
  *worldsEnd(ctx) {
    for (const p of ctx.playersInOrder()) {
      yield* discardTraitOfColour(ctx, p, colour,
        `${p.name}: discard a ${colour.toLowerCase()} trait`);
    }
  },
});
const CATASTROPHES = {

  "super volcano":    perColourDiscard(-1, "Blue",      weMinusPerColour("Blue")),
  "ice age":          perColourDiscard(-1, "Red",       weMinusPerColour("Red")),
  "retrovirus":       perColourDiscard(-1, "Green",     weMinusPerColour("Green")),
  "pulse event":      perColourDiscard(-1, "Purple",    weDiscardColour("Purple")),
  "mass extinction":  perColourDiscard(-1, "Colorless", weDiscardColour("Green")),

  "ai takeover": {
    gp: -1,
    *each(ctx) {
      const over = ctx.me.hand.length - 2;
      if (over > 0) yield* discardChosen(ctx, ctx.me, over, "AI Takeover — keep only 2 cards");
    },
    // "Set the face value of all colorless traits to 2. Ignore all colorless
    //  effects. (Excluding dominants.)" Rewrites the pile before scoring.
    *worldsEnd(ctx) {
      for (const p of ctx.g.players) {
        for (const c of p.traitPile) {
          if (isDominant(c) || !hasColour(c, "Colorless")) continue;
          c.points = "2";
          c.aiSuppressed = true;
        }
      }
      ctx.say("AI Takeover: colorless traits are worth 2 and their effects are ignored.");
    },
  },

  "deus ex machina": {
    gp: 0,
    *each(ctx) { ctx.restabilize(); },
    *worldsEnd(ctx) {
      for (const p of ctx.playersInOrder()) {
        const [c] = drawMany(ctx.g, p, 1);
        if (!c) continue;
        p.deusBonus = Math.min(faceValue(c), 7);
        yield ctx.ask.confirm({
          playerId: p.id, acknowledge: true,
          prompt: `${p.name} drew ${c.name} — +${p.deusBonus} to their final score.`,
        });
      }
    },
    *weScore(ctx) {
      const out = {};
      for (const p of ctx.g.players) if (p.deusBonus) out[p.id] = p.deusBonus;
      return out;
    },
  },

  "glacial meltdown": {
    gp: -1,
    *each(ctx) {
      const gone = yield* discardBlind(ctx, ctx.me, ctx.me, 2, "Glacial Meltdown — discard 2 cards at random");
      if (gone.length) {
        yield ctx.ask.confirm({
          playerId: ctx.me.id, acknowledge: true,
          prompt: `Glacial Meltdown discarded ${gone.map((c) => c.name).join(" and ")}.`,
        });
      }
    },
    ...weDiscardColour("Blue"),
  },

  "grey goo": {
    gp: 0,
    // "The player(s) with the most traits discard their hand and stabilize."
    *each(ctx) {
      const most = Math.max(...ctx.g.players.map((p) => p.traitPile.length));
      if (ctx.me.traitPile.length !== most || most === 0) return;
      ctx.g.discard.unshift(...ctx.me.hand.splice(0));
      ctx.restabilize();
      ctx.say(`${ctx.me.name} discarded their hand to Grey Goo.`);
    },
    *weScore(ctx) {
      const most = Math.max(...ctx.g.players.map((p) => p.traitPile.length));
      const out = {};
      if (most <= 0) return out;
      for (const p of ctx.g.players) if (p.traitPile.length === most) out[p.id] = -5;
      return out;
    },
  },

  "mega tsunami": {
    gp: 0,
    // Hands pass as one simultaneous move, so it runs on reveal, not per turn.
    *onReveal(ctx) {
      const g = ctx.g;
      const hands = g.players.map((p) => p.hand);
      g.players.forEach((p, i) => {
        // "Pass your hand to the right" — the previous seat in play order.
        p.hand = hands[(i + 1) % g.players.length];
      });
      ctx.say("Mega Tsunami: every hand passed to the right.");
      yield ctx.ask.confirm({ acknowledge: true, prompt: "Mega Tsunami — hands passed to the right." });
    },
    ...weDiscardColour("Red"),
  },

  "nuclear winter": {
    gp: -1,
    *each(ctx) {
      ctx.restabilize();
      yield* discardChosen(ctx, ctx.me, 1, "Nuclear Winter — discard 1 card");
    },
    ...weDiscardColour("Colorless"),
  },

  "overpopulation": {
    gp: +1,
    *each(ctx) {
      const n = Math.min(COLOURS.filter((c) => pileColour(ctx.me, c) > 0).length, 4);
      if (n) { ctx.draw(n); ctx.say(`${ctx.me.name} drew ${n} from Overpopulation.`); }
    },
    *weScore(ctx) {
      const fewest = Math.min(...ctx.g.players.map((p) => p.traitPile.length));
      const out = {};
      for (const p of ctx.g.players) if (p.traitPile.length === fewest) out[p.id] = 5;
      return out;
    },
  },

  "solar flare": {
    gp: 0,
    *each(ctx) {
      yield* discardChosen(ctx, ctx.me, 3, "Solar Flare — discard 3 cards");
      ctx.draw(2);
    },
    ...weMinusPerColour("Purple"),
  },

  "the big one": {
    gp: -1,
    *onReveal(ctx) {
      const g = ctx.g;
      // Face-down picks, so whoever holds the phone can pick for everyone.
      const moving = [];
      for (const p of g.players) {
        moving.push(yield* blindPick(g, ctx.me, p, 2,
          `The Big One — pick 2 of ${p.name}'s cards to pass left`));
      }
      g.players.forEach((p, i) => {
        for (const c of moving[i]) {
          const k = p.hand.findIndex((x) => x.uid === c.uid);
          if (k >= 0) g.players[(i + 1) % g.players.length].hand.push(p.hand.splice(k, 1)[0]);
        }
      });
      ctx.say("The Big One: 2 random cards passed left.");
      yield ctx.ask.confirm({ acknowledge: true, prompt: "The Big One — 2 random cards passed to the left." });
    },
    // "-4 if you have 4 or more traits of the same color."
    *weScore(ctx) {
      const out = {};
      for (const p of ctx.g.players) {
        if (COLOURS.some((c) => pileColour(p, c) >= 4)) out[p.id] = -4;
      }
      return out;
    },
  },

  "the four horsemen": {
    gp: 0,
    *each(ctx) {
      const pool = ctx.me.traitPile.filter((c) => !isProtected(c));
      if (!pool.length) return;
      const choice = yield ctx.ask.trait({
        playerId: ctx.me.id,
        prompt: "The Four Horsemen — discard 1 trait from your pile",
        options: ctx.me.traitPile.map((c) => ({
          playerId: ctx.me.id, uid: c.uid, name: c.name,
          disabled: isProtected(c) || undefined,
          reason: isProtected(c) ? "Dominant traits can't be discarded." : undefined,
        })),
      });
      if (choice && choice.uid) yield* ctx.discardTrait(ctx.me, choice.uid);
    },
    // "Discard 1 face value (4) trait or higher from your trait pile."
    *worldsEnd(ctx) {
      for (const p of ctx.playersInOrder()) {
        const pool = p.traitPile.filter((c) => faceValue(c) >= 4 && !isProtected(c));
        if (!pool.length) continue;
        const choice = yield ctx.ask.trait({
          playerId: p.id,
          prompt: `${p.name}: discard a trait with face value 4 or higher`,
          options: p.traitPile.filter((c) => faceValue(c) >= 4).map((c) => ({
            playerId: p.id, uid: c.uid, name: c.name,
            disabled: isProtected(c) || undefined,
            reason: isProtected(c) ? "Dominant traits can't be discarded." : undefined,
          })),
        });
        if (choice && choice.uid) yield* ctx.discardTrait(p, choice.uid);
      }
    },
  },
};

/* ------------------------------------------------------------------ *
 * Lookup + restriction queries
 * ------------------------------------------------------------------ */
function ageHandler(card) {
  if (!card) return null;
  const k = norm(card.name);
  return CATASTROPHES[k] || AGES[k] || null;
}

/** The standing rules in force this round, from the face-up age. */
function activeRestrict(card) {
  const h = ageHandler(card);
  return (h && h.restrict) || {};
}

/** Can this trait legally be played under the current age? */
function ageAllowsPlay(card, restrict) {
  if (!restrict) return true;
  if (restrict.noColour && hasColour(card, restrict.noColour)) return false;
  if (restrict.noFaceAtLeast != null && faceValue(card) >= restrict.noFaceAtLeast) return false;
  if (restrict.noFaceExactly != null && faceValue(card) === restrict.noFaceExactly) return false;
  return true;
}
function ageBlockReason(card, restrict) {
  if (!restrict) return null;
  if (restrict.noColour && hasColour(card, restrict.noColour)) {
    return `This age blocks ${restrict.noColour.toLowerCase()} traits.`;
  }
  if (restrict.noFaceAtLeast != null && faceValue(card) >= restrict.noFaceAtLeast) {
    return `This age blocks face value ${restrict.noFaceAtLeast} and higher.`;
  }
  if (restrict.noFaceExactly != null && faceValue(card) === restrict.noFaceExactly) {
    return `This age blocks face value ${restrict.noFaceExactly} traits.`;
  }
  return null;
}

/** Hand size a player must reach when stabilizing, under the current age. */
function stabilizeTarget(player, restrict) {
  if (restrict && restrict.stabilizeTo != null) return restrict.stabilizeTo;
  return player.genePool;
}

/** Which catastrophes have been revealed, for Prepper. */
function revealedCatastrophes(g) {
  return g.eras.flat().filter((c) => CATASTROPHES[norm(c.name)]);
}

/* ---- engine/core.js ---- */
/**
 * Doomlings — core rules engine (base game).
 *
 * No DOM, no I/O. Everything here is a plain function over a `game` object so
 * the same code runs in the browser, in Node tests, and later inside bots.
 *
 * The one idea worth understanding before reading further: EFFECTS ARE
 * GENERATORS. A card effect that needs a decision does
 *
 *     const colour = yield ctx.ask.colour({ prompt: "Choose a colour" });
 *
 * and the engine suspends the whole game on `game.pending`. A human answers it
 * by tapping; a bot answers it by calling the same `answer()` function. Neither
 * knows about the other, which is what keeps bots honest — they cannot see or
 * do anything a player could not.
 *
 * Consequence worth knowing: a suspended generator cannot be JSON-serialised,
 * so a game cannot be saved mid-effect. Save between turns instead.
 */

const COLOURS = ["Blue", "Green", "Red", "Purple", "Colorless"];
const RULES = {
  startingHand: 5,
  startingGenePool: 5,
  genePoolMin: 1,
  genePoolMax: 8,
  dominantLimit: 2,
  emptyHandDraw: 5,
  stuckDraw: 3,
};
const VARIANTS = {
  "3x3": { eras: 3, agesPerEra: 3, label: "3 eras of 3 ages" },
  "3x4": { eras: 3, agesPerEra: 4, label: "3 eras of 4 ages" },
  "4x3": { eras: 4, agesPerEra: 3, label: "4 eras of 3 ages" },
};

/* ------------------------------------------------------------------ *
 * Card helpers
 * ------------------------------------------------------------------ */
const norm = (s) => (s || "").trim().toLowerCase();

const SPLIT = " | ";
const listOf = (raw) =>
  (raw || "").split(SPLIT).map((v) => v.trim()).filter(Boolean);
const hasSubtype = (card, want) =>
  listOf(card.subtype).some((s) => norm(s) === norm(want));

/** Catastrophes are card_type "Age" with subtype "Catastrophe" — they share the
 *  AGES back on purpose so players cannot see one coming. Never test card_type. */
const isCatastrophe = (c) => norm(c.card_type) === "age" && hasSubtype(c, "Catastrophe");
const isBirthOfLife = (c) => norm(c.name) === "the birth of life";
const isAge = (c) => norm(c.card_type) === "age" && !isCatastrophe(c) && !isBirthOfLife(c);
const isTrait = (c) => norm(c.card_type) === "trait";
const isDominant = (c) => hasSubtype(c, "Dominant");
const isAction = (c) => hasSubtype(c, "Action");

/**
 * Rulebook p.6: once played, a dominant trait "cannot be swapped, stolen,
 * given, returned, discarded, or removed from your trait pile." Every removal
 * path funnels through this so no single card can forget the rule.
 */
const isProtected = (c) => isDominant(c);

/** Reforestation shields EVERY trait for the round, not just dominants. */
function isRemovable(g, card) {
  if (isProtected(card)) return false;
  if (activeRestrict(topAge(g)).noRemoval) return false;
  return true;
}
const PROTECTED_REASON =
  "Dominant traits can't be swapped, stolen, given, returned or discarded.";

/** "Multi-color" is a marker, not a colour. Big Ears (Blue|Purple|Multi-color)
 *  counts as both blue and purple everywhere a colour is counted. */
const coloursOf = (card) =>
  listOf(card.color).filter((c) => norm(c) !== "multi-color");
const isMulti = (card) => listOf(card.color).some((c) => norm(c) === "multi-color");
const hasColour = (card, colour) =>
  coloursOf(card).some((c) => norm(c) === norm(colour));
const faceValue = (card) => {
  const n = parseFloat(card.points);
  return Number.isFinite(n) ? n : 0;
};

/* ------------------------------------------------------------------ *
 * Deterministic RNG — seeded so a failing game can be replayed exactly.
 * ------------------------------------------------------------------ */
function makeRng(seed = 1) {
  let a = seed >>> 0;
  return function rng() {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(list, rng) {
  const out = list.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

/* ------------------------------------------------------------------ *
 * Deal
 * ------------------------------------------------------------------ */

let uidSeq = 0;
const resetUids = () => { uidSeq = 0; };
const tag = (card) => ({ ...card, uid: `c${++uidSeq}` });
function inventory(pool) {
  return {
    traits: pool.filter(isTrait),
    ages: pool.filter(isAge),
    catastrophes: pool.filter(isCatastrophe),
    birth: pool.find(isBirthOfLife) || null,
  };
}

/**
 * Table setting, rulebook pages 1–2: deal 5 traits each; separate ages and
 * catastrophes and shuffle them apart; give each era pile its ages plus exactly
 * one catastrophe and shuffle that pile on its own (this is what hides when
 * doom arrives); stack the piles, Birth of Life on top.
 */
function dealGame(pool, { names, variantKey = "3x3", seed = 1, bots = [] } = {}) {
  const rng = makeRng(seed);
  const v = VARIANTS[variantKey];
  const inv = inventory(pool);

  const traits = shuffle(inv.traits, rng).map(tag);
  const players = names.map((name, i) => ({
    id: i,
    name: name || `Player ${i + 1}`,
    isBot: Boolean(bots[i]),
    hand: traits.splice(0, RULES.startingHand),
    traitPile: [],
    genePool: RULES.startingGenePool,
    dominants: 0,
    adjust: 0,
    flags: {},           // per-player persistent state (e.g. denialArmed)
  }));

  const ages = shuffle(inv.ages, rng).map(tag);
  const cats = shuffle(inv.catastrophes, rng).map(tag);

  const eraPiles = [];
  for (let e = 0; e < v.eras; e++) {
    const pile = ages.splice(0, v.agesPerEra);
    if (cats.length) pile.push(cats.shift());
    eraPiles.push(shuffle(pile, rng));
  }

  const ageDeck = eraPiles.flat();
  if (inv.birth) ageDeck.unshift(tag(inv.birth));

  return {
    rng,
    seed,
    players,
    traitDeck: traits,
    discard: [],
    ageDeck,
    eras: Array.from({ length: v.eras }, () => []),
    currentEra: 0,
    activeSeat: 0,
    firstSeat: 0,
    round: 0,
    phase: "age",            // "age" | "turn" | "worldsEnd" | "over"
    catastrophes: 0,
    pendingNewEra: false,
    playsLeft: 0,            // plays remaining this turn (1 normally)
    stabilizeWaived: false,
    variantKey,
    pending: null,           // suspended effect awaiting an answer
    log: [],
    scores: null,
  };
}

/* ------------------------------------------------------------------ *
 * Small accessors
 * ------------------------------------------------------------------ */
const seatOf = (g) => g.players[g.activeSeat];
const opponentsOf = (g, p) => g.players.filter((x) => x.id !== p.id);
const topAge = (g) => {
  const pile = g.eras[g.currentEra];
  return pile && pile.length ? pile[pile.length - 1] : null;
};
const say = (g, text, big = false) => { g.log.unshift({ text, big }); };

/* ------------------------------------------------------------------ *
 * Primitive operations — these are what card effects are built from.
 * ------------------------------------------------------------------ */

/** Drawing reshuffles the discard when the trait deck runs dry (FAQ p.8). */
function drawCard(g, player) {
  if (!g.traitDeck.length && g.discard.length) {
    g.traitDeck = shuffle(g.discard, g.rng);
    g.discard = [];
    say(g, "Trait deck ran out — discard reshuffled in.");
  }
  if (!g.traitDeck.length) return null;
  const card = g.traitDeck.shift();
  player.hand.push(card);
  return card;
}
function drawMany(g, player, n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const c = drawCard(g, player);
    if (!c) break;
    out.push(c);
  }
  return out;
}
function discardFromHand(g, player, uid) {
  const i = player.hand.findIndex((c) => c.uid === uid);
  if (i < 0) return null;
  const card = player.hand.splice(i, 1)[0];
  g.discard.unshift(card);
  return card;
}
function randomCardsFromHand(g, player, n) {
  const picks = [];
  const pool = player.hand.slice();
  for (let i = 0; i < n && pool.length; i++) {
    picks.push(pool.splice(Math.floor(g.rng() * pool.length), 1)[0]);
  }
  return picks;
}

/**
 * "At random" from a hand, done the way the table does it: the hand is shuffled
 * face down and a player taps the cards. The engine keeps the shuffled order, so
 * the UI only ever sees backs and positions — it cannot peek.
 * Answer: an array of positions (0-based). Missing picks are filled in order.
 */
function* blindPick(g, picker, owner, n, prompt) {
  const want = Math.min(n, owner.hand.length);
  if (want <= 0) return [];
  const order = shuffle(owner.hand.map((c) => c.uid), g.rng);
  const res = yield {
    kind: "blind", playerId: picker.id, ownerId: owner.id, ownerName: owner.name,
    total: order.length, count: want, prompt,
  };
  const idx = [...new Set((res || []).filter((i) => Number.isInteger(i) && i >= 0 && i < order.length))]
    .slice(0, want);
  for (let i = 0; idx.length < want && i < order.length; i++) if (!idx.includes(i)) idx.push(i);
  return idx.map((i) => owner.hand.find((c) => c.uid === order[i])).filter(Boolean);
}

/** Gene Pool moves are clamped by being IGNORED out of range, not capped. */
function adjustGenePool(g, player, delta) {
  const next = player.genePool + delta;
  if (next < RULES.genePoolMin || next > RULES.genePoolMax) return false;
  player.genePool = next;
  return true;
}

/**
 * Gene Pool effects live with the trait (rulebook p.5): "If the trait leaves
 * your trait pile, adjust your Gene Pool accordingly." Handlers declare the
 * size of their effect as `gpDelta`, and this undoes or re-applies it.
 */
function gpDeltaOf(card, registry) {
  const h = registry && registry[norm(card.name)];
  return h && typeof h.gpDelta === "number" ? h.gpDelta : 0;
}
function moveTrait(g, from, to, uid, registry) {
  if (!from || !to) return null;
  const i = from.traitPile.findIndex((c) => c.uid === uid);
  if (i < 0) return null;
  const card = from.traitPile[i];
  if (isProtected(card)) return null;          // the rule, enforced centrally
  from.traitPile.splice(i, 1);
  to.traitPile.push(card);
  if (isDominant(card)) { from.dominants--; to.dominants++; }

  const d = gpDeltaOf(card, registry);
  if (d) { adjustGenePool(g, from, -d); adjustGenePool(g, to, d); }
  return card;
}
function returnTraitToHand(g, player, uid, registry) {
  const i = player.traitPile.findIndex((c) => c.uid === uid);
  if (i < 0) return null;
  const card = player.traitPile[i];
  if (isProtected(card)) return null;
  player.traitPile.splice(i, 1);
  if (isDominant(card)) player.dominants--;
  player.hand.push(card);

  const d = gpDeltaOf(card, registry);
  if (d) adjustGenePool(g, player, -d);
  return card;
}

/**
 * Discard a trait OUT of a trait pile. Routed through here rather than spliced
 * inline because two base-game cards react to it: Endurance returns itself, and
 * Regenerative Tissue draws when any trait leaves.
 */
function* discardTrait(g, player, uid, registry) {
  const i = player.traitPile.findIndex((c) => c.uid === uid);
  if (i < 0) return null;
  if (isProtected(player.traitPile[i])) return null;   // dominants never leave
  const card = player.traitPile.splice(i, 1)[0];
  if (isDominant(card)) player.dominants--;

  const d = gpDeltaOf(card, registry);
  if (d) adjustGenePool(g, player, -d);

  if (norm(card.name) === "endurance") {
    player.traitPile.push(card);
    say(g, `${card.name} returned itself to ${player.name}'s trait pile.`);
    yield* fireOnTraitDiscarded(g, player, card, registry);
    return card;
  }

  g.discard.unshift(card);
  yield* fireOnTraitDiscarded(g, player, card, registry);
  return card;
}

function* fireOnTraitDiscarded(g, player, card, registry) {
  if (!registry) return;
  for (const held of player.traitPile.slice()) {
    const h = registry[norm(held.name)];
    if (h && h.onTraitDiscarded) {
      yield* h.onTraitDiscarded(makeCtx(g, player, held, registry), card);
    }
  }
}

/* ------------------------------------------------------------------ *
 * Effect context — the sandbox a card script is given.
 * ------------------------------------------------------------------ */
const ask = {
  cards: (o) => ({ kind: "cards", ...o }),
  colour: (o) => ({ kind: "colour", ...o }),
  player: (o) => ({ kind: "player", ...o }),
  trait: (o) => ({ kind: "trait", ...o }),
  confirm: (o) => ({ kind: "confirm", ...o }),
};
function makeCtx(g, player, card, registry) {
  return {
    g,
    game: g,
    me: player,
    card,
    registry,
    ask,
    opponents: () => opponentsOf(g, player),
    draw: (n = 1) => drawMany(g, player, n),
    say: (t, big) => say(g, t, big),

    /** Grant an extra play this turn ("Play 1 more trait"). */
    grantPlay: (n = 1) => { g.playsLeft += n; },

    /** Play a specific card from hand immediately, resolving its action unless
     *  told otherwise. Used by "You may play 1 of them now". */
    playNow: function* (uid, { ignoreAction = false, suppressReactions = false } = {}) {
      return yield* playTraitInner(g, player, uid, registry,
        { ignoreAction, free: true, suppressReactions });
    },

    /** Move a trait between piles, used by Parasitic's steal. */
    takeTrait: (from, to, uid) => moveTrait(g, from, to, uid, registry),

    discardTrait: function* (owner, uid) {
      return yield* discardTrait(g, owner, uid, registry);
    },

    /** Players starting from the first player, for table-wide effects. */
    playersInOrder: () => playersFrom(g, g.firstSeat),

    /** "Stabilize" as an instruction from a card, not an end-of-turn step. */
    restabilize: () => {
      const target = stabilizeTarget(player, activeRestrict(topAge(g)));
      let guard = 0;
      while (player.hand.length < target && guard++ < 20) if (!drawCard(g, player)) break;
      while (player.hand.length > target && guard++ < 40) {
        const c = player.hand[player.hand.length - 1];
        discardFromHand(g, player, c.uid);
      }
    },
  };
}

/* ------------------------------------------------------------------ *
 * Playing a trait
 * ------------------------------------------------------------------ */

/** Requirement subtype cards gate their own play. */
function canPlayCard(g, player, card, registry) {
  const restrict = activeRestrict(topAge(g));

  // The face-up age can forbid whole colours or face values this round.
  if (!ageAllowsPlay(card, restrict)) return false;

  const h = registry[norm(card.name)];
  if (h && h.canPlay && !h.canPlay(g, player, card)) return false;

  if (isDominant(card) && player.dominants >= RULES.dominantLimit) {
    // Rulebook p.6: Heroic during Birth of a Hero is the one base-game
    // exception to the limit of two.
    if (!(restrict.heroicFree && norm(card.name) === "heroic")) return false;
  }
  return true;
}

/** Why a card can't be played, for the UI to explain. */
function playBlockReason(g, player, card, registry) {
  const restrict = activeRestrict(topAge(g));
  const ageWhy = ageBlockReason(card, restrict);
  if (ageWhy) return ageWhy;
  if (isDominant(card) && player.dominants >= RULES.dominantLimit &&
      !(restrict.heroicFree && norm(card.name) === "heroic")) {
    return `You have already played ${RULES.dominantLimit} dominant traits.`;
  }
  const h = registry[norm(card.name)];
  if (h && h.canPlay && !h.canPlay(g, player, card)) {
    return card.effect || "Its requirement is not met.";
  }
  return null;
}
function playableCards(g, player, registry) {
  return player.hand.filter((c) => canPlayCard(g, player, c, registry));
}

function* playTraitInner(g, player, uid, registry, { ignoreAction = false, free = false, suppressReactions = false } = {}) {
  const i = player.hand.findIndex((c) => c.uid === uid);
  if (i < 0) return null;
  const card = player.hand[i];
  if (!canPlayCard(g, player, card, registry)) return null;

  const h = registry[norm(card.name)] || {};

  // A Requirement's cost is paid before the card lands.
  if (h.cost) {
    const paid = yield* h.cost(makeCtx(g, player, card, registry));
    if (paid === false) return null;
  }

  player.hand.splice(i, 1);
  player.traitPile.push(card);
  if (isDominant(card)) player.dominants++;
  if (!free) g.playsLeft = Math.max(0, g.playsLeft - 1);
  say(g, `${player.name} played ${card.name}.`);

  // Age of Peace suppresses every action for the round. Work that out first:
  // an ignored action is not "an action about to resolve", so nobody should be
  // offered Automimicry / Chromatophores to stop it.
  const peace = Boolean(activeRestrict(topAge(g)).ignoreActions) && isAction(card);

  // Reaction window: anyone holding an interrupt may answer this play before
  // its action resolves. Parasitic can also steal the card out from under it,
  // which is why the window opens after the card has landed, not before.
  const event = {
    type: "traitPlayed",
    card,
    actor: player,
    isAction: isAction(card) && Boolean(h.onPlay) && !ignoreAction && !peace,
    cancelled: false,
  };
  if (!suppressReactions) {
    yield* offerReactions(g, "traitPlayed", event, registry);
  }

  // Cards already in a trait pile that watch for plays (Self-Replicating).
  if (!suppressReactions) {
    for (const p of g.players) {
      for (const held of p.traitPile.slice()) {
        const hh = registry[norm(held.name)];
        if (hh && hh.onTraitPlayed) {
          yield* hh.onTraitPlayed(makeCtx(g, p, held, registry), event);
        }
      }
    }
  }

  if (event.cancelled) {
    say(g, `${card.name}'s action was stopped.`);
    return card;
  }

  // Parasitic may have moved the card to another pile; its action still does
  // not resolve, which the cancelled flag above already handled.
  if (peace) say(g, `${card.name}'s action is ignored this age.`);

  if (!ignoreAction && !peace && h.onPlay) {
    yield* h.onPlay(makeCtx(g, player, card, registry));
  }
  return card;
}

/** Public entry: start playing a card. Returns {done} or {done:false,request}. */
function playTrait(g, uid, registry) {
  const player = seatOf(g);
  if (g.phase !== "turn" || g.playsLeft <= 0 || g.pending) return { done: true, ok: false };
  return runEffect(g, playTraitInner(g, player, uid, registry));
}

/* ------------------------------------------------------------------ *
 * Effect runner — drives generators and parks them on game.pending.
 * ------------------------------------------------------------------ */
function runEffect(g, gen) {
  return stepEffect(g, gen, undefined);
}

function stepEffect(g, gen, input) {
  const { value, done } = gen.next(input);
  if (done) {
    g.pending = null;
    return { done: true, ok: true, value };
  }
  g.pending = { request: value, gen };
  return { done: false, request: value };
}

/** Answer the outstanding request. Same call for humans and bots. */
function answer(g, response) {
  if (!g.pending) return { done: true, ok: false };
  const { gen } = g.pending;
  g.pending = null;
  return stepEffect(g, gen, response);
}

/* ------------------------------------------------------------------ *
 * Reaction windows
 *
 * Six base-game cards play OUT of turn. Rather than six special cases, every
 * one of them declares a `reactive` block naming the window it listens on, and
 * the turn flow opens those windows at the right moments.
 *
 * Windows:
 *   traitPlayed     a trait has just entered a pile, before its action resolves
 *   afterStabilize  the active player has stabilized, before the turn ends
 *   worldsEnd       the final catastrophe has turned over
 *
 * A responder is only ever asked when they actually hold an eligible card, so
 * in practice these windows are silent almost every turn.
 * ------------------------------------------------------------------ */

/** Cap on reaction chains — a Parasitic can be met by a Parasitic, and without
 *  a ceiling a pathological hand could ping-pong forever. */
const MAX_REACTION_DEPTH = 3;
function playersFrom(g, startSeat) {
  const n = g.players.length;
  return Array.from({ length: n }, (_, k) => g.players[(startSeat + k) % n]);
}

function eligibleReactions(g, player, windowName, event, registry) {
  return player.hand.filter((c) => {
    const r = (registry[norm(c.name)] || {}).reactive;
    if (!r) return false;
    const windows = [].concat(r.window || []);
    if (!windows.includes(windowName)) return false;
    return r.eligible ? r.eligible(g, player, event, c) : true;
  });
}

/**
 * Offer a reaction window to every player holding something that listens on it.
 * Mutates `event` — a responder may set `event.cancelled`.
 */
function* offerReactions(g, windowName, event, registry) {
  g.reactionDepth = (g.reactionDepth || 0);
  if (g.reactionDepth >= MAX_REACTION_DEPTH) return event;
  g.reactionDepth++;
  try {
    // Turn order starting from whoever is active, so priority is deterministic.
    for (const p of playersFrom(g, g.activeSeat)) {
      const options = eligibleReactions(g, p, windowName, event, registry);
      if (!options.length) continue;

      const choice = yield {
        kind: "reaction",
        window: windowName,
        playerId: p.id,
        playerName: p.name,
        optional: true,
        prompt: reactionPrompt(windowName, event, p),
        event: {
          type: event.type,
          cardName: event.card ? event.card.name : null,
          actorName: event.actor ? event.actor.name : null,
          isAction: Boolean(event.isAction),
        },
        options: options.map((c) => ({ uid: c.uid, name: c.name })),
      };

      const uid = choice && (typeof choice === "string" ? choice : choice.uid);
      if (!uid) continue;
      const card = p.hand.find((c) => c.uid === uid);
      if (!card) continue;

      // The interrupt enters play for free — it does not spend a turn's play.
      const i = p.hand.findIndex((c) => c.uid === uid);
      p.hand.splice(i, 1);
      const r = registry[norm(card.name)].reactive;

      if (r.intoAnyPile) {
        // Self-Awareness: choose whose pile it lands in.
        const target = yield {
          kind: "player",
          playerId: p.id,
          prompt: `${card.name} — into whose trait pile?`,
          options: g.players.map((x) => ({ id: x.id, name: x.name })),
        };
        const owner = g.players.find((x) => x.id === (target && target.id)) || p;
        owner.traitPile.push(card);
        if (isDominant(card)) owner.dominants++;
        say(g, `${p.name} played ${card.name} into ${owner.name}'s pile.`);
      } else {
        p.traitPile.push(card);
        if (isDominant(card)) p.dominants++;
        say(g, `${p.name} played ${card.name} in response.`);
      }

      if (r.respond) {
        yield* r.respond(makeCtx(g, p, card, registry), event);
      }

      if (event.cancelled) break;
    }
  } finally {
    g.reactionDepth--;
  }
  return event;
}

function reactionPrompt(windowName, event, p) {
  if (windowName === "traitPlayed") {
    const who = event.actor && event.actor.id === p.id ? "You" : (event.actor || {}).name;
    return `${who} played ${event.card ? event.card.name : "a trait"} — respond?`;
  }
  if (windowName === "afterStabilize") return "You have stabilized — play anything?";
  if (windowName === "worldsEnd") return "World's End — play anything from hand?";
  return "Respond?";
}

/* ------------------------------------------------------------------ *
 * Turn flow
 * ------------------------------------------------------------------ */

/** The hand size this player must reach, under the face-up age. */
function targetHand(g, p) {
  return stabilizeTarget(p, activeRestrict(topAge(g)));
}
const isStabilized = (g, p) => {
  const restrict = activeRestrict(topAge(g));
  if (restrict.stabilizeOptional) return true;        // Prosperity
  const target = stabilizeTarget(p, restrict);
  const slack = restrict.stabilizePlus || 0;          // Coastal Formations
  if (p.hand.length === target) return true;
  if (slack && p.hand.length > target && p.hand.length <= target + slack) return true;
  if (g.stabilizeWaived) return true;
  return p.hand.length < target && !g.traitDeck.length && !g.discard.length;
};
function canEndTurn(g) {
  const p = seatOf(g);
  if (g.phase !== "turn" || g.pending) return false;
  const played = g.playsLeft === 0 || g.stabilizeWaived;
  return played && isStabilized(g, p);
}

/**
 * End the turn, opening the afterStabilize window first (Late, Self-Awareness).
 * This is the entry point the UI and bots should call; `endTurn` below is the
 * plain version used once reactions have resolved.
 */
function beginEndTurn(g, registry) {
  if (!canEndTurn(g)) return { done: true, ok: false };
  return runEffect(g, (function* () {
    const actor = seatOf(g);
    yield* offerReactions(g, "afterStabilize", { type: "afterStabilize", actor }, registry);
    // The next player's start-of-turn effects run INSIDE this effect. Starting a
    // second runner here would be dropped when this one finishes — which is how
    // the second player used to miss "each player" age prompts.
    endTurn(g, registry, false);
    if (g.phase === "turn") yield* turnStartEffects(g, registry);
  })());
}
function endTurn(g, registry, startNow = true) {
  if (g.phase !== "turn") return false;
  g.playsLeft = 0;
  g.stabilizeWaived = false;

  const next = (g.activeSeat + 1) % g.players.length;
  if (next === g.firstSeat) {
    g.phase = "age";
    g.activeSeat = g.firstSeat;
  } else {
    g.activeSeat = next;
    if (startNow) startTurn(g, registry);
    else g.playsLeft = 1;
  }
  return true;
}

/** Start-of-turn triggers (Echolocation). Returns a runner result. */
function startTurn(g, registry) {
  g.playsLeft = 1;
  return runEffect(g, turnStartEffects(g, registry));
}

/** What the active player owes at the start of their turn: the age, then
 *  Persistent traits (Echolocation). */
function* turnStartEffects(g, registry) {
  const p = seatOf(g);
  const age = topAge(g);
  const ah = ageHandler(age);
  const ageOwed = ah && ah.each && !(g.ageApplied || []).includes(p.id);
  const holders = p.traitPile.filter((c) => {
    const h = registry[norm(c.name)];
    return h && h.onTurnStart;
  });

  // The age acts first — it may change the hand the player then plays from.
  if (ageOwed) {
    (g.ageApplied ||= []).push(p.id);
    yield* ah.each(makeCtx(g, p, age, registry));
  }
  for (const c of holders) {
    const h = registry[norm(c.name)];
    if (!p.traitPile.some((x) => x.uid === c.uid)) continue;
    yield* h.onTurnStart(makeCtx(g, p, c, registry));
  }
}

/** Empty hand: draw 5 and skip. Stuck: dump hand, draw 3. Neither stabilizes. */
function cantPlay(g) {
  const p = seatOf(g);
  if (!p.hand.length) {
    drawMany(g, p, RULES.emptyHandDraw);
    say(g, `${p.name} had an empty hand — drew ${RULES.emptyHandDraw} and skipped.`);
  } else {
    g.discard.unshift(...p.hand.splice(0));
    drawMany(g, p, RULES.stuckDraw);
    say(g, `${p.name} couldn't play — discarded their hand and drew ${RULES.stuckDraw}.`);
  }
  g.stabilizeWaived = true;
  g.playsLeft = 0;
  return true;
}

/**
 * Flip the next age. A catastrophe rotates the first player and closes the era;
 * the THIRD one ends the world immediately.
 */
function flipAge(g, registry) {
  if (g.phase !== "age" || !g.ageDeck.length || g.pending) return false;

  if (g.pendingNewEra) {
    g.currentEra = Math.min(g.currentEra + 1, g.eras.length - 1);
    g.pendingNewEra = false;
  }

  const card = g.ageDeck.shift();
  g.eras[g.currentEra].push(card);
  g.round++;
  g.ageApplied = [];            // the new age owes every player its effect

  if (isCatastrophe(card)) {
    const ignorers = g.players.filter((p) => p.flags.denialArmed);
    g.catastrophes++;
    const last = g.catastrophes >= g.eras.length;

    if (last) {
      say(g, `${card.name} — the final catastrophe. The world ends.`, true);
      g.phase = "worldsEnd";
      return true;
    }

    for (const p of ignorers) {
      p.flags.denialArmed = false;
      say(g, `${p.name} ignored ${card.name} with Denial.`);
    }

    g.firstSeat = (g.firstSeat + 1) % g.players.length;
    g.pendingNewEra = true;
    say(g, `Catastrophe ${g.catastrophes}: ${card.name}. First player is now ${g.players[g.firstSeat].name}.`, true);

    // Revealing a catastrophe ENDS the era. Players apply its effects and the
    // round is over — nobody takes a turn. The next flip opens a new era.
    g.activeSeat = g.firstSeat;
    g.playsLeft = 0;
    g.phase = "age";
    return true;
  }

  say(g, `Age flipped: ${card.name}.`);
  g.activeSeat = g.firstSeat;
  g.phase = "turn";
  startTurn(g, registry);
  return true;
}

/**
 * Effects a freshly turned age or catastrophe owes immediately.
 *
 *  - onReveal runs once for the table (Awakening's preview, hands passing).
 *  - a catastrophe's Gene Pool delta and white text hit EVERY player, in turn
 *    order starting from the first player, because the era ends here and
 *    nobody gets a turn to apply it on.
 */
function* resolveAgeReveal(g, registry) {
  const card = topAge(g);
  if (!card) return;
  const h = ageHandler(card);
  if (!h) return;

  if (h.onReveal) yield* h.onReveal(makeCtx(g, seatOf(g), card, registry));

  if (isCatastrophe(card)) {
    for (const p of playersFrom(g, g.firstSeat)) {
      if (typeof h.gp === "number" && h.gp !== 0) {
        const moved = adjustGenePool(g, p, h.gp);
        say(g, moved
          ? `${p.name} gene pool ${h.gp > 0 ? "+" : ""}${h.gp} → ${p.genePool}.`
          : `${p.name}'s gene pool is at its limit — ${card.name}'s change is ignored.`);
      }
      if (h.each) yield* h.each(makeCtx(g, p, card, registry));
    }
  }
}

/* ------------------------------------------------------------------ *
 * World's End
 * ------------------------------------------------------------------ */

/**
 * Resolve World's End before scoring: first the play-from-hand window (Sneaky),
 * then every onWorldsEnd handler in turn order starting from the first player.
 * Scoring is a separate call so the UI can show the board in between.
 */
function* resolveWorldsEnd(g, registry) {
  if (g.worldsEndResolved) return;
  g.worldsEndResolved = true;

  // 1. Play-from-hand window (Sneaky).
  yield* offerReactions(g, "worldsEnd", { type: "worldsEnd" }, registry);

  // 2. Prepper chooses WHICH catastrophe the table ends on. Default is the
  //    one that just turned over.
  const revealed = g.eras.flat().filter(isCatastrophe);
  let ender = revealed[revealed.length - 1] || null;

  const prepper = g.players.find((p) =>
    p.traitPile.some((c) => norm(c.name) === "prepper"));

  if (prepper && revealed.length > 1) {
    const choice = yield {
      kind: "choose",
      playerId: prepper.id,
      prompt: "Prepper — choose which catastrophe everyone ends on",
      sub: "Read each one, check the trait piles, then confirm.",
      showPiles: true,
      options: revealed.map((c) => ({ uid: c.uid, name: c.name })),
    };
    const picked = revealed.find((c) => c.uid === (choice && choice.uid));
    if (picked) {
      ender = picked;
      say(g, `Prepper: the table ends on ${picked.name}.`, true);
    }
  }
  g.endingCatastrophe = ender;

  // 3. The ending catastrophe's World's End text.
  const ch = ageHandler(ender);
  if (ch && ch.worldsEnd) {
    yield* ch.worldsEnd(makeCtx(g, seatOf(g), ender, registry));
  }

  // 4. Trait World's End effects, in turn order.
  for (const p of playersFrom(g, g.firstSeat)) {
    for (const card of p.traitPile.slice()) {
      const h = registry[norm(card.name)];
      if (h && h.onWorldsEnd) {
        yield* h.onWorldsEnd(makeCtx(g, p, card, registry));
      }
    }
  }
}

/* ------------------------------------------------------------------ *
 * Scoring
 * ------------------------------------------------------------------ */
const faceScore = (player) =>
  player.traitPile.reduce((n, c) => n + faceValue(c), 0);

/**
 * Final scoring. Drop of Life bonuses are generators because a few need a
 * decision ("if there's a tie, pick 1"), so this runs through the same
 * request/answer machinery as everything else.
 */
function* scoreGame(g, registry) {
  const results = [];
  for (const p of g.players) {
    let bonus = 0;

    // Per-card line items, so the UI can walk a player through their score
    // rather than just naming a number.
    const faceLines = p.traitPile
      .filter((c) => faceValue(c) !== 0)
      .map((c) => ({ kind: "face", uid: c.uid, name: c.name, amount: faceValue(c) }));
    const bonusLines = [];

    for (const card of p.traitPile) {
      if (card.aiSuppressed) continue;        // AI Takeover ignores these
      const h = registry[norm(card.name)];
      if (h && h.score) {
        const n = yield* h.score(makeCtx(g, p, card, registry));
        if (n) {
          bonus += n;
          bonusLines.push({ kind: "bonus", uid: card.uid, name: card.name, amount: n });
        }
      }
    }
    // Effects that penalise OTHER players (Viral) register as `scoreOthers`.
    results.push({ id: p.id, name: p.name, face: faceScore(p), bonus, faceLines, bonusLines });
  }

  for (const p of g.players) {
    for (const card of p.traitPile) {
      const h = registry[norm(card.name)];
      if (h && h.scoreOthers) {
        const deltas = yield* h.scoreOthers(makeCtx(g, p, card, registry));
        for (const [id, d] of Object.entries(deltas || {})) {
          const row = results.find((r) => r.id === Number(id));
          if (row && d) {
            row.bonus += d;
            row.bonusLines.push({
              kind: "bonus", uid: card.uid, name: card.name, amount: d, from: p.name,
            });
          }
        }
      }
    }
  }

  // The ending catastrophe's World's End scoring (Ice Age, Grey Goo, ...).
  const ch = ageHandler(g.endingCatastrophe);
  if (ch && ch.weScore) {
    const deltas = yield* ch.weScore(makeCtx(g, seatOf(g), g.endingCatastrophe, registry));
    for (const [id, d] of Object.entries(deltas || {})) {
      const row = results.find((r) => r.id === Number(id));
      if (row && d) {
        row.bonus += d;
        row.bonusLines.push({
          kind: "bonus", name: g.endingCatastrophe.name, amount: d, from: "World's End",
        });
      }
    }
  }

  for (const r of results) {
    const p = g.players.find((x) => x.id === r.id);
    r.adjust = p.adjust || 0;
    r.total = r.face + r.bonus + r.adjust;
  }
  results.sort((a, b) => b.total - a.total);
  g.scores = results;
  g.phase = "over";
  return results;
}

/* ---- engine/effects.js ---- */
/**
 * Doomlings — base game card effects.
 *
 * One entry per card, keyed by lowercased name. A handler may define:
 *
 *   canPlay(g, player, card) -> bool      Requirement gate, checked before play
 *   *cost(ctx)               -> bool      Price paid before the card lands
 *   *onPlay(ctx)                          Action / Gene Pool, on entering play
 *   *score(ctx)              -> number    Drop of Life bonus for the owner
 *   *scoreOthers(ctx)        -> {id:n}    Bonus/penalty applied to other players
 *   *onTurnStart(ctx)                     Persistent, at the owner's turn start
 *   *onTraitDiscarded(ctx,c)              Persistent, when a trait leaves the pile
 *   reactive: true                        Play When — needs an interrupt window
 *   manual: "reason"                      Needs a human ruling; UI must prompt
 *
 * Cards with no entry are Effectless and do nothing, which is correct.
 */

/* ================================================================== *
 * Counting helpers
 * ================================================================== */

const pileColourCount = (p, colour) =>
  p.traitPile.filter((c) => hasColour(c, colour)).length;

const handColourCount = (p, colour) =>
  p.hand.filter((c) => hasColour(c, colour)).length;

/** Colour tallies for a trait pile, multi-colour cards counting under each. */
function colourTally(p) {
  const t = {};
  for (const colour of COLOURS) t[colour] = pileColourCount(p, colour);
  return t;
}

const presentColours = (p) =>
  COLOURS.filter((c) => pileColourCount(p, c) > 0);

/* ================================================================== *
 * Factories for the repetitive Drop of Life patterns
 * ================================================================== */

/** "+N for each <colour> trait in your trait pile. (Including this.)" */
const perColour = (colour, per = 1) => ({
  *score(ctx) { return per * pileColourCount(ctx.me, colour); },
});

/** "+N for every N <colour> traits in your trait pile." */
const perGroup = (colour, size, award) => ({
  *score(ctx) { return Math.floor(pileColourCount(ctx.me, colour) / size) * award; },
});

/** Simple "+N Gene Pool" / "-N Gene Pool" cards. */
const genePool = (delta) => ({
  gpDelta: delta,
  *onPlay(ctx) {
    const ok = adjustGenePool(ctx.g, ctx.me, delta);
    ctx.say(ok
      ? `${ctx.me.name} gene pool ${delta > 0 ? "+" : ""}${delta} → ${ctx.me.genePool}.`
      : `${ctx.card.name}: gene pool already at its limit, change ignored.`);
  },
});

/** Cards whose only job is to count copies of themselves by name prefix. */
const countByPrefix = (prefix, scope) => ({
  *score(ctx) {
    const piles = scope === "all" ? ctx.g.players : [ctx.me];
    return piles.reduce(
      (n, p) => n + p.traitPile.filter((c) => norm(c.name).startsWith(prefix)).length, 0);
  },
});

/* ================================================================== *
 * Shared interaction helpers
 * ================================================================== */

/**
 * Ask for one trait out of a set of candidate {player, card} pairs.
 *
 * With `removal: true` the card is about to leave its pile, so dominants are
 * still LISTED — players need to see what an opponent holds — but shown
 * disabled with the reason. Hiding them would misrepresent the board.
 */
function* pickTrait(ctx, candidates, prompt, optional = false, removal = true) {
  if (!candidates.length) return null;

  const options = candidates.map(({ player, card }) => {
    const locked = removal && isProtected(card);
    return {
      playerId: player.id, uid: card.uid, name: card.name,
      colour: coloursOf(card).join("/"), value: faceValue(card),
      disabled: locked || undefined,
      reason: locked ? PROTECTED_REASON : undefined,
    };
  });

  // Nothing legally selectable — don't open a dead prompt.
  if (!options.some((o) => !o.disabled)) return null;

  const choice = yield ctx.ask.trait({ prompt, optional, options });
  if (!choice) return null;
  const hit = candidates.find((c) => c.card.uid === choice.uid);
  if (!hit) return null;
  if (removal && isProtected(hit.card)) return null;   // defensive
  return hit;
}

const opponentTraits = (ctx, filter = () => true) =>
  ctx.opponents().flatMap((p) =>
    p.traitPile.filter(filter).map((card) => ({ player: p, card })));

const myTraits = (ctx, filter = () => true) =>
  ctx.me.traitPile.filter(filter).map((card) => ({ player: ctx.me, card }));

/** "Steal 1 trait from an opponent's trait pile." */
function* stealTrait(ctx, filter, prompt) {
  const cands = opponentTraits(ctx, filter);
  const hit = yield* pickTrait(ctx, cands, prompt);
  if (!hit) return null;
  moveTrait(ctx.g, hit.player, ctx.me, hit.card.uid, EFFECTS);
  ctx.say(`${ctx.me.name} stole ${hit.card.name} from ${hit.player.name}.`);
  return hit.card;
}

/** Discard N cards chosen from a player's own hand. */
function* discardFromOwnHand(ctx, player, count, { optional = false, max = null } = {}) {
  if (!player.hand.length) return [];
  const picked = yield ctx.ask.cards({
    prompt: optional
      ? `Discard up to ${max ?? count} card(s)`
      : `Discard ${count} card(s)`,
    playerId: player.id,
    from: "hand",
    count: optional ? 0 : Math.min(count, player.hand.length),
    max: max ?? count,
    optional,
    options: player.hand.map((c) => ({ uid: c.uid, name: c.name })),
  });
  const uids = (picked || []).map((x) => (typeof x === "string" ? x : x.uid));
  const out = [];
  for (const uid of uids) {
    const c = discardFromHand(ctx.g, player, uid);
    if (c) out.push(c);
  }
  return out;
}

/** "You may play 1 of them now" over a specific set of just-drawn cards. */
function* mayPlayOneOf(ctx, cards, { filter = () => true, label = "Play one now?" } = {}) {
  const eligible = cards.filter((c) => ctx.me.hand.some((h) => h.uid === c.uid) && filter(c));
  if (!eligible.length) return null;
  const choice = yield ctx.ask.cards({
    prompt: label,
    playerId: ctx.me.id,
    from: "hand",
    count: 0, max: 1, optional: true,
    options: eligible.map((c) => ({ uid: c.uid, name: c.name })),
  });
  const uid = (choice || []).map((x) => (typeof x === "string" ? x : x.uid))[0];
  if (!uid) return null;
  return yield* ctx.playNow(uid);
}

/* ================================================================== *
 * THE REGISTRY
 * ================================================================== */
const EFFECTS = {

  /* ---------------- Gene Pool ---------------- */
  "dreamer": genePool(+1),
  "fecundity": genePool(+1),
  "just": genePool(+1),
  "mitochondrion": genePool(+1),
  "saliva": genePool(+1),
  "teeth": genePool(+1),
  "warm blood": genePool(+2),
  "brute strength": genePool(-1),

  // "Choose a color. All players pass all cards of that color from their hand
  //  to the player on their left."
  "super spreader": {
    *onPlay(ctx) {
      const colour = yield ctx.ask.colour({ prompt: "Choose a colour to pass left" });
      if (!colour) return;
      const g = ctx.g;
      const moving = g.players.map((p) => {
        const keep = [], go = [];
        for (const c of p.hand) (hasColour(c, colour) ? go : keep).push(c);
        p.hand = keep;
        return go;
      });
      // "the player on their left" — next seat in play order.
      for (let i = 0; i < g.players.length; i++) {
        const left = g.players[(i + 1) % g.players.length];
        left.hand.push(...moving[i]);
      }
      ctx.say(`Super Spreader: all ${colour} cards passed left.`);
    },
  },

  /* ---------------- Actions: pure draw ---------------- */
  "introspective": { *onPlay(ctx) { ctx.draw(3); ctx.say("Introspective: drew 3."); } },
  "iridescent scales": { *onPlay(ctx) { ctx.draw(4); ctx.say("Iridescent Scales: drew 4."); } },

  "cold blood": {
    *onPlay(ctx) {
      const drawn = ctx.draw(3);
      yield* mayPlayOneOf(ctx, drawn, { label: "Cold Blood — play one of the drawn cards?" });
    },
  },

  "photosynthesis": {
    *onPlay(ctx) {
      const drawn = ctx.draw(3);
      yield* mayPlayOneOf(ctx, drawn, {
        filter: (c) => hasColour(c, "Green"),
        label: "Photosynthesis — play a drawn green trait?",
      });
    },
  },

  /* ---------------- Actions: discard ---------------- */
  "hot temper": {
    *onPlay(ctx) { yield* discardFromOwnHand(ctx, ctx.me, 2); },
  },
  "sweat": {
    *onPlay(ctx) { yield* discardFromOwnHand(ctx, ctx.me, 1); },
  },
  "wilted": {
    *onPlay(ctx) {
      yield* discardFromOwnHand(ctx, ctx.me, 0, { optional: true, max: 3 });
    },
  },

  // "Opponents discard 2 cards from their hand at random."
  "bad": {
    *onPlay(ctx) {
      for (const opp of ctx.opponents()) {
        const gone = yield* blindPick(ctx.g, ctx.me, opp, 2,
          `Bad — pick 2 of ${opp.name}'s cards to discard`);
        for (const c of gone) discardFromHand(ctx.g, opp, c.uid);
        if (gone.length) ctx.say(`Bad: ${opp.name} discarded ${gone.map((c) => c.name).join(" and ")}.`);
      }
    },
  },

  // "Choose a color. All players discard all cards of that color from their
  //  hand. (Including you!)"
  "persuasive": {
    *onPlay(ctx) {
      const colour = yield ctx.ask.colour({ prompt: "Choose a colour — everyone discards it" });
      if (!colour) return;
      for (const p of ctx.g.players) {
        for (const c of p.hand.slice()) {
          if (hasColour(c, colour)) discardFromHand(ctx.g, p, c.uid);
        }
      }
      ctx.say(`Persuasive: all ${colour} cards discarded from hands.`);
    },
  },

  // "All opponents discard 1 red trait from their trait pile."
  "irritable": {
    *onPlay(ctx) {
      for (const opp of ctx.opponents()) {
        const reds = opp.traitPile.filter((c) => hasColour(c, "Red"));
        if (!reds.length) continue;
        const hit = yield* pickTrait(
          ctx, reds.map((card) => ({ player: opp, card })),
          `${opp.name}: discard a red trait`);
        if (hit) yield* ctx.discardTrait(opp, hit.card.uid);
      }
    },
  },

  /* ---------------- Actions: steal ---------------- */
  "selfish": {
    *onPlay(ctx) {
      yield* stealTrait(ctx, (c) => hasColour(c, "Red"), "Steal a red trait");
    },
  },
  "tiny little melons": {
    *onPlay(ctx) {
      yield* stealTrait(ctx, (c) => hasColour(c, "Green"), "Steal a green trait");
    },
  },
  "directly register": {
    *onPlay(ctx) {
      yield* stealTrait(ctx, (c) => faceValue(c) === 1, "Steal a face value 1 trait");
    },
  },

  // "Steal 1 trait from an opponent's trait pile. Play its action (a)."
  "vampirism": {
    *onPlay(ctx) {
      const card = yield* stealTrait(ctx, () => true, "Vampirism — steal a trait");
      if (!card) return;
      const h = EFFECTS[norm(card.name)];
      if (h && h.onPlay && isAction(card)) {
        yield* h.onPlay({ ...ctx, card });
      }
    },
  },

  // "Steal 2 random cards from an opponent's hand. You may play 1 of them now."
  "nosy": {
    *onPlay(ctx) {
      const withCards = ctx.opponents().filter((p) => p.hand.length);
      if (!withCards.length) return;
      const pick = yield ctx.ask.player({
        prompt: "Nosy — steal from which opponent?",
        options: withCards.map((p) => ({ id: p.id, name: p.name, handSize: p.hand.length })),
      });
      const opp = withCards.find((p) => p.id === (pick && pick.id)) || withCards[0];
      const taken = yield* blindPick(ctx.g, ctx.me, opp, 2,
        `Nosy — pick 2 of ${opp.name}'s cards to steal`);
      for (const c of taken) {
        const i = opp.hand.findIndex((x) => x.uid === c.uid);
        if (i >= 0) ctx.me.hand.push(opp.hand.splice(i, 1)[0]);
      }
      ctx.say(`${ctx.me.name} stole ${taken.length} card(s) from ${opp.name}.`);
      yield* mayPlayOneOf(ctx, taken, { label: "Nosy — play a stolen card?" });
    },
  },

  // "Opponents reveal 1 card in their hand to all players. Steal 1. You may
  //  play it now."
  "clever": {
    *onPlay(ctx) {
      const revealed = [];
      // Each opponent chooses which card they reveal.
      for (const opp of ctx.opponents()) {
        if (!opp.hand.length) continue;
        const pick = yield ctx.ask.cards({
          playerId: opp.id,
          prompt: `Clever — ${ctx.me.name} is looking. Reveal 1 card from your hand to everyone`,
          from: "hand", count: 1, max: 1,
          options: opp.hand.map((c) => ({ uid: c.uid, name: c.name })),
        });
        const uid = (pick || []).map((x) => (typeof x === "string" ? x : x.uid))[0];
        const c = opp.hand.find((x) => x.uid === uid) || opp.hand[0];
        revealed.push({ player: opp, card: c });
      }
      if (!revealed.length) return;
      const choice = yield ctx.ask.trait({
        playerId: ctx.me.id,
        prompt: "Clever — steal one revealed card",
        options: revealed.map(({ player, card }) => ({
          playerId: player.id, uid: card.uid, name: card.name,
        })),
      });
      const hit = revealed.find((r) => r.card.uid === (choice && choice.uid)) || revealed[0];
      const i = hit.player.hand.findIndex((x) => x.uid === hit.card.uid);
      if (i < 0) return;
      ctx.me.hand.push(hit.player.hand.splice(i, 1)[0]);
      ctx.say(`${ctx.me.name} took ${hit.card.name} from ${hit.player.name}.`);
      yield* mayPlayOneOf(ctx, [hit.card], { label: "Clever — play it now?" });
    },
  },

  /* ---------------- Actions: give away ---------------- */
  "doting": {
    *onPlay(ctx) {
      if (!ctx.me.hand.length) return;
      const target = yield ctx.ask.player({
        prompt: "Doting — give a card to which opponent?",
        options: ctx.opponents().map((p) => ({ id: p.id, name: p.name })),
      });
      const opp = ctx.opponents().find((p) => p.id === (target && target.id)) || ctx.opponents()[0];
      const chosen = yield ctx.ask.cards({
        prompt: `Give a card to ${opp.name}`,
        playerId: ctx.me.id, from: "hand", count: 1,
        options: ctx.me.hand.map((c) => ({ uid: c.uid, name: c.name })),
      });
      const uid = (chosen || []).map((x) => (typeof x === "string" ? x : x.uid))[0];
      const i = ctx.me.hand.findIndex((c) => c.uid === uid);
      if (i >= 0) opp.hand.push(ctx.me.hand.splice(i, 1)[0]);
    },
  },

  "scutes": {
    *onPlay(ctx) {
      const mine = myTraits(ctx, (c) => c.uid !== ctx.card.uid);
      if (!mine.length) return;
      const target = yield ctx.ask.player({
        prompt: "Scutes — give a trait to which opponent?",
        options: ctx.opponents().map((p) => ({ id: p.id, name: p.name })),
      });
      const opp = ctx.opponents().find((p) => p.id === (target && target.id)) || ctx.opponents()[0];
      const hit = yield* pickTrait(ctx, mine, `Give a trait to ${opp.name}`);
      if (hit) moveTrait(ctx.g, ctx.me, opp, hit.card.uid, EFFECTS);
    },
  },

  "flight": {
    *onPlay(ctx) {
      const target = yield ctx.ask.player({
        prompt: "Flight — swap hands with whom?",
        options: ctx.opponents().map((p) => ({ id: p.id, name: p.name, handSize: p.hand.length })),
      });
      const opp = ctx.opponents().find((p) => p.id === (target && target.id)) || ctx.opponents()[0];
      [ctx.me.hand, opp.hand] = [opp.hand, ctx.me.hand];
      ctx.say(`${ctx.me.name} swapped hands with ${opp.name}.`);
    },
  },

  /* ---------------- Actions: swap traits ---------------- */
  // "Swap Poisonous with a trait from an opponent's trait pile."
  "poisonous": {
    *onPlay(ctx) {
      const cands = opponentTraits(ctx);
      const hit = yield* pickTrait(ctx, cands, "Swap Poisonous with which trait?");
      if (!hit) return;
      moveTrait(ctx.g, hit.player, ctx.me, hit.card.uid, EFFECTS);
      moveTrait(ctx.g, ctx.me, hit.player, ctx.card.uid, EFFECTS);
      ctx.say(`Poisonous swapped into ${hit.player.name}'s pile for ${hit.card.name}.`);
    },
  },

  "telekinetic": {
    *onPlay(ctx) { yield* swapDifferentOrSame(ctx, "different"); },
  },
  "tentacles": {
    *onPlay(ctx) { yield* swapDifferentOrSame(ctx, "same"); },
  },

  // "Return an opponent's trait to their hand. Then play 1 more trait."
  "costly signaling": {
    *onPlay(ctx) {
      const hit = yield* pickTrait(ctx, opponentTraits(ctx), "Return which trait to its owner's hand?");
      if (hit) {
        returnTraitToHand(ctx.g, hit.player, hit.card.uid, EFFECTS);
        ctx.say(`${hit.card.name} returned to ${hit.player.name}'s hand.`);
      }
      ctx.grantPlay(1);
    },
  },

  "pappus": {
    *onPlay(ctx) {
      const hit = yield* pickTrait(ctx, opponentTraits(ctx),
        "Pappus — return a trait to its owner's hand?", true);
      if (hit) {
        returnTraitToHand(ctx.g, hit.player, hit.card.uid, EFFECTS);
        ctx.say(`${hit.card.name} returned to ${hit.player.name}'s hand.`);
      }
    },
  },

  /* ---------------- Actions: extra plays ---------------- */
  "propagation": { *onPlay(ctx) { ctx.grantPlay(1); ctx.say("Propagation: play 1 more."); } },

  "the third eye": {
    *onPlay(ctx) {
      const next = ctx.g.ageDeck[0];
      if (next) {
        yield ctx.ask.confirm({
          prompt: `The Third Eye — the next age is ${next.name}.`,
          peek: { name: next.name, effect: next.effect },
          acknowledge: true,
        });
      }
      ctx.grantPlay(1);
    },
  },

  // "Play 1 more trait. Then move Venomous to an opponent's trait pile."
  "venomous": {
    *onPlay(ctx) {
      ctx.grantPlay(1);
      const target = yield ctx.ask.player({
        prompt: "Venomous — move it to whose pile?",
        options: ctx.opponents().map((p) => ({ id: p.id, name: p.name })),
      });
      const opp = ctx.opponents().find((p) => p.id === (target && target.id)) || ctx.opponents()[0];
      if (opp) moveTrait(ctx.g, ctx.me, opp, ctx.card.uid, EFFECTS);
    },
  },

  // "Play 1 more trait. Then discard 1 trait from your trait pile."
  "voracious": {
    *onPlay(ctx) {
      ctx.grantPlay(1);
      const mine = myTraits(ctx);
      const hit = yield* pickTrait(ctx, mine, "Voracious — discard one of your traits");
      if (hit) yield* ctx.discardTrait(ctx.me, hit.card.uid);
    },
  },

  /* ---------------- Actions: replay other actions ---------------- */
  // "Play an action (a) from your trait pile."
  "painted shell": {
    *onPlay(ctx) {
      yield* replayAction(ctx, myTraits(ctx, isAction),
        "Painted Shell: you have no other action traits in your pile to replay.");
    },
  },
  // "Play an action (a) from an opponent's trait pile."
  "inventive": {
    *onPlay(ctx) {
      yield* replayAction(ctx, opponentTraits(ctx, isAction),
        "Inventive: no opponent has an action trait in their pile.");
    },
  },

  // "Play 1 card from the discard pile. Play its action (a)."
  "selective memory": {
    *onPlay(ctx) { yield* playFromDiscard(ctx, { ignoreAction: false, topOnly: false }); },
  },
  // "Play the top card of the discard pile. Play its action (a)."
  "trunk": {
    *onPlay(ctx) { yield* playFromDiscard(ctx, { ignoreAction: false, topOnly: true }); },
  },
  // "Play 1 card from the discard pile. Ignore its action (a). When you play
  //  another green trait from your hand, you may return this to your hand."
  "self-replicating": {
    *onPlay(ctx) { yield* playFromDiscard(ctx, { ignoreAction: true, topOnly: false }); },

    // "When you play another green trait from your hand, you may return this
    //  to your hand." Watches from the trait pile rather than the hand, so it
    //  is a pile reaction, not an interrupt.
    *onTraitPlayed(ctx, ev) {
      if (!ev.actor || ev.actor.id !== ctx.me.id) return;
      if (!ev.card || ev.card.uid === ctx.card.uid) return;
      if (!hasColour(ev.card, "Green")) return;
      if (!ctx.me.traitPile.some((c) => c.uid === ctx.card.uid)) return;
      const yes = yield ctx.ask.confirm({
        playerId: ctx.me.id,
        prompt: "Self-Replicating — return it to your hand?",
      });
      if (!yes) return;
      const i = ctx.me.traitPile.findIndex((c) => c.uid === ctx.card.uid);
      if (i < 0) return;
      ctx.me.hand.push(ctx.me.traitPile.splice(i, 1)[0]);
      ctx.say(`${ctx.me.name} returned Self-Replicating to hand.`);
    },
  },

  /* ---------------- Requirements ---------------- */
  "delicious": {
    canPlay: (g, p) => p.traitPile.some((c) => hasColour(c, "Colorless")),
  },
  "heroic": {
    canPlay: (g, p) => p.traitPile.filter((c) => hasColour(c, "Green")).length >= 3,
  },
  "retractable claws": {
    canPlay: (g, p) => p.traitPile.some((c) => hasColour(c, "Red")),
    *cost(ctx) {
      const reds = myTraits(ctx, (c) => hasColour(c, "Red"));
      const hit = yield* pickTrait(ctx, reds, "Retractable Claws — discard a red trait to play");
      if (!hit) return false;
      yield* ctx.discardTrait(ctx.me, hit.card.uid);
      return true;

  "morality": {
    canPlay: (g, p) => p.traitPile.some((c) => faceValue(c) > 0),
    *cost(ctx) {

      if (!pos.length) return false;
      const target = yield ctx.ask.player({
        prompt: "Morality — give a positive trait to whom?",
        options: ctx.opponents().map((p) => ({ id: p.id, name: p.name })),

      const opp = ctx.opponents().find((p) => p.id === (target && target.id)) || ctx.opponents()[0];
      const hit = yield* pickTrait(ctx, pos, `Give a positive trait to ${opp.name}`);

    canPlay: (g, p) => g.players.every((x) => x.traitPile.length >= 3),
    *onPlay(ctx) {
      for (const p of ctx.g.players) {

        const hit = yield* pickTrait(ctx, cands, `${p.name}: discard 1 trait`);

  /* ---------------- Persistent ---------------- */
  "echolocation": {
    *onTurnStart(ctx) {
      const yes = yield ctx.ask.confirm({ prompt: "Echolocation — draw 1 card?" });
      if (yes) { ctx.draw(1); ctx.say(`${ctx.me.name} drew from Echolocation.`); }
    },

  "endurance": { /* handled inside discardTrait — it returns itself */ },

  // "When this or any trait is discarded from your trait pile, draw 1 card.

  "regenerative tissue": {
    *onTraitDiscarded(ctx, discarded) {

  /* ---------------- Play When (reactive) ----------------
   * These play out of turn through the reaction windows in core.js. Each one

   */

  "automimicry": {

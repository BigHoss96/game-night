<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<title>Yahtzee</title>
<style>
:root{--bg:#14213d;--bg2:#1c2c52;--card:#fffdf7;--ink:#1a1f2e;--mute:#7b8194;--line:#e4e0d4;--gold:#f2b632;--red:#e2463b;--green:#2e9e5b;--blue:#3a6fd8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100%}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:520px;margin:0 auto;padding:10px 10px 30px}
.logo{font-weight:900;font-size:50px;letter-spacing:-.02em;text-align:center;margin:22px 0 4px;color:#fff;text-shadow:0 4px 0 var(--red),0 8px 18px rgba(0,0,0,.4);font-style:italic}
.tag{text-align:center;color:#aab4d4;margin-bottom:18px}
.panel{background:var(--card);color:var(--ink);border-radius:16px;padding:14px;margin:10px 0}
.panel h3{margin:0 0 10px}
label.f{display:block;font-size:12px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 6px}
input[type=text]{width:100%;font:inherit;font-size:16px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.seg{display:flex;background:#efebe0;border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:10px 4px;border-radius:8px;font-weight:800;color:var(--mute)}
.seg button.on{background:var(--ink);color:#fff}
.big{display:block;width:100%;padding:15px;border-radius:14px;background:var(--red);color:#fff;font-weight:900;font-size:19px;box-shadow:0 4px 0 #a52a21;margin-top:14px}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 #a52a21}
.big:disabled{opacity:.45}
.big.go{background:var(--green);box-shadow:0 4px 0 #1d6b3c}
.ghost{display:block;width:100%;padding:12px;border-radius:12px;background:rgba(255,255,255,.08);color:#fff;font-weight:800;margin-top:8px}
.panel .ghost{background:#efebe0;color:var(--ink)}
.small{font-size:13px;color:var(--mute)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.top b{font-style:italic;font-weight:900;font-size:22px}
.top button{font-size:24px;font-weight:900;padding:0 10px}
.players{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto}
html:not(.gn-desktop) .pl{padding:4px 9px;display:flex;justify-content:space-between;align-items:center;gap:6px}
html:not(.gn-desktop) .pl .s{font-size:18px}
html:not(.gn-desktop) .sc td{height:31px}
html:not(.gn-desktop) .status{margin:5px 0 0}
.pl{flex:1;min-width:76px;background:var(--bg2);border-radius:12px;padding:7px 9px;border:2px solid transparent;transition:border-color .2s,transform .2s}
.pl.on{border-color:var(--gold);transform:translateY(-1px)}
.pl .n{font-size:12px;font-weight:800;color:#aab4d4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .s{font-size:22px;font-weight:900}
.status{min-height:22px;text-align:center;font-weight:800;color:#dfe5f7;margin:8px 0 4px}
.rollrow{display:flex;gap:8px;align-items:stretch}
.rollrow .big{margin-top:8px}
.pips{display:flex;gap:5px;justify-content:center;margin-top:6px}
.pips i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.2)}.pips i.on{background:var(--gold)}
table.sc{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);color:var(--ink);border-radius:14px;overflow:hidden;margin-top:12px;font-size:15px}
.sc th{background:var(--ink);color:#fff;font-size:12px;padding:7px 4px;font-weight:800}
.sc th.me,.sc td.me{min-width:64px}
.sc td{padding:0 6px;height:34px;border-bottom:1px solid var(--line);text-align:center}
.sc td:first-child{text-align:left;font-weight:700}
.sc td.cat small{display:block;font-size:10px;color:var(--mute);font-weight:600;line-height:1}
.sc tr.sub td{background:#f4f1e8;font-size:13px;color:var(--mute);font-weight:800}
.sc tr.tot td{background:var(--ink);color:#fff;font-weight:900;font-size:17px;height:40px}
.sc td.cell{font-weight:900}
.sc td.opt{color:#b07d06;background:#fff6dc;cursor:pointer}
.sc td.opt.zero{color:#b3ab98;background:#faf7ee}
.sc td.sel{background:var(--gold)!important;color:var(--ink)!important;box-shadow:inset 0 0 0 2px #b07d06}
.sc td.cur{background:#fbf8ef}
.sc td.flash{animation:flash .9s}
@keyframes flash{0%,60%{background:var(--gold)}100%{background:transparent}}
.banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);z-index:50;font-weight:900;font-style:italic;font-size:64px;color:#fff;text-shadow:0 5px 0 var(--red),0 10px 30px rgba(0,0,0,.6);opacity:0;pointer-events:none;white-space:nowrap}
.banner.show{animation:ban 1.9s ease forwards}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-8deg)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.12) rotate(3deg)}25%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:49;pointer-events:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 12px}
.sheet .x{float:right;font-size:26px;font-weight:900}
.rank{display:flex;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--line);font-size:18px;font-weight:800}
.rank:first-of-type{color:var(--green)}
.rules p,.rules li{line-height:1.5;font-size:15px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:800;z-index:60;border:1px solid rgba(255,255,255,.2)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="banner" id="banner"></div>
<script>
/*DICE3D*/
</script>
<script>
/*ENGINE*/
</script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const SAVE = 'yahtzee.save.v1', PREFS = 'yahtzee.prefs.v1', BEST = 'yahtzee.best.v1';
const BOT_NAMES = ['Dot', 'Lucky', 'Snake Eyes'];
const sleep = ms => new Promise(r => setTimeout(r, ms));
let prefs = Object.assign({ name: '', bots: 1, skill: 'sharp', sound: true, fast: false }, store.get(PREFS, {}));
Dice3D.sound = prefs.sound;
let G = null, tray = null, sel = null, busy = false;

function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2000); }
function save() { if (G && !G.over) store.set(SAVE, G); }

// ---------------- setup ----------------
function setup() {
  G = null; tray = null;
  const saved = store.get(SAVE, null), best = store.get(BEST, null);
  $('#app').innerHTML = `
    <div class="logo">Yahtzee!</div><div class="tag">Five dice. Three rolls. Thirteen boxes.</div>
    ${saved && !saved.over ? `<div class="panel"><h3>Game in progress</h3><div class="small">Round ${saved.round} of 13 · ${saved.players.map(p => esc(p.name) + ' ' + YZ.totals(p.card).total).join(' · ')}</div><button class="big go" id="resume">Continue</button></div>` : ''}
    <div class="panel">
      <h3>New game</h3>
      <label class="f">Your name</label><input type="text" id="nm" placeholder="You" maxlength="14" value="${esc(prefs.name)}">
      <label class="f">Bots</label><div class="seg" id="bots"><button data-v="0">Solo</button><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button></div>
      <label class="f">Bot skill</label><div class="seg" id="skill"><button data-v="casual">Casual</button><button data-v="sharp">Sharp</button></div>
      <label class="f">Sound</label><div class="seg" id="sound"><button data-v="true">On</button><button data-v="false">Off</button></div>
      <button class="big" id="go">Play</button>
    </div>
    ${best ? `<p class="small" style="text-align:center;color:#aab4d4">Your best: <b style="color:#fff">${best}</b></p>` : ''}
    <button class="ghost" id="rules">How to play</button>
    ${window.GNReport ? '<button class="ghost" onclick="GNReport.open()">⚑ Report a bug</button>' : ''}`;
  const seg = (id, key) => { const el = $('#' + id); const sync = () => el.querySelectorAll('button').forEach(b => b.classList.toggle('on', String(prefs[key]) === b.dataset.v)); el.onclick = e => { const b = e.target.closest('button'); if (!b) return; const v = b.dataset.v; prefs[key] = v === 'true' ? true : v === 'false' ? false : isNaN(+v) ? v : +v; sync(); store.set(PREFS, prefs); Dice3D.sound = prefs.sound; }; sync(); };
  seg('bots', 'bots'); seg('skill', 'skill'); seg('sound', 'sound');
  $('#nm').oninput = e => { prefs.name = e.target.value.trim(); store.set(PREFS, prefs); };
  $('#go').onclick = () => {
    const ps = [{ name: prefs.name || 'You' }];
    for (let i = 0; i < prefs.bots; i++) ps.push({ name: BOT_NAMES[i], bot: true, skill: prefs.skill });
    G = YZ.newGame(ps); save(); startGame();
  };
  if ($('#resume')) $('#resume').onclick = () => { G = saved; startGame(); };
  $('#rules').onclick = rules;
}

// ---------------- game screen ----------------
function startGame() {
  $('#app').innerHTML = `<div class="top"><b>Yahtzee!</b><button id="menu" aria-label="Menu">⋯</button></div>
    <div class="players" id="players"></div>
    <div id="tray"></div>
    <div class="status" id="status"></div>
    <div class="rollrow"><button class="big" id="rollBtn">Roll</button></div>
    <div class="pips" id="pips"></div>
    <div id="card"></div>`;
  if (cur().bot) { G.rolls = 0; G.held = [false, false, false, false, false]; }   // a bot resumes its turn from the start
  const desk = document.documentElement.classList.contains('gn-desktop');
  tray = Dice3D.create($('#tray'), desk ? { count: 5, railLabel: 'held' } : { count: 5, railLabel: 'held', rows: 2.5, ratio: 0.36, max: 60 });
  tray.onTap = toggleHold;
  tray.lineup(G.dice, G.held.map(h => h ? 'held' : 'free'));
  if (G.rolls === 0) tray.setFrozen(true);
  $('#menu').onclick = menu;
  $('#rollBtn').onclick = onRollBtn;
  render();
  if (cur().bot) botTurn();
}
const cur = () => G.players[G.turn];
const humanTurn = () => !cur().bot && !G.over;

function render() {
  if (!G) return;
  const p = cur();
  $('#players').innerHTML = G.players.map((q, i) => `<div class="pl ${i === G.turn && !G.over ? 'on' : ''}"><div class="n">${esc(q.name)}</div><div class="s">${YZ.totals(q.card).total}</div></div>`).join('');
  $('#pips').innerHTML = [0, 1, 2].map(i => `<i class="${i < 3 - G.rolls ? 'on' : ''}"></i>`).join('');
  const btn = $('#rollBtn');
  if (G.over) { btn.textContent = 'Game over'; btn.disabled = true; }
  else if (p.bot) { btn.textContent = `${p.name} is rolling…`; btn.disabled = true; btn.className = 'big'; }
  else if (sel) { const s = YZ.score(p.card, sel, G.dice) + YZ.yahtzeeBonus(p.card, G.dice); btn.textContent = `Score ${s} in ${YZ.NAMES[sel]}`; btn.disabled = busy; btn.className = 'big go'; }
  else { btn.textContent = G.rolls === 0 ? 'Roll' : G.rolls < 3 ? `Roll again (${3 - G.rolls} left)` : 'Pick a box'; btn.disabled = busy || G.rolls >= 3; btn.className = 'big'; }
  let st = '';
  if (!G.over) {
    if (p.bot) st = `${esc(p.name)}'s turn`;
    else if (G.rolls === 0) st = G.players.length > 1 ? `Your turn — round ${G.round} of 13` : `Round ${G.round} of 13`;
    else if (G.rolls < 3 && !sel) st = 'Tap dice to hold them, or pick a box';
    else if (!sel) st = 'Pick a box to score';
  }
  $('#status').innerHTML = st;
  renderCard();
}
function renderCard() {
  const p = cur(), me = G.turn;
  const showOpts = humanTurn() && G.rolls > 0 && !busy;
  const legal = showOpts ? YZ.legal(p.card, G.dice) : [];
  const head = `<tr><th style="text-align:left;padding-left:8px">Box</th>${G.players.map((q, i) => `<th class="${i === me ? 'me' : ''}">${esc(q.name)}</th>`).join('')}</tr>`;
  const row = k => `<tr><td class="cat">${YZ.NAMES[k]}${HINT[k] ? `<small>${HINT[k]}</small>` : ''}</td>${G.players.map((q, i) => {
    const v = q.card[k];
    if (v != null) return `<td class="cell ${i === me ? 'cur' : ''}" data-k="${k}" data-p="${i}">${v}</td>`;
    if (i === me && legal.indexOf(k) >= 0) { const s = YZ.score(q.card, k, G.dice); return `<td class="opt ${s ? '' : 'zero'} ${sel === k ? 'sel' : ''}" data-opt="${k}">${s}</td>`; }
    return `<td class="${i === me ? 'cur' : ''}" data-k="${k}" data-p="${i}"></td>`;
  }).join('')}</tr>`;
  const sub = (label, f) => `<tr class="sub"><td>${label}</td>${G.players.map(q => `<td>${f(YZ.totals(q.card))}</td>`).join('')}</tr>`;
  $('#card').innerHTML = `<table class="sc">${head}${YZ.UPPER.map(row).join('')}
    ${sub('Upper total', t => `${t.up}<span style="opacity:.6">/63</span>`)}${sub('Bonus (63+)', t => t.bonus || '—')}
    ${YZ.CATS.slice(6).map(row).join('')}${sub('Yahtzee bonus', t => t.ybonus || '—')}
    <tr class="tot"><td>Total</td>${G.players.map(q => `<td>${YZ.totals(q.card).total}</td>`).join('')}</tr></table>`;
  document.querySelectorAll('[data-opt]').forEach(td => td.onclick = () => {
    if (busy) return;
    const k = td.dataset.opt;
    if (sel === k) { commit(k); return; }   // second tap scores it
    sel = k; render();
  });
}
const HINT = { three: 'sum of dice', four: 'sum of dice', full: '25', small: '30', large: '40', yahtzee: '50', chance: 'sum of dice' };

function toggleHold(i) {
  if (!humanTurn() || busy || G.rolls === 0 || G.rolls >= 3) { if (G.rolls >= 3 && humanTurn()) tray.nope(i); return; }
  G.held[i] = !G.held[i];
  tray.setState(i, G.held[i] ? 'held' : 'free');
  save();
}
async function onRollBtn() {
  if (busy || !humanTurn()) return;
  if (sel) { commit(sel); return; }
  if (G.rolls >= 3) return;
  if (G.held.every(Boolean)) { toast('Release a die to roll'); return; }
  await doRoll();
  save(); render();
}
async function doRoll(fast) {
  busy = true; sel = null; render();
  if (G.rolls === 0) G.held = [false, false, false, false, false];
  const idx = YZ.roll(G);
  tray.setFrozen(false);
  await tray.roll(idx, idx.map(i => G.dice[i]), { fast });
  busy = false;
  if (YZ.isYahtzee(G.dice)) celebrate(cur().card.yahtzee === 50 ? 'YAHTZEE! +100' : 'YAHTZEE!');
}
function commit(k) {
  const p = cur();
  const before = YZ.totals(p.card).total;
  const pts = YZ.scoreTurn(G, k);
  sel = null;
  const pi = G.players.indexOf(p);
  afterScore(pi, k, YZ.totals(p.card).total - before);
}
function afterScore(pi, k, gained) {
  tray.lineup(null, ['free', 'free', 'free', 'free', 'free']); tray.setFrozen(true);
  G.held = [false, false, false, false, false];
  save(); render();
  const td = document.querySelector(`[data-k="${k}"][data-p="${pi}"]`); if (td) td.classList.add('flash');
  if (G.over) { finish(); return; }
  if (cur().bot) botTurn();
}

async function botTurn() {
  if (busy) return;
  const p = cur();
  busy = true; render();
  await sleep(500);
  busy = false; await doRoll(); busy = true;
  render();
  while (G.rolls < 3) {
    await sleep(650);
    const h = YZ.bestHold(p.card, G.dice, 3 - G.rolls, p.skill);
    if (h.stop) break;
    // show the hold change first
    for (let i = 0; i < 5; i++) if (G.held[i] !== h.held[i]) { G.held[i] = h.held[i]; tray.setState(i, h.held[i] ? 'held' : 'free'); await sleep(140); }
    await sleep(350);
    busy = false; await doRoll(); busy = true; render();
  }
  await sleep(700);
  const k = YZ.botChoose(p.card, G.dice, p.skill);
  const before = YZ.totals(p.card).total;
  YZ.scoreTurn(G, k);
  busy = false;
  $('#status').textContent = `${p.name} scores ${YZ.totals(p.card).total - before} in ${YZ.NAMES[k]}`;
  const pi = G.players.indexOf(p);
  await sleep(50);
  afterScore(pi, k);
  if (!cur().bot && !G.over) $('#status').textContent = `${p.name} scored ${p.card[k]} in ${YZ.NAMES[k]}. Your turn!`;
}

function celebrate(text) {
  const b = $('#banner'); b.textContent = text; b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
  const colors = ['#f2b632', '#e2463b', '#2e9e5b', '#3a6fd8', '#ffffff'];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement('div'); c.className = 'confetti'; c.style.left = Math.random() * 100 + 'vw'; c.style.background = colors[i % 5];
    document.body.appendChild(c);
    const a = c.animate([{ transform: `translateY(0) rotate(0)` }, { transform: `translate(${(Math.random() - .5) * 160}px, ${innerHeight + 40}px) rotate(${Math.random() * 900}deg)` }], { duration: 1600 + Math.random() * 1400, delay: Math.random() * 300, easing: 'cubic-bezier(.3,.4,.6,1)' });
    a.onfinish = () => c.remove();
  }
  if (Dice3D.sound) [0, 90, 180].forEach((t, i) => setTimeout(() => Dice3D.clack(1 - i * .2), t));
}

function finish() {
  store.del(SAVE);
  const ranks = G.players.map(p => ({ name: p.name, bot: p.bot, t: YZ.totals(p.card).total })).sort((a, b) => b.t - a.t);
  const me = ranks.find(r => !r.bot);
  const best = store.get(BEST, 0);
  const newBest = me && me.t > best;
  if (newBest) store.set(BEST, me.t);
  const won = ranks[0] === me && (ranks.length === 1 || ranks[1].t < me.t);
  if (won && ranks.length > 1) celebrate('You win!');
  setTimeout(() => sheet(`<h2>Final score</h2>${ranks.map((r, i) => `<div class="rank"><span>${i + 1}. ${esc(r.name)}</span><span>${r.t}</span></div>`).join('')}
    ${newBest ? `<p style="font-weight:800;color:var(--green)">New personal best!</p>` : best ? `<p class="small">Your best: ${Math.max(best, me ? me.t : 0)}</p>` : ''}
    <button class="big" id="again">Play again</button><button class="ghost" id="home">Main menu</button>`, s => {
    s.querySelector('#again').onclick = () => { s.remove(); const ps = G.players.map(p => ({ name: p.name, bot: p.bot, skill: p.skill })); G = YZ.newGame(ps); save(); startGame(); };
    s.querySelector('#home').onclick = () => { s.remove(); setup(); };
  }), won ? 1500 : 500);
}

// ---------------- sheets ----------------
function sheet(html, onOpen) {
  const s = document.createElement('div'); s.className = 'scrim';
  s.innerHTML = `<div class="sheet"><button class="x" aria-label="Close">×</button>${html}</div>`;
  s.onclick = e => { if (e.target === s || e.target.classList.contains('x')) s.remove(); };
  document.body.appendChild(s); onOpen && onOpen(s); return s;
}
function menu() {
  sheet(`<h2>Menu</h2>
    <button class="ghost" id="mSound">Sound: ${Dice3D.sound ? 'on' : 'off'}</button>
    <button class="ghost" id="mRules">How to play</button>
    ${window.GNReport ? '<button class="ghost" id="mBug">⚑ Report a bug</button>' : ''}
    <button class="ghost" id="mQuit">Save &amp; quit to menu</button>`, s => {
    s.querySelector('#mSound').onclick = () => { prefs.sound = !Dice3D.sound; Dice3D.sound = prefs.sound; store.set(PREFS, prefs); s.querySelector('#mSound').textContent = 'Sound: ' + (prefs.sound ? 'on' : 'off'); };
    s.querySelector('#mRules').onclick = () => { s.remove(); rules(); };
    if (s.querySelector('#mBug')) s.querySelector('#mBug').onclick = () => { s.remove(); GNReport.open(); };
    s.querySelector('#mQuit').onclick = () => { s.remove(); if (!busy) { save(); setup(); } else toast('Wait for the dice to land'); };
  });
}
function rules() {
  sheet(`<h2>How to play</h2><div class="rules">
    <p>Each turn you get up to <b>three rolls</b>. After the first and second roll, tap dice to <b>hold</b> them (they slide to the rail) and roll the rest. Then pick one box on your scorecard. Every box is used once, so the game is 13 turns.</p>
    <ul>
      <li><b>Ones–Sixes:</b> total of that number. Reach <b>63</b> in the upper section for a <b>35-point bonus</b>.</li>
      <li><b>3 / 4 of a Kind:</b> sum of all dice. <b>Chance:</b> sum of anything.</li>

      <li>If you take a box that doesn't fit, it scores 0.</li>
      <li><b>Extra Yahtzees:</b> if your Yahtzee box has 50, each extra Yahtzee earns +100. It must go in the matching upper box if that's open; otherwise it's a joker and scores full points in Full House or a straight.</li>
    </ul>
    <p>Tap a box to see what it scores, then tap it again (or the green button) to lock it in.</p></div>`);

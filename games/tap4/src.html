<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b110b">
<meta name="mobile-web-app-capable" content="yes">
<title>Tap 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>


:root{
  --bg:#15122a; --bg2:#1d1838; --surface:#241e45; --line:rgba(255,255,255,.08);
  --text:#f6f0e6; --dim:#a79fc4; --coral:#ff5d5d; --mint:#3ddc97; --ice:#7fd3ff; --gold:#ffc94d; --pink:#ff7ac6;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Bricolage Grotesque",system-ui,sans-serif;overscroll-behavior:none}
body{background:radial-gradient(120% 60% at 50% -10%,#3a2a78 0%,var(--bg) 60%) fixed;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
.hidden{display:none!important}
.screen{height:100dvh;display:flex;flex-direction:column;padding-top:var(--safe-t)}

/* ---------- setup ---------- */
#setup{overflow-y:auto;padding:calc(var(--safe-t) + 28px) 18px calc(var(--safe-b) + 28px);gap:18px;max-width:520px;margin:0 auto;width:100%}
.logo{font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:.9;display:flex;align-items:center;gap:10px}
.logo .seven{display:inline-grid;place-items:center;width:62px;height:84px;border-radius:12px;font-size:58px;
  background:linear-gradient(160deg,#ff8a6b,#ff3d6e);box-shadow:0 8px 24px rgba(255,61,110,.35),inset 0 0 0 2px rgba(255,255,255,.35);transform:rotate(8deg)}
.sub{color:var(--dim);font-size:16px;line-height:1.35;margin-top:-4px}
.h{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.seats{display:flex;flex-direction:column;gap:8px}
.seat{display:grid;grid-template-columns:1fr auto 36px;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
.seat input{background:transparent;border:0;outline:0;font-size:18px;font-weight:600;padding:6px 6px;min-width:0}
.seat .x{width:36px;height:36px;border-radius:10px;color:var(--dim);font-size:20px}
.seat .lvl{grid-column:1 / -1}
.seg{display:flex;background:rgba(0,0,0,.25);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--dim);white-space:nowrap}
.seg button.on{background:#fff;color:#1a1533}
.addseat{border:1.5px dashed rgba(255,255,255,.18);border-radius:14px;padding:12px;color:var(--dim);font-weight:600}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt label{font-weight:600}
.opt small{display:block;color:var(--dim);font-weight:500;font-size:13px}
.toggle{width:52px;height:32px;border-radius:16px;background:rgba(255,255,255,.15);position:relative;transition:.2s;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on{background:var(--mint)}.toggle.on::after{left:23px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 14px}
.big{width:100%;padding:18px;border-radius:16px;font-size:20px;font-weight:800;background:linear-gradient(180deg,#ff6b6b,#f0435a);box-shadow:0 10px 30px rgba(240,67,90,.35)}
.big:active{transform:scale(.98)}
.ghost{width:100%;padding:14px;border-radius:14px;font-weight:700;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.resume{background:linear-gradient(180deg,#3ddc97,#20b57a);box-shadow:0 10px 30px rgba(61,220,151,.25);color:#06261a}
.note{color:var(--dim);font-size:13px;text-align:center}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;background:rgba(8,6,20,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20;backdrop-filter:blur(3px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet-card{width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;background:var(--bg2);border-radius:24px 24px 0 0;padding:20px 18px calc(var(--safe-b) + 20px);border-top:1px solid var(--line);animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40%)}}
.sheet h2{font-size:26px;font-weight:800;letter-spacing:-.02em}
.sheet p.lead{color:var(--dim);margin:4px 0 14px;line-height:1.35}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px}
.pick:active{background:#2f2758}
.pick .pn{font-weight:700;font-size:17px}
.pick .meta{color:var(--dim);font-size:13px;font-weight:600}
.pick .r{margin-left:auto;font-weight:800;font-size:20px}
.pick.self{border-color:rgba(255,201,77,.4)}
.rows{display:flex;flex-direction:column;gap:6px;margin:6px 0 16px}
.row{display:grid;grid-template-columns:1fr auto 54px;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface)}
.row .pn{font-weight:700}
.row .bar{grid-column:1 / -1;height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.row .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--coral))}
.row .res{font-weight:700;font-size:14px}
.res.bust{color:var(--coral)}.res.f7{color:var(--gold)}.res.ok{color:var(--mint)}
.row .tot{font-weight:800;font-size:20px;text-align:right}
.row.lead{outline:2px solid var(--gold)}
.row .left{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:3px;margin-top:-2px}
.card.was-down{box-shadow:0 0 0 1.5px #9fc0ff,0 2px 5px rgba(0,0,0,.4);filter:saturate(.75)}
.rules h3{font-size:16px;margin:14px 0 4px}
.rules p,.rules li{color:#d9d2ec;line-height:1.45;font-size:15px}
.rules ul{padding-left:18px}
.rules .ex{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.btnrow{display:flex;gap:8px;margin-top:6px}

/* ---------- toasts & fx ---------- */
#toasts{position:fixed;left:0;right:0;bottom:calc(var(--safe-b) + 196px);display:flex;flex-direction:column-reverse;align-items:center;gap:6px;pointer-events:none;z-index:30}
.toast{background:#2c2557;border:1px solid rgba(255,255,255,.12);padding:10px 16px;border-radius:14px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:tin .25s ease-out;max-width:90%;text-align:center}
.toast.good{background:#14432f;border-color:#2c8a5f}
.toast.bad{background:#4a1a24;border-color:#a33a4c}
.toast.big{font-size:26px;background:linear-gradient(160deg,#ffe08a,#e7a22e);color:#2a1d00;border:0;padding:14px 24px}
.toast.out{opacity:0;transform:translateY(-8px);transition:.3s}
@keyframes tin{from{opacity:0;transform:translateY(10px) scale(.95)}}
.spark{position:fixed;width:10px;height:14px;border-radius:2px;z-index:40;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r));opacity:.8}}
@media (min-width:700px){#lanes{max-width:640px;width:100%;margin:0 auto}#dock .in{max-width:640px;margin:0 auto}}

/* ---------- table ---------- */
#table{background:radial-gradient(140% 80% at 50% 0%,#3b2618,#1b110b 70%);padding-left:8px;padding-right:8px}
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 6px 6px}
.top .rd{font-weight:800;font-size:18px;color:#f3e3c8}
.top .rd small{font-weight:600;color:#b89a77;font-size:14px;margin-left:6px}
.iconbtn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.08);display:grid;place-items:center;color:#f3e3c8}

.felt{position:relative;flex:1;min-height:0;border-radius:30px;overflow:hidden;
  background:
    radial-gradient(ellipse 70% 55% at 50% 45%,rgba(255,255,255,.07),transparent 70%),
    repeating-radial-gradient(circle at 30% 30%,rgba(0,0,0,.025) 0 1px,transparent 1px 3px),
    radial-gradient(ellipse at 50% 45%,#2b8a58 0%,#1c6c43 55%,#114a2d 100%);
  box-shadow:inset 0 0 0 5px #5e3519,inset 0 0 0 8px #8b5a2b,inset 0 0 0 9px rgba(0,0,0,.4),inset 0 0 50px rgba(0,0,0,.55),0 10px 30px rgba(0,0,0,.5)}
.ring{position:absolute;left:0;right:0;top:0;bottom:var(--tray-h,132px)}

.pod{position:absolute;width:118px;transform:translate(-50%,-50%);padding:6px 7px 6px;border-radius:14px;
  background:rgba(0,0,0,.24);border:1.5px solid rgba(255,255,255,.08);transition:border-color .25s,box-shadow .25s,opacity .3s}
.pod .ph,.tray .ph{display:flex;align-items:center;gap:5px}
.pod .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.pod .tot{font-weight:800;font-size:14px;color:#ffe6a6}
.dl{font-size:9px;font-weight:800;background:var(--gold);color:#2a1d00;border-radius:5px;padding:1px 4px;flex:none}
.pod .nums{display:flex;height:34px;margin:4px 0 3px;align-items:center}
.pod .ex{display:flex;gap:3px;flex-wrap:wrap;min-height:16px}
.pod .pf{display:flex;align-items:center;gap:4px;margin-top:3px;font-size:11px;font-weight:700;color:rgba(255,255,255,.75);min-height:16px}
.pod .pf .rs{margin-left:auto}
.cur{border-color:var(--gold)!important;box-shadow:0 0 0 3px rgba(255,201,77,.25),0 0 22px rgba(255,201,77,.35)}
.pod.busted,.tray.busted .cardsrow{opacity:.5}
.badge{font-size:10px;font-weight:800;padding:2px 5px;border-radius:5px;text-transform:uppercase;letter-spacing:.04em}
.badge:empty{display:none}
.badge.stayed{background:rgba(61,220,151,.22);color:#7ff0bd}
.badge.frozen{background:rgba(127,211,255,.25);color:#bfe9ff}
.badge.busted{background:rgba(255,93,93,.3);color:#ffb1b1}
.badge.flip7{background:var(--gold);color:#2a1d00}
.uniq{font-size:11px;font-weight:700;color:rgba(255,255,255,.6)}
.uniq b{color:#fff}

.center{position:absolute;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:150px;pointer-events:none}
.piles{display:flex;gap:12px}
.pile{position:relative;width:52px;height:72px}
.pile .card{position:absolute;inset:0;width:52px;height:72px;border-radius:8px}
.pile .card:nth-child(1){transform:translate(3px,3px) rotate(3deg)}
.pile .card:nth-child(2){transform:translate(1.5px,1.5px) rotate(1.5deg)}
.pile .cnt{position:absolute;left:0;right:0;bottom:-18px;text-align:center;font-size:11px;font-weight:700;color:rgba(255,255,255,.7)}
.pile.discard .slot{position:absolute;inset:0;border-radius:8px;border:1.5px dashed rgba(255,255,255,.25)}
.pile.discard .card{transform:rotate(-6deg)}
.caption{margin-top:14px;text-align:center;font-weight:700;font-size:14px;line-height:1.25;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);min-height:36px;width:190px}
.caption small{display:block;font-size:12px;color:rgba(255,255,255,.7)}

.tray{position:absolute;left:10px;right:10px;bottom:10px;border-radius:18px;padding:8px 10px 10px;background:rgba(0,0,0,.28);border:1.5px solid rgba(255,255,255,.1);transition:border-color .25s,box-shadow .25s}
.tray .nm{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tray .tot{margin-left:auto;font-weight:800;font-size:16px;color:#ffe6a6}
.tray .tot small{font-size:11px;color:rgba(255,255,255,.6);margin-left:2px}
.tray .rs{font-weight:800;font-size:13px;color:rgba(255,255,255,.85);background:rgba(255,255,255,.1);border-radius:6px;padding:2px 6px}
.tray .rs:empty{display:none}
.cardsrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;min-height:62px;align-items:center}
.cardsrow .nums,.cardsrow .ex{display:flex;flex-wrap:wrap;gap:4px}
.cardsrow .ex:not(:empty){padding-left:6px;margin-left:2px;border-left:1px solid rgba(255,255,255,.18)}

/* ---------- cards (white card stock, framed face, corner indices) ---------- */
.card{position:relative;flex:none;border-radius:7px;display:grid;place-items:center;--ink:hsl(var(--h) 72% 40%);--tint:hsl(var(--h) 85% 55%);color:var(--ink);
  background:
    radial-gradient(ellipse 62% 48% at 50% 50%,hsl(var(--h) 90% 60% / .16),transparent 70%),
    linear-gradient(165deg,#fffef9 0%,#f7f1e3 60%,#ede4cf 100%);
  box-shadow:0 0 0 .5px rgba(0,0,0,.25),0 1px 0 rgba(0,0,0,.12),0 3px 7px rgba(0,0,0,.38)}
.card::before{content:"";position:absolute;inset:var(--fr,3px);border-radius:calc(var(--rad,7px) - 2px);border:var(--frw,1.5px) solid hsl(var(--h) 65% 50% / .55);pointer-events:none}
.card b{font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.8)}
.card .ix{position:absolute;font-weight:800;line-height:1;color:var(--ink);letter-spacing:-.03em}
.card .ix.tl{top:var(--ixo,4px);left:var(--ixo,4px)}
.card .ix.br{bottom:var(--ixo,4px);right:var(--ixo,4px);transform:rotate(180deg)}
.card.xs{width:24px;height:34px;--rad:4px;border-radius:4px;--fr:2px;--frw:1px}.card.xs b{font-size:15px}.card.xs .ix{display:none}
.card.sm{width:34px;height:48px;--rad:5px;border-radius:5px;--fr:2.5px;--frw:1px;--ixo:3px}.card.sm b{font-size:19px}.card.sm .ix{font-size:7px}
.card.tr{width:44px;height:62px;--rad:6px;border-radius:6px;--fr:3px;--frw:1.2px;--ixo:4px}.card.tr b{font-size:25px}.card.tr .ix{font-size:9px}.card.mod.tr b{font-size:16px}.card.act.tr i{font-size:5.5px}
.card.fl{width:60px;height:84px;--rad:8px;border-radius:8px;--ixo:5px}.card.fl b{font-size:34px}.card.fl .ix{font-size:11px}
.card.md{width:70px;height:98px;--rad:10px;border-radius:10px;--fr:4px;--frw:2px;--ixo:6px}.card.md b{font-size:42px}.card.md .ix{font-size:13px}
.card.num.z{--h:250;--ink:#6b6580}
.card.mod{--h:40;--ink:#b4780b}
.card.mod b{font-size:.78em}
.card.mod.sm b{font-size:13px}.card.mod.fl b{font-size:24px}.card.mod.md b{font-size:28px}.card.mod.xs b{font-size:10px}
.card.act{--ink:hsl(var(--h) 70% 40%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.card.act svg{width:56%;height:auto;color:var(--ink);filter:drop-shadow(0 1px 0 rgba(255,255,255,.7))}
.card.act i{font-style:normal;font-weight:800;font-size:5px;text-transform:uppercase;line-height:1.05;text-align:center;color:var(--ink);padding:0 3px}
.card.act.xs i{display:none}.card.act.fl i{font-size:7.5px}.card.act.md i{font-size:9px}
.card.act.freeze{--h:203}.card.act.flip3{--h:322}.card.act.second{--h:150}
.card.dupe{box-shadow:0 0 0 2.5px var(--coral),0 3px 8px rgba(0,0,0,.45)}
.card.back{background:#f6efe0;box-shadow:0 0 0 .5px rgba(0,0,0,.3),0 3px 7px rgba(0,0,0,.45)}
.card.back::before{inset:3px;border:0;border-radius:5px;background:
  repeating-linear-gradient(45deg,transparent 0 3px,rgba(255,255,255,.14) 3px 4px),
  repeating-linear-gradient(-45deg,transparent 0 3px,rgba(255,255,255,.14) 3px 4px),
  radial-gradient(circle at 50% 50%,#b23345,#7b1a28)}
.card.back::after{content:"FLIP\A SEVEN";white-space:pre;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-12deg);
  width:78%;padding:5px 0 4px;border-radius:50%;text-align:center;font-weight:800;font-size:8.5px;line-height:1.05;letter-spacing:.12em;
  color:#7b1a28;background:radial-gradient(ellipse at 50% 40%,#fff8ea,#efdcbc);box-shadow:0 0 0 1.5px #f6efe0,0 0 0 2.5px #7b1a28,0 2px 4px rgba(0,0,0,.35)}
.fresh{animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.pill{height:16px;min-width:20px;padding:0 4px;border-radius:5px;display:inline-grid;place-items:center;font-size:10px;font-weight:800;line-height:1}
.pill.mod{background:linear-gradient(160deg,#ffe08a,#e7a22e);color:#3a2500}
.pill.act{color:#fff;padding:0 3px}.pill.act svg{width:11px;height:11px}
.pill.freeze{background:#4aa8e6}.pill.flip3{background:#c2389b}.pill.second{background:#21a86c}
.floater{position:fixed;z-index:15;pointer-events:none;transform-origin:50% 50%;will-change:transform}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:translate(calc(-50% - 7px),-50%)}40%{transform:translate(calc(-50% + 6px),-50%)}60%{transform:translate(calc(-50% - 4px),-50%)}80%{transform:translate(calc(-50% + 2px),-50%)}}
.tray.shake{animation:shake2 .5s}
@keyframes shake2{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}

/* ---------- controls ---------- */
#controls{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;padding:10px 2px calc(var(--safe-b) + 10px);min-height:84px}
#controls .wait{grid-column:1 / -1;display:grid;place-items:center;color:#c7ad8c;font-weight:600;border-radius:16px;background:rgba(255,255,255,.04);min-height:62px}
.cbtn{border-radius:16px;font-size:22px;font-weight:800;letter-spacing:.02em;min-height:62px}
.cbtn:active{transform:scale(.97)}
.cbtn.stay{background:rgba(61,220,151,.15);color:var(--mint);border:1.5px solid rgba(61,220,151,.45)}
.cbtn.stay small,.cbtn.hit small{display:block;font-size:12px;font-weight:700;opacity:.85}
.cbtn.hit{background:linear-gradient(180deg,#ff6b6b,#f0435a);box-shadow:0 8px 24px rgba(240,67,90,.35)}
.odds{grid-column:1 / -1;font-size:13px;color:#c7ad8c;font-weight:600;text-align:center;margin-top:-4px}
.odds b{color:#fff}
#toasts{top:34%;bottom:auto}


/* ---------- Tap 4 specifics ---------- */
.logo .seven{background:linear-gradient(160deg,#6fb8ff,#3c5bff);box-shadow:0 8px 24px rgba(60,91,255,.35),inset 0 0 0 2px rgba(255,255,255,.35)}
.card.back::before{background:
  repeating-linear-gradient(45deg,transparent 0 3px,rgba(255,255,255,.14) 3px 4px),
  repeating-linear-gradient(-45deg,transparent 0 3px,rgba(255,255,255,.14) 3px 4px),
  radial-gradient(circle at 50% 50%,#2f5fbf,#16306e)}
.card.back::after{content:"TAP\A 4";color:#16306e;box-shadow:0 0 0 1.5px #f6efe0,0 0 0 2.5px #16306e,0 2px 4px rgba(0,0,0,.35);font-size:9px;letter-spacing:.14em}
.card.xs.back::after,.mini.back::after{display:none}
.card.tin{--h:150}.card.tout{--h:2}
.card.tin,.card.tout{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.card.tin svg,.card.tout svg{width:52%;height:auto;color:var(--ink)}
.card.tin i,.card.tout i{font-style:normal;font-weight:800;font-size:6px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);line-height:1}
.card.tr.tin i,.card.tr.tout i{font-size:7px}.card.fl.tin i,.card.fl.tout i{font-size:9px}.card.md.tin i,.card.md.tout i{font-size:10px}
.card.xs.tin i,.card.xs.tout i{display:none}
.card .pts{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:6px;font-weight:800;color:var(--ink);opacity:.7}
.card.xs .pts,.card.sm .pts{display:none}

.pod{width:124px}
.pod .prow{display:flex;gap:3px;margin:5px 0 4px}
.slot0{width:24px;height:34px;border-radius:4px;border:1px dashed rgba(255,255,255,.22);flex:none}
.pod .hc{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:rgba(255,255,255,.8)}
.mini{width:14px;height:20px;border-radius:3px}
.pod .hc .n{font-size:13px;color:#fff}
.outb{font-size:9px;font-weight:800;padding:2px 5px;border-radius:5px;background:#e04848;color:#fff;text-transform:uppercase;letter-spacing:.04em;margin-left:auto}
.outb:empty{display:none}
.depth{position:absolute;right:-3px;top:-5px;background:#111;color:#fff;font-size:8px;font-weight:800;border-radius:6px;padding:0 3px;line-height:12px;z-index:2}
.pslot{position:relative}

.stackwrap{position:relative;width:96px;height:84px}
.stackwrap .card{position:absolute;top:0}
.stackwrap .empty{position:absolute;left:18px;top:0;width:60px;height:84px;border-radius:9px;border:1.5px dashed rgba(255,255,255,.28);display:grid;place-items:center;font-size:11px;font-weight:700;color:rgba(255,255,255,.5);text-align:center}
.center{width:150px;gap:4px}
.stacklbl2{text-align:center;font-size:11px;font-weight:600;color:rgba(255,255,255,.75);line-height:1.3;min-height:28px}
.stacklbl2 b{font-size:14px;color:#fff}
.caption{width:160px;margin-top:4px}
.cbtn.pku small{display:block;font-size:12px;font-weight:700;opacity:.8}
.cbtn.pku{line-height:1.1}
.piles{align-items:flex-end;gap:16px}
.outpile{position:relative;width:38px;height:54px}
.outpile .card{position:absolute;inset:0;width:38px;height:54px}
.outpile .lbl,.stacklbl{position:absolute;left:-20px;right:-20px;bottom:-17px;text-align:center;font-size:11px;font-weight:700;color:rgba(255,255,255,.75)}
.stacklbl{bottom:-19px;font-size:12px;color:#fff}

.tray{padding:8px 10px 10px}
.tray .sub2{font-size:12px;font-weight:700;color:rgba(255,255,255,.65)}
.trow{display:flex;gap:6px;margin-top:7px;align-items:flex-end}
.trow.piles2{gap:8px}
.trow .lab{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5);writing-mode:vertical-rl;transform:rotate(180deg);margin-right:-2px;align-self:center}
.hand{display:flex;flex-wrap:wrap;gap:5px;flex:1}
.hgrp{position:relative;transition:transform .15s}
.hgrp .cnt{position:absolute;right:-5px;top:-6px;background:#111;color:#fff;font-size:10px;font-weight:800;border-radius:8px;padding:0 5px;line-height:16px;z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.hgrp .cnt.sel{background:var(--gold);color:#2a1d00}
.pick-ok{cursor:pointer}
.dim{opacity:.38;filter:saturate(.6)}
.selc{transform:translateY(-7px)}
.selc .card{box-shadow:0 0 0 2.5px var(--gold),0 6px 14px rgba(0,0,0,.45)}
.hidden-hand{flex:1;display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.7);font-weight:700;font-size:13px;min-height:62px}

#controls{grid-template-columns:1fr 1.6fr}
#controls.three{grid-template-columns:1fr 1fr 1fr}
.cbtn.pku{background:rgba(255,255,255,.08);color:#f3e3c8;border:1.5px solid rgba(255,255,255,.18);font-size:18px}
.cbtn.go{background:linear-gradient(180deg,#5aa0ff,#2f6cf0);box-shadow:0 8px 24px rgba(47,108,240,.35);font-size:19px}
.cbtn.go:disabled{background:rgba(255,255,255,.06);box-shadow:none;color:rgba(255,255,255,.4)}
.cbtn.red{background:linear-gradient(180deg,#ff6b6b,#e0434f);box-shadow:0 8px 24px rgba(224,67,79,.35);font-size:17px}
.cbtn.grn{background:linear-gradient(180deg,#3ddc97,#1ea770);color:#062b1b;font-size:17px}
.hint{grid-column:1 / -1;font-size:13px;color:#c7ad8c;font-weight:600;text-align:center;margin-top:-4px}

.handoff{position:fixed;inset:0;z-index:25;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 30%,#2a3a8a,#0d1230);padding:30px;text-align:center}
.handoff h2{font-size:30px;font-weight:800;margin:14px 0 6px}
.handoff p{color:#b9c2ee;margin-bottom:22px}
.toast.tap{font-size:34px;letter-spacing:.06em;background:linear-gradient(160deg,#8fd0ff,#3c6bff);color:#fff;border:0;padding:14px 26px}

</style>
</head>

<section id="setup" class="screen"></section>
<section id="table" class="screen hidden">
  <header class="top">
    <div class="rd" id="rd">Round 1</div>
    <button class="iconbtn" id="menuBtn" aria-label="Menu">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><circle cx="4" cy="10" r="2"/><circle cx="10" cy="10" r="2"/><circle cx="16" cy="10" r="2"/></svg>
    </button>
  </header>
  <div class="felt" id="felt"></div>
  <div id="controls"></div>
</section>
<div id="handoff" class="handoff hidden"></div>
<div id="sheet" class="sheet hidden"><div class="sheet-card" id="sheetCard"></div></div>
<div id="toasts"></div>
